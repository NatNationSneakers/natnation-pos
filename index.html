<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nat.Nation Sneakers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#202124;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:265px;
    background:#101827;
    color:white;
    padding:25px 15px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo-box{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    width:78px;
    height:78px;
    background:white;
    color:#111827;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    margin:0 auto 12px;
}

.logo-box h2{
    margin:0;
    font-size:22px;
}

.logo-box p{
    margin:5px 0;
    color:#aeb7c7;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e8edf5;
    padding:15px 14px;
    text-align:left;
    border-radius:11px;
    font-size:16px;
}

.menu button:hover,
.menu button.active{
    background:#29364b;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:265px;
    width:calc(100% - 265px);
}

.topbar{
    height:85px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.topbar h1{
    font-size:22px;
    margin:0;
}

.status{
    font-weight:bold;
}

.status.ok{
    color:#138a36;
}

.status.error{
    color:#d93025;
}

.status.loading{
    color:#d98b00;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:30px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h2{
    font-size:30px;
    margin:0 0 5px;
}

.page-title p{
    color:#687386;
    margin:0;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:15px;
    padding:22px;
    margin-bottom:20px;
}

.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.search{
    flex:1;
}

input,
select{
    width:100%;
    padding:13px 14px;
    border:1px solid #ccd1d8;
    border-radius:9px;
    background:white;
}

.btn{
    border:0;
    border-radius:9px;
    padding:13px 18px;
    font-weight:bold;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-secondary{
    background:#e9edf3;
    color:#111827;
}

.btn-danger{
    background:#d93025;
    color:white;
}

.btn-success{
    background:#188038;
    color:white;
}

/* =========================
   PRODUCTS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.product-card{
    border:1px solid #ddd;
    border-radius:13px;
    overflow:hidden;
    background:white;
}

.product-image{
    height:200px;
    background:#f0f1f3;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    color:#9299a4;
    font-size:15px;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin:0 0 7px;
}

.product-info p{
    margin:5px 0;
    color:#687386;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#111827;
}

.stock{
    font-weight:bold;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:13px;
}

.actions button{
    flex:1;
}

/* =========================
   FORMS
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group label{
    font-weight:bold;
}

.form-group.full{
    grid-column:1/-1;
}

.preview{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
    margin-top:10px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f7f8fa;
}

/* =========================
   SALE
========================= */

.sale-layout{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    padding:13px 0;
}

.qty{
    display:flex;
    gap:7px;
    align-items:center;
}

.qty button{
    width:32px;
    height:32px;
    border:0;
    border-radius:7px;
}

.total{
    font-size:28px;
    font-weight:bold;
    text-align:right;
    margin-top:20px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:16px;
    padding:25px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

/* =========================
   ALERT
========================= */

.alert{
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.alert-error{
    background:#fde8e7;
    color:#a51d15;
}

.alert-success{
    background:#e8f5e9;
    color:#166534;
}

/* =========================
   PRINT
========================= */

.ticket{
    display:none;
}

@media print{

    body *{
        visibility:hidden;
    }

    .ticket,
    .ticket *{
        visibility:visible;
    }

    .ticket{
        display:block;
        position:absolute;
        left:0;
        top:0;
        width:80mm;
        padding:8mm;
        font-size:12px;
    }

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .sidebar{
        width:80px;
        padding:15px 8px;
    }

    .logo{
        width:55px;
        height:55px;
        font-size:28px;
    }

    .logo-box h2,
    .logo-box p{
        display:none;
    }

    .menu button{
        font-size:0;
        text-align:center;
    }

    .menu button::first-letter{
        font-size:20px;
    }

    .main{
        margin-left:80px;
        width:calc(100% - 80px);
    }

    .sale-layout{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo-box">

            <div class="logo">
                N
            </div>

            <h2>Nat.Nation</h2>
            <p>Sneakers</p>

        </div>

        <nav class="menu">

            <button onclick="irInicio()">🏠 Inicio</button>

            <button class="active" onclick="irProductos()">
                👟 Productos
            </button>

            <button onclick="irVenta()">
                🛒 Nueva venta
            </button>

            <button onclick="irClientes()">
                👤 Clientes
            </button>

            <button onclick="irReportes()">
                📊 Reportes
            </button>

            <button onclick="cargarTodo()">
                🔄 Actualizar
            </button>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <h1>Nat.Nation Sneakers</h1>

            <div id="status" class="status loading">
                🟡 Conectando...
            </div>

        </header>

        <section class="content" id="app-content"></section>

    </main>

</div>


<!-- =========================
     MODAL PRODUCTO
========================= -->

<div class="modal" id="productoModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitulo">
                Nuevo producto
            </h2>

            <button class="close" onclick="cerrarModal()">
                ×
            </button>

        </div>

        <div id="productoError"></div>

        <form id="productoForm">

            <input type="hidden" id="productoId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Modelo</label>
                    <input id="modelo" required>
                </div>

                <div class="form-group">
                    <label>Talla</label>
                    <input id="talla" required>
                </div>

                <div class="form-group">
                    <label>SKU</label>
                    <input id="sku">
                </div>

                <div class="form-group">
                    <label>Código de barras</label>
                    <input id="codigo_barras">
                </div>

                <div class="form-group">
                    <label>Precio de venta</label>
                    <input id="precio" type="number" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label>Costo</label>
                    <input id="costo" type="number" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label>Stock</label>
                    <input id="stock" type="number" min="0" required>
                </div>

                <div class="form-group">

                    <label>Fotografía</label>

                    <input
                        id="imagen"
                        type="file"
                        accept="image/*"
                    >

                    <img
                        id="preview"
                        class="preview"
                        style="display:none;"
                    >

                </div>

            </div>

            <br>

            <div style="display:flex;gap:10px;justify-content:flex-end;">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cerrarModal()">
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Guardar producto
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     TICKET
========================= -->

<div id="ticket" class="ticket"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://nasvzzdzkljozyhhjize.supabase.co";

/*
    IMPORTANTE:
    aquí va TU clave sb_publishable_...
    NO uses una sb_secret_...
*/

const SUPABASE_KEY =
    "sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DATOS
========================================================= */

let productos = [];
let clientes = [];
let ventas = [];
let carrito = [];

let paginaActual = "productos";


const NEGOCIO = {

    nombre:"Nat.Nation Sneakers",

    direccion:
    "Calle Juan Clímaco Ramírez SNVC, San Andrés, 55780 Jaltenco, Méx.",

    telefono:"5624570336"

};


/* =========================================================
   UTILIDADES
========================================================= */

function dinero(valor){

    return new Intl.NumberFormat(
        "es-MX",
        {
            style:"currency",
            currency:"MXN"
        }
    ).format(Number(valor || 0));

}


function esc(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setStatus(tipo,texto){

    const el =
        document.getElementById("status");

    el.className =
        "status " + tipo;

    el.textContent =
        texto;

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarTodo(){

    setStatus(
        "loading",
        "🟡 Conectando..."
    );

    /*
       Mostramos la interfaz inmediatamente.
       Así, aunque Supabase tenga un error,
       la página no queda vacía.
    */

    mostrarProductos();

    try{

        const productosResp =
            await supabaseClient
            .from("productos")
            .select("*")
            .order("created_at",{ascending:false});

        if(productosResp.error){

            throw new Error(
                "PRODUCTOS: " +
                productosResp.error.message
            );

        }


        const clientesResp =
            await supabaseClient
            .from("clientes")
            .select("*")
            .order("created_at",{ascending:false});

        if(clientesResp.error){

            throw new Error(
                "CLIENTES: " +
                clientesResp.error.message
            );

        }


        const ventasResp =
            await supabaseClient
            .from("ventas")
            .select("*")
            .order("fecha",{ascending:false});

        if(ventasResp.error){

            throw new Error(
                "VENTAS: " +
                ventasResp.error.message
            );

        }


        productos =
            productosResp.data || [];

        clientes =
            clientesResp.data || [];

        ventas =
            ventasResp.data || [];


        setStatus(
            "ok",
            "🟢 Conectado"
        );


        if(paginaActual === "productos"){
            mostrarProductos();
        }

        if(paginaActual === "inicio"){
            mostrarInicio();
        }

        if(paginaActual === "clientes"){
            mostrarClientes();
        }

        if(paginaActual === "venta"){
            mostrarVenta();
        }

        if(paginaActual === "reportes"){
            mostrarReportes();
        }


    }catch(error){

        console.error(error);

        setStatus(
            "error",
            "🔴 Error de conexión"
        );


        mostrarErrorConexion(
            error.message
        );

    }

}


/* =========================================================
   ERROR
========================================================= */

function mostrarErrorConexion(mensaje){

    const contenedor =
        document.getElementById("app-content");

    contenedor.innerHTML = `

        <div class="page-title">

            <h2>Productos</h2>

            <p>
                No se pudo consultar Supabase.
            </p>

        </div>

        <div class="alert alert-error">

            <strong>Error real:</strong>

            <br><br>

            ${esc(mensaje)}

        </div>

        <div class="card">

            <p>
                La página de GitHub está funcionando.
                El problema está en la conexión con Supabase.
            </p>

            <button
                class="btn btn-primary"
                onclick="cargarTodo()">
                🔄 Intentar nuevamente
            </button>

        </div>

    `;

}


/* =========================================================
   INICIO
========================================================= */

function irInicio(){

    paginaActual = "inicio";

    mostrarInicio();

}


function mostrarInicio(){

    const totalProductos =
        productos.length;

    const stock =
        productos.reduce(
            (s,p)=>s + Number(p.stock || 0),
            0
        );

    const totalClientes =
        clientes.length;

    const totalVentas =
        ventas.length;


    document.getElementById("app-content")
    .innerHTML = `

        <div class="page-title">

            <h2>Inicio</h2>

            <p>
                Resumen de Nat.Nation Sneakers.
            </p>

        </div>

        <div class="products-grid">

            <div class="card">

                <h3>👟 Productos</h3>

                <strong style="font-size:30px">
                    ${totalProductos}
                </strong>

            </div>

            <div class="card">

                <h3>📦 Stock</h3>

                <strong style="font-size:30px">
                    ${stock}
                </strong>

            </div>

            <div class="card">

                <h3>👤 Clientes</h3>

                <strong style="font-size:30px">
                    ${totalClientes}
                </strong>

            </div>

            <div class="card">

                <h3>💰 Ventas</h3>

                <strong style="font-size:30px">
                    ${totalVentas}
                </strong>

            </div>

        </div>

    `;

}


/* =========================================================
   PRODUCTOS
========================================================= */

function irProductos(){

    paginaActual = "productos";

    mostrarProductos();

}


function mostrarProductos(){

    const contenedor =
        document.getElementById("app-content");

    const termino =
        document.getElementById("buscarProducto")?.value
        ?.toLowerCase() || "";


    const filtrados =
        productos.filter(p => {

            return (

                String(p.modelo || "")
                    .toLowerCase()
                    .includes(termino)

                ||

                String(p.sku || "")
                    .toLowerCase()
                    .includes(termino)

                ||

                String(p.codigo_barras || "")
                    .toLowerCase()
                    .includes(termino)

            );

        });


    contenedor.innerHTML = `

        <div class="page-title">

            <h2>Productos</h2>

            <p>
                Administra tu inventario.
            </p>

        </div>


        <div class="card">

            <div class="toolbar">

                <input
                    id="buscarProducto"
                    class="search"
                    placeholder="Buscar producto, SKU o código..."
                    value="${esc(termino)}"
                    oninput="mostrarProductos()"
                >

                <button
                    class="btn btn-primary"
                    onclick="abrirNuevoProducto()">
                    + Nuevo producto
                </button>

            </div>


            ${
                filtrados.length === 0

                ?

                `<p>No hay productos registrados.</p>`

                :

                `<div class="products-grid">

                    ${filtrados.map(productoHTML).join("")}

                </div>`
            }

        </div>

    `;

}


function productoHTML(p){

    return `

        <div class="product-card">

            <div class="product-image">

                ${
                    p.imagen_url

                    ?

                    `<img
                        src="${esc(p.imagen_url)}"
                        alt="${esc(p.modelo)}"
                    >`

                    :

                    `<span class="no-image">
                        Sin fotografía
                    </span>`
                }

            </div>


            <div class="product-info">

                <h3>
                    ${esc(p.modelo)}
                </h3>

                <p>
                    Talla: ${esc(p.talla)}
                </p>

                <p>
                    SKU:
                    ${esc(p.sku || "-")}
                </p>

                <p class="price">
                    ${dinero(p.precio)}
                </p>

                <p class="stock">
                    Stock:
                    ${Number(p.stock || 0)}
                </p>


                <div class="actions">

                    <button
                        class="btn btn-secondary"
                        onclick="editarProducto('${p.id}')">
                        Editar
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="eliminarProducto('${p.id}')">
                        Eliminar
                    </button>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   NUEVO PRODUCTO
========================================================= */

function abrirNuevoProducto(){

    document.getElementById("productoForm")
        .reset();

    document.getElementById("productoId")
        .value = "";

    document.getElementById("modalTitulo")
        .textContent = "Nuevo producto";

    document.getElementById("preview")
        .style.display = "none";

    document.getElementById("productoError")
        .innerHTML = "";

    document.getElementById("productoModal")
        .classList.add("show");

}


function cerrarModal(){

    document.getElementById("productoModal")
        .classList.remove("show");

}


async function editarProducto(id){

    const p =
        productos.find(x => x.id === id);

    if(!p) return;


    document.getElementById("productoId")
        .value = p.id;

    document.getElementById("modelo")
        .value = p.modelo || "";

    document.getElementById("talla")
        .value = p.talla || "";

    document.getElementById("sku")
        .value = p.sku || "";

    document.getElementById("codigo_barras")
        .value = p.codigo_barras || "";

    document.getElementById("precio")
        .value = p.precio || 0;

    document.getElementById("costo")
        .value = p.costo || 0;

    document.getElementById("stock")
        .value = p.stock || 0;


    const preview =
        document.getElementById("preview");


    if(p.imagen_url){

        preview.src =
            p.imagen_url;

        preview.style.display =
            "block";

    }else{

        preview.style.display =
            "none";

    }


    document.getElementById("modalTitulo")
        .textContent = "Editar producto";


    document.getElementById("productoError")
        .innerHTML = "";


    document.getElementById("productoModal")
        .classList.add("show");

}


/* =========================================================
   PREVISUALIZAR IMAGEN
========================================================= */

document.getElementById("imagen")
.addEventListener("change",function(){

    const archivo =
        this.files[0];

    if(!archivo) return;


    const preview =
        document.getElementById("preview");


    preview.src =
        URL.createObjectURL(archivo);

    preview.style.display =
        "block";

});


/* =========================================================
   GUARDAR PRODUCTO
========================================================= */

document.getElementById("productoForm")
.addEventListener("submit",async function(e){

    e.preventDefault();


    const errorBox =
        document.getElementById("productoError");


    errorBox.innerHTML = "";


    const id =
        document.getElementById("productoId")
        .value;


    const modelo =
        document.getElementById("modelo")
        .value.trim();


    const talla =
        document.getElementById("talla")
        .value.trim();


    const sku =
        document.getElementById("sku")
        .value.trim();


    const codigo_barras =
        document.getElementById("codigo_barras")
        .value.trim();


    const precio =
        Number(document.getElementById("precio").value || 0);


    const costo =
        Number(document.getElementById("costo").value || 0);


    const stock =
        Number(document.getElementById("stock").value || 0);


    const archivo =
        document.getElementById("imagen")
        .files[0];


    try{

        let imagen_url =
            productos.find(p => p.id === id)
            ?.imagen_url || null;


        /* =========================
           SUBIR FOTO
        ========================= */

        if(archivo){

            const extension =
                archivo.name
                .split(".")
                .pop()
                .toLowerCase();


            const nombreArchivo =
                `${crypto.randomUUID()}.${extension}`;


            const ruta =
                `productos/${nombreArchivo}`;


            const upload =
                await supabaseClient
                .storage
                .from("pos")
                .upload(
                    ruta,
                    archivo,
                    {
                        upsert:false,
                        contentType:archivo.type
                    }
                );


            if(upload.error){

                throw new Error(
                    "No se pudo subir la fotografía: "
                    +
                    upload.error.message
                );

            }


            const publicUrl =
                supabaseClient
                .storage
                .from("pos")
                .getPublicUrl(ruta);


            imagen_url =
                publicUrl.data.publicUrl;

        }


        const datos = {

            modelo,

            talla,

            sku: sku || null,

            codigo_barras:
                codigo_barras || null,

            precio,

            costo,

            stock,

            imagen_url,

            activo:true

        };


        let respuesta;


        if(id){

            respuesta =
                await supabaseClient
                .from("productos")
                .update(datos)
                .eq("id",id);

        }else{

            respuesta =
                await supabaseClient
                .from("productos")
                .insert(datos);

        }


        if(respuesta.error){

            throw new Error(
                respuesta.error.message
            );

        }


        cerrarModal();

        await cargarTodo();


        alert(
            id
            ?
            "Producto actualizado correctamente."
            :
            "Producto guardado correctamente."
        );


    }catch(error){

        console.error(error);

        errorBox.innerHTML = `

            <div class="alert alert-error">

                ${esc(error.message)}

            </div>

        `;

    }

});

function mostrarProductosVenta(){

    const termino =
        document.getElementById("buscarVenta")
        ?.value
        ?.toLowerCase() || "";


    const lista =
        productos.filter(p =>

            Number(p.stock || 0) > 0

            &&

            (
                String(p.modelo || "")
                    .toLowerCase()
                    .includes(termino)

                ||

                String(p.sku || "")
                    .toLowerCase()
                    .includes(termino)

            )

        );


    const contenedor =
        document.getElementById("productosVenta");


    if(!contenedor) return;


    contenedor.innerHTML = lista.map(p => `

        <div
            class="cart-item"
            style="gap:15px">

            <div style="flex:1">

                <strong>
                    ${esc(p.modelo)}
                </strong>

                <br>

                Talla:
                ${esc(p.talla)}

                <br>

                ${dinero(p.precio)}

                <br>

                Stock:
                ${p.stock}

            </div>


            <button
                class="btn btn-primary"
                onclick="agregarCarrito('${p.id}')">

                Agregar

            </button>

        </div>

    `).join("");

}


function agregarCarrito(id){

    const producto =
        productos.find(p => p.id === id);

    if(!producto) return;


    const existente =
        carrito.find(p => p.id === id);


    if(existente){

        if(
            existente.cantidad
            <
            Number(producto.stock)
        ){

            existente.cantidad++;

        }

    }else{

        carrito.push({

            ...producto,

            cantidad:1

        });

    }


    mostrarCarrito();

}


function cambiarCantidad(id,delta){

    const item =
        carrito.find(p => p.id === id);

    if(!item) return;


    item.cantidad += delta;


    if(item.cantidad <= 0){

        carrito =
            carrito.filter(p => p.id !== id);

    }


    const producto =
        productos.find(p => p.id === id);


    if(
        producto
        &&
        item.cantidad > Number(producto.stock)
    ){

        item.cantidad =
            Number(producto.stock);

    }


    mostrarCarrito();

}


function mostrarCarrito(){

    const contenedor =
        document.getElementById("carrito");


    if(!contenedor) return;


    if(carrito.length === 0){

        contenedor.innerHTML =
            "<p>El carrito está vacío.</p>";

        const total =
            document.getElementById("totalVenta");

        if(total){
            total.textContent =
                dinero(0);
        }

        return;

    }


    let total = 0;


    contenedor.innerHTML =
        carrito.map(item => {

            const subtotal =
                Number(item.precio)
                *
                Number(item.cantidad);


            total += subtotal;


            return `

                <div class="cart-item">

                    <div>

                        <strong>
                            ${esc(item.modelo)}
                        </strong>

                        <br>

                        Talla ${esc(item.talla)}

                        <br>

                        ${dinero(subtotal)}

                    </div>


                    <div class="qty">

                        <button
                            onclick="cambiarCantidad('${item.id}',-1)">
                            −
                        </button>

                        <strong>
                            ${item.cantidad}
                        </strong>

                        <button
                            onclick="cambiarCantidad('${item.id}',1)">
                            +
                        </button>

                    </div>

                </div>

            `;

        }).join("");


    const totalEl =
        document.getElementById("totalVenta");


    if(totalEl){

        totalEl.textContent =
            dinero(total);

    }

}


async function finalizarVenta(){

    if(carrito.length === 0){

        alert(
            "Agrega al menos un producto."
        );

        return;

    }


    const metodo =
        document.getElementById("metodoPago")
        .value;


    const clienteId =
        document.getElementById("clienteVenta")
        .value || null;


    const efectivo =
        Number(
            document.getElementById(
                "efectivoRecibido"
            ).value || 0
        );


    const total =
        carrito.reduce(
            (s,p)=>
                s +
                Number(p.precio)
                *
                Number(p.cantidad),
            0
        );


    if(
        metodo === "efectivo"
        &&
        efectivo < total
    ){

        alert(
            "El efectivo recibido es menor al total."
        );

        return;

    }


    const cambio =
        metodo === "efectivo"
        ?
        efectivo - total
        :
        0;


    try{

        /* =========================
           FOLIO
        ========================= */

        const numero =
            ventas.length + 1;

        const folio =
            "NN-" +
            String(numero)
                .padStart(6,"0");


        /* =========================
           PUNTOS
        ========================= */

        const puntosGanados =
            Math.floor(total);


        /* =========================
           VENTA
        ========================= */

        const ventaRespuesta =
            await supabaseClient
            .from("ventas")
            .insert({

                folio,

                total,

                metodo_pago:
                    metodo,

                cliente_id:
                    clienteId,

                efectivo_recibido:
                    efectivo,

                cambio,

                puntos_ganados:
                    puntosGanados

            })
            .select()
            .single();


        if(ventaRespuesta.error){

            throw new Error(
                ventaRespuesta.error.message
            );

        }


        const venta =
            ventaRespuesta.data;


        /* =========================
           DETALLES
        ========================= */

        const detalles =
            carrito.map(item => ({

                venta_id:
                    venta.id,

                producto_id:
                    item.id,

                producto_nombre:
                    item.modelo,

                talla:
                    item.talla,

                cantidad:
                    item.cantidad,

                precio_unitario:
                    item.precio,

                subtotal:
                    Number(item.precio)
                    *
                    Number(item.cantidad)

            }));


        const detalleRespuesta =
            await supabaseClient
            .from("venta_detalles")
            .insert(detalles);


        if(detalleRespuesta.error){

            throw new Error(
                detalleRespuesta.error.message
            );

        }


        /* =========================
           ACTUALIZAR STOCK
        ========================= */

        for(const item of carrito){

            const nuevoStock =
                Number(item.stock)
                -
                Number(item.cantidad);


            const respuesta =
                await supabaseClient
                .from("productos")
                .update({
                    stock:nuevoStock
                })
                .eq("id",item.id);


            if(respuesta.error){

                throw new Error(
                    respuesta.error.message
                );

            }

        }


        /* =========================
           ACTUALIZAR PUNTOS
        ========================= */

        if(clienteId){

            const cliente =
                clientes.find(
                    c => c.id === clienteId
                );


            if(cliente){

                const nuevosPuntos =
                    Number(cliente.puntos || 0)
                    +
                    puntosGanados;


                const respuesta =
                    await supabaseClient
                    .from("clientes")
                    .update({
                        puntos:nuevosPuntos
                    })
                    .eq("id",clienteId);


                if(respuesta.error){

                    throw new Error(
                        respuesta.error.message
                    );

                }

            }

        }


        /* =========================
           TICKET
        ========================= */

        imprimirTicket({

            folio,

            fecha:new Date(),

            total,

            metodo,

            efectivo,

            cambio,

            puntosGanados

        });


        carrito = [];


        await cargarTodo();

        irVenta();


    }catch(error){

        console.error(error);

        alert(
            "No se pudo registrar la venta:\n\n"
            +
            error.message
        );

    }

}
