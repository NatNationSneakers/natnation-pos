<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nat.Nation Sneakers | Punto de Venta</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#222}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh;display:flex}

.sidebar{
 width:245px;background:#0d0d0d;color:#fff;min-height:100vh;
 padding:24px 16px;position:fixed;left:0;top:0;bottom:0;
 z-index:20
}

.logo-box{text-align:center;margin-bottom:28px}
.logo-preview{
 width:76px;height:76px;border-radius:18px;object-fit:cover;
 display:block;margin:0 auto 10px;background:#222
}
.logo-text{font-size:21px;font-weight:800}
.logo-sub{color:#f04f91;font-size:11px;font-weight:bold;margin-top:5px}

.menu{display:flex;flex-direction:column;gap:8px}
.menu button{
 width:100%;text-align:left;padding:14px;border-radius:10px;
 background:transparent;color:#ddd;font-weight:700
}
.menu button:hover,.menu button.active{
 background:#ef4d8d;color:#fff
}

.sidebar-bottom{
 position:absolute;left:16px;right:16px;bottom:18px
}
.sidebar-bottom button{
 width:100%;background:#202020;color:#ddd;padding:11px;border-radius:10px
}

.main{
 margin-left:245px;width:calc(100% - 245px);min-height:100vh
}

.topbar{
 height:72px;background:#fff;border-bottom:1px solid #e5e5e5;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 30px;position:sticky;top:0;z-index:10
}

.page-title{font-size:24px;font-weight:800}

.top-actions{display:flex;gap:10px;align-items:center}

.status{
 padding:9px 13px;border-radius:20px;
 background:#fff3cd;color:#92400e;font-size:13px;font-weight:bold
}

.content{padding:28px}

.btn{
 padding:11px 17px;border-radius:9px;font-weight:700
}
.btn-pink{background:#ef4d8d;color:#fff}
.btn-dark{background:#191919;color:#fff}
.btn-light{background:#eee;color:#222}
.btn-danger{background:#c62828;color:#fff}

.cards{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:18px;margin-bottom:24px
}

.card{
 background:#fff;border:1px solid #e8e8e8;border-radius:15px;
 padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.04)
}

.card-label{color:#777;font-size:13px}
.card-value{font-size:27px;font-weight:800;margin-top:7px}

.toolbar{
 background:#fff;border:1px solid #e8e8e8;border-radius:14px;
 padding:15px;display:flex;gap:12px;margin-bottom:18px
}

.search{
 flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:9px
}

.product-grid{
 display:grid;grid-template-columns:
 repeat(auto-fill,minmax(190px,1fr));gap:18px
}

.product-card{
 background:#fff;border:1px solid #e5e5e5;border-radius:14px;
 overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.04)
}

.product-photo{
 width:100%;height:175px;object-fit:cover;background:#f0f0f0
}

.no-photo{
 height:175px;display:flex;align-items:center;
 justify-content:center;font-size:50px;background:#f4f4f4
}

.product-info{padding:13px}
.product-name{font-weight:800}
.product-meta{color:#777;font-size:13px;margin-top:4px}
.product-price{font-size:19px;font-weight:800;margin-top:9px}
.stock{font-size:12px;margin-top:5px}
.stock.low{color:#d13d3d;font-weight:700}

.product-actions{
 display:flex;gap:7px;margin-top:12px
}
.product-actions button{
 flex:1;padding:9px;border-radius:8px
}

.table-wrap{
 background:#fff;border:1px solid #e5e5e5;
 border-radius:14px;overflow:auto
}

table{width:100%;border-collapse:collapse}
th,td{
 padding:12px;border-bottom:1px solid #eee;text-align:left
}
th{font-size:13px;color:#777;background:#fafafa}

.modal{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
 z-index:50;align-items:center;justify-content:center;padding:20px
}

.modal.show{display:flex}

.modal-box{
 width:min(800px,100%);max-height:92vh;overflow:auto;
 background:#fff;border-radius:18px;padding:25px
}

.close{
 float:right;font-size:28px;color:#777;background:none
}

.form-grid{
 display:grid;grid-template-columns:1fr 1fr;gap:14px
}

.field label{
 display:block;font-size:13px;font-weight:700;margin-bottom:6px
}

.field input,.field select{
 width:100%;padding:11px;border:1px solid #ddd;border-radius:8px
}

.full{grid-column:1/-1}

.form-actions{
 display:flex;justify-content:flex-end;
 gap:10px;margin-top:20px
}

.photo-upload{
 border:2px dashed #ddd;border-radius:14px;
 padding:18px;text-align:center
}

.photo-preview{
 width:150px;height:150px;object-fit:cover;
 border-radius:12px;margin:0 auto 12px
}

.upload-btn{
 display:inline-block;background:#ef4d8d;color:#fff;
 padding:11px 18px;border-radius:9px;font-weight:700;
 cursor:pointer
}

.photo-upload input[type=file]{display:none}

.sale-layout{
 display:grid;grid-template-columns:1fr 370px;gap:20px
}

.sale-products{
 display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}

.sale-product{
 background:#fff;border:1px solid #e5e5e5;
 border-radius:13px;overflow:hidden;cursor:pointer
}

.sale-product img,.sale-product .no-photo{
 width:100%;height:145px;object-fit:cover
}

.sale-product .no-photo{height:145px}

.sale-product-info{padding:10px}

.cart{
 background:#fff;border:1px solid #e5e5e5;border-radius:15px;
 padding:18px;position:sticky;top:92px;height:max-content
}

.cart-row{
 display:flex;gap:8px;align-items:center;
 padding:10px 0;border-bottom:1px solid #eee
}

.cart-row img{
 width:48px;height:48px;object-fit:cover;border-radius:7px
}

.cart-row-info{flex:1}

.total-box{
 margin-top:15px;padding-top:15px;border-top:2px solid #222
}

.total-line{
 display:flex;justify-content:space-between;margin:8px 0
}

.total-line.total{
 font-size:23px;font-weight:800
}

.payment-select{
 width:100%;padding:11px;border:1px solid #ddd;
 border-radius:8px;margin:8px 0
}

.notice{
 padding:12px 15px;border-radius:10px;
 background:#fff3cd;margin-bottom:15px
}

.muted{color:#777}
.small{font-size:12px}

#printArea{display:none}

@media(max-width:900px){
 .sidebar{width:190px}
 .main{margin-left:190px;width:calc(100% - 190px)}
 .cards{grid-template-columns:repeat(2,1fr)}
 .sale-layout{grid-template-columns:1fr}
 .cart{position:static}
}

@media(max-width:650px){
 .sidebar{
  width:72px;padding:12px 8px
 }
 .logo-text,.logo-sub,.menu span,.sidebar-bottom{display:none}
 .logo-preview{width:50px;height:50px}
 .menu button{text-align:center;padding:13px 5px;font-size:20px}
 .main{margin-left:72px;width:calc(100% - 72px)}
 .topbar{padding:0 15px}
 .page-title{font-size:18px}
 .content{padding:15px}
 .cards{grid-template-columns:1fr 1fr}
 .product-grid{grid-template-columns:1fr 1fr}
 .sale-products{grid-template-columns:1fr 1fr}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
}

@media print{
 body>*{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{
  display:block;position:absolute;left:0;top:0;
  width:80mm;background:#fff
 }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo-box">
<img id="logoImg" class="logo-preview" alt="Nat.Nation">
<div class="logo-text">Nat.Nation</div>
<div class="logo-sub">DONDE EMPIEZA TU ESTILO</div>
</div>

<nav class="menu">

<button id="navInicio" onclick="ir('inicio')">
🏠 <span>Inicio</span>
</button>

<button id="navVenta" onclick="ir('venta')">
🛒 <span>Nueva venta</span>
</button>

<button id="navProductos" onclick="ir('productos')">
👟 <span>Productos</span>
</button>

<button id="navClientes" onclick="ir('clientes')">
👤 <span>Clientes</span>
</button>

<button id="navPuntos" onclick="ir('puntos')">
⭐ <span>Puntos</span>
</button>

<button id="navReportes" onclick="ir('reportes')">
📊 <span>Reportes</span>
</button>

<button id="navConfig" onclick="ir('config')">
⚙️ <span>Configuración</span>
</button>

</nav>

<div class="sidebar-bottom">
<button onclick="location.reload()">↻ Actualizar</button>
</div>

</aside>


<main class="main">

<header class="topbar">

<div class="page-title" id="pageTitle">
Inicio
</div>

<div class="top-actions">

<div class="status" id="connectionStatus">
🟡 Conectando...
</div>

<button class="btn btn-pink" onclick="ir('venta')">
＋ Nueva venta
</button>

</div>

</header>

<section class="content" id="appContent"></section>

</main>

</div>


<div class="modal" id="modal">
<div class="modal-box" id="modalBox"></div>
</div>

<div id="printArea"></div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabase =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let inventario=[];
let clientes=[];
let ventas=[];
let carrito=[];
let configuracion={
 logo:"",
 puntosPorPeso:0.1
};

let paginaActual="inicio";


/* =========================================================
   UTILIDADES
   ========================================================= */

function dinero(n){
 return Number(n||0).toLocaleString(
  "es-MX",
  {
   style:"currency",
   currency:"MXN"
  }
 );
}


function esc(s){
 return String(s??"")
 .replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}


function abrirModal(html){
 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}


function cerrarModal(){
 document.getElementById("modal").classList.remove("show");
}


document.getElementById("modal").addEventListener(
 "click",
 function(e){
  if(e.target.id==="modal"){
   cerrarModal();
  }
 }
);


function errorMsg(e){
 console.error(e);
 return e?.message || "Ocurrió un error.";
}


function estadoConexion(texto,tipo="ok"){

 const el=document.getElementById("connectionStatus");

 if(!el)return;

 el.textContent=texto;

 if(tipo==="ok"){
  el.style.background="#e8f7ed";
  el.style.color="#166534";
 }

 if(tipo==="error"){
  el.style.background="#fee2e2";
  el.style.color="#991b1b";
 }

 if(tipo==="wait"){
  el.style.background="#fff3cd";
  el.style.color="#92400e";
 }
}


/* =========================================================
   CARGAR DATOS
   ========================================================= */

async function cargarDatos(){

 estadoConexion("🟡 Conectando...","wait");

 try{

  const productosResult=
   await supabase
   .from("productos")
   .select("*")
   .eq("activo",true)
   .order("modelo");

  if(productosResult.error)
   throw productosResult.error;


  const clientesResult=
   await supabase
   .from("clientes")
   .select("*")
   .order("nombre");

  if(clientesResult.error)
   throw clientesResult.error;


  const ventasResult=
   await supabase
   .from("ventas")
   .select(
    "id,folio,fecha,total,pago,efectivo_recibido,cambio,puntos,cliente_id,clientes(nombre)"
   )
   .order("fecha",{ascending:false})
   .limit(100);

  if(ventasResult.error)
   throw ventasResult.error;


  inventario=productosResult.data||[];
  clientes=clientesResult.data||[];
  ventas=ventasResult.data||[];


  configuracion=
   JSON.parse(
    localStorage.getItem("nn_config") ||
    '{"logo":"","puntosPorPeso":0.1}'
   );


  estadoConexion("🟢 Conectado","ok");

  await cargarLogoOnline();

 }catch(e){

  console.error(e);

  estadoConexion(
   "🔴 Error de conexión",
   "error"
  );

  throw e;
 }
}


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

async function ir(pagina){

 paginaActual=pagina;

 const titulos={
  inicio:"Inicio",
  venta:"Nueva venta",
  productos:"Productos",
  clientes:"Clientes",
  puntos:"Programa de puntos",
  reportes:"Reportes",
  config:"Configuración"
 };

 document.getElementById("pageTitle").textContent=
  titulos[pagina]||"Nat.Nation";


 const nav={
  inicio:"navInicio",
  venta:"navVenta",
  productos:"navProductos",
  clientes:"navClientes",
  puntos:"navPuntos",
  reportes:"navReportes",
  config:"navConfig"
 };


 document.querySelectorAll(".menu button")
 .forEach(b=>b.classList.remove("active"));


 const boton=document.getElementById(nav[pagina]);

 if(boton)
  boton.classList.add("active");


 try{

  await cargarDatos();


  if(pagina==="inicio")
   renderInicio();

  if(pagina==="venta")
   renderVenta();

  if(pagina==="productos")
   renderProductos();

  if(pagina==="clientes")
   renderClientes();

  if(pagina==="puntos")
   renderPuntos();

  if(pagina==="reportes")
   renderReportes();

  if(pagina==="config")
   renderConfig();

 }catch(e){

  document.getElementById("appContent").innerHTML=
  `
  <div class="notice">

   <strong>
   No se pudo cargar Supabase.
   </strong>

   <br><br>

   ${esc(errorMsg(e))}

  </div>
  `;
 }
}


/* =========================================================
   INICIO
   ========================================================= */

function renderInicio(){

 const pares=
  inventario.reduce(
   (a,p)=>a+Number(p.stock||0),
   0
  );

 const valor=
  inventario.reduce(
   (a,p)=>
    a+
    Number(p.precio||0)*
    Number(p.stock||0),
   0
  );

 const totalVentas=
  ventas.reduce(
   (a,v)=>a+Number(v.total||0),
   0
  );


 document.getElementById("appContent").innerHTML=
 `
 <div class="cards">

  <div class="card">
   <div class="card-label">
    Productos
   </div>
   <div class="card-value">
    ${inventario.length}
   </div>
  </div>

  <div class="card">
   <div class="card-label">
    Pares en existencia
   </div>
   <div class="card-value">
    ${pares}
   </div>
  </div>

  <div class="card">
   <div class="card-label">
    Valor del inventario
   </div>
   <div class="card-value">
    ${dinero(valor)}
   </div>
  </div>

  <div class="card">
   <div class="card-label">
    Ventas registradas
   </div>
   <div class="card-value">
    ${dinero(totalVentas)}
   </div>
  </div>

 </div>


 <div class="card">

  <h2>
   👋 Bienvenida a Nat.Nation Sneakers
  </h2>

  <p class="muted">
   Tu punto de venta está conectado.
  </p>

  <br>

  <button
   class="btn btn-pink"
   onclick="ir('venta')"
  >
   🛒 Comenzar una venta
  </button>

  <button
   class="btn btn-dark"
   onclick="ir('productos')"
  >
   👟 Ver productos
  </button>

 </div>
 `;
}


/* =========================================================
   PRODUCTOS
   ========================================================= */

function renderProductos(){

 const existencias=
  inventario.reduce(
   (a,p)=>a+Number(p.stock||0),
   0
  );


 const valor=
  inventario.reduce(
   (a,p)=>
    a+
    Number(p.precio||0)*
    Number(p.stock||0),
   0
  );


 const bajo=
  inventario.filter(
   p=>Number(p.stock)<=2
  ).length;


 document.getElementById("appContent").innerHTML=
 `
 <div class="cards">

  <div class="card">
   <div class="card-label">Productos</div>
   <div class="card-value">
    ${inventario.length}
   </div>
  </div>

  <div class="card">
   <div class="card-label">Pares</div>
   <div class="card-value">
    ${existencias}
   </div>
  </div>

  <div class="card">
   <div class="card-label">Valor inventario</div>
   <div class="card-value">
    ${dinero(valor)}
   </div>
  </div>

  <div class="card">
   <div class="card-label">Stock bajo</div>
   <div class="card-value">
    ${bajo}
   </div>
  </div>

 </div>


 <div class="toolbar">

  <input
   id="buscarProducto"
   class="search"
   placeholder="🔎 Buscar modelo, talla, color o SKU"
   oninput="filtrarProductos()"
  >

  <button
   class="btn btn-pink"
   onclick="abrirProducto()"
  >
   ＋ Agregar producto
  </button>

 </div>


 <div
  id="productosGrid"
  class="product-grid"
 ></div>
 `;


 pintarProductos(inventario);
}


function pintarProductos(lista){

 const grid=
  document.getElementById("productosGrid");

 if(!grid)return;


 if(!lista.length){

  grid.innerHTML=
  `
  <div
   class="card"
   style="grid-column:1/-1;text-align:center;padding:50px"
  >

   <div style="font-size:55px">
    👟
   </div>

   <h2>
    Aún no tienes productos
   </h2>

   <p>
    Agrega tu primer par.
   </p>

   <button
    class="btn btn-pink"
    onclick="abrirProducto()"
   >
    ＋ Agregar producto
   </button>

  </div>
  `;

  return;
 }


 grid.innerHTML=
 lista.map(p=>{

  const i=
   inventario.findIndex(
    x=>x.id===p.id
   );


  return `
  <div class="product-card">

   ${
    p.photo_url
    ?
    `<img
      class="product-photo"
      src="${esc(p.photo_url)}"
      alt="${esc(p.modelo)}"
     >`
    :
    `<div class="no-photo">
      👟
     </div>`
   }


   <div class="product-info">

    <div class="product-name">
     ${esc(p.modelo)}
    </div>

    <div class="product-meta">
     Talla ${esc(p.talla)}
     ${p.color?" · "+esc(p.color):""}
    </div>

    ${
     p.sku
     ?
     `<div class="product-meta">
       SKU: ${esc(p.sku)}
      </div>`
     :""
    }

    <div class="product-price">
     ${dinero(p.precio)}
    </div>

    <div
     class="stock ${Number(p.stock)<=2?"low":""}"
    >
     Existencia: ${p.stock}
    </div>

    <div class="product-actions">

     <button
      class="btn-light"
      onclick="editarProducto(${i})"
     >
      ✏️ Editar
     </button>

     <button
      class="btn-dark"
      onclick="eliminarProducto(${i})"
     >
      🗑️
     </button>

    </div>

   </div>

  </div>
  `;

 }).join("");
}


function filtrarProductos(){

 const q=
  (
   document.getElementById("buscarProducto")
   ?.value||""
  )
  .toLowerCase()
  .trim();


 pintarProductos(
  inventario.filter(p=>
   [
    p.modelo,
    p.talla,
    p.color,
    p.sku
   ].some(x=>
    String(x||"")
    .toLowerCase()
    .includes(q)
   )
  )
 );
}


/* =========================================================
   PRODUCTO - MODAL
   ========================================================= */

function abrirProducto(indice=null){

 const p=
  indice===null
  ?
  {}
  :
  inventario[indice];


 abrirModal(
 `
 <button
  class="close"
  onclick="cerrarModal()"
 >
  ×
 </button>

 <h2>
  ${indice===null?"＋ Agregar producto":"✏️ Editar producto"}
 </h2>


 <div class="form-grid">

  <div class="field">

   <label>
    Modelo *
   </label>

   <input
    id="prodModelo"
    value="${esc(p.modelo||"")}"
    placeholder="Ej. Nike Air Force"
   >

  </div>


  <div class="field">

   <label>
    SKU / Código
   </label>

   <input
    id="prodSKU"
    value="${esc(p.sku||"")}"
    placeholder="Ej. AF-001"
   >

  </div>


  <div class="field">

   <label>
    Talla *
   </label>

   <input
    id="prodTalla"
    value="${esc(p.talla||"")}"
    placeholder="Ej. 29"
   >

  </div>


  <div class="field">

   <label>
    Color
   </label>

   <input
    id="prodColor"
    value="${esc(p.color||"")}"
    placeholder="Ej. Blanco"
   >

  </div>


  <div class="field">

   <label>
    Precio de venta *
   </label>

   <input
    id="prodPrecio"
    type="number"
    step="0.01"
    min="0"
    value="${p.precio??""}"
   >

  </div>


  <div class="field">

   <label>
    Costo
   </label>

   <input
    id="prodCosto"
    type="number"
    step="0.01"
    min="0"
    value="${p.costo??""}"
   >

  </div>


  <div class="field">

   <label>
    Existencia *
   </label>

   <input
    id="prodStock"
    type="number"
    min="0"
    step="1"
    value="${p.stock??""}"
   >

  </div>


  <div class="field">

   <label>
    Foto

function previsualizarProducto(input){

 const file=input.files?.[0];

 const img=
  document.getElementById("productoPreview");

 if(!file||!img)return;

 img.src=
  URL.createObjectURL(file);

 img.style.display="block";
}


async function subirImagenProducto(file){

 const ext=
  (
   file.name.split(".").pop()||
   "jpg"
  )
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");


 const path=
  `productos/${crypto.randomUUID()}.${ext}`;


 const up=
  await supabase.storage
  .from("pos")
  .upload(
   path,
   file,
   {
    upsert:false,
    contentType:file.type,
    cacheControl:"31536000"
   }
  );


 if(up.error)
  throw up.error;


 return supabase.storage
  .from("pos")
  .getPublicUrl(path)
  .data
  .publicUrl;
}


async function guardarProducto(indice){

 const data={
  modelo:
   document.getElementById("prodModelo")
   .value.trim(),

  sku:
   document.getElementById("prodSKU")
   .value.trim()||null,

  talla:
   document.getElementById("prodTalla")
   .value.trim(),

  color:
   document.getElementById("prodColor")
   .value.trim(),

  precio:
   Number(
    document.getElementById("prodPrecio")
    .value
   ),

  costo:
   Number(
    document.getElementById("prodCosto")
    .value||0
   ),

  stock:
   Number(
    document.getElementById("prodStock")
    .value
   ),

  photo_url:
   document.getElementById("prodFoto")
   .value.trim()||null
 };


 const archivo=
  document.getElementById("prodFotoArchivo")
  ?.files?.[0];


 if(
  !data.modelo||
  !data.talla||
  !Number.isFinite(data.precio)||
  data.precio<0||
  !Number.isInteger(data.stock)||
  data.stock<0
 ){

  alert(
   "Completa modelo, talla, precio y existencia correctamente."
  );

  return;
 }


 try{

  if(archivo){

   data.photo_url=
    await subirImagenProducto(archivo);

  }


  let r;


  if(indice===null){

   r=
    await supabase
    .from("productos")
    .insert(data)
    .select()
    .single();

  }else{

   r=
    await supabase
    .from("productos")
    .update(data)
    .eq(
     "id",
     inventario[indice].id
    )
    .select()
    .single();

  }


  if(r.error)
   throw r.error;


  cerrarModal();

  await ir("productos");


 }catch(e){

  alert(
   "No se pudo guardar el producto:\n\n"+
   errorMsg(e)
  );

 }
}

function agregarCarrito(i){

 const p=inventario[i];

 if(!p)return;


 const existente=
  carrito.find(
   x=>x.id===p.id
  );


 if(existente){

  if(existente.qty<
     Number(p.stock)
  ){

   existente.qty++;

  }else{

   alert("No hay más existencia.");

  }

 }else{

  if(Number(p.stock)<=0){

   alert("Este producto no tiene existencia.");

   return;
  }


  carrito.push({
   id:p.id,
   qty:1
  });

 }


 pintarCarrito();
}


function cambiarCantidad(i,cantidad){

 const item=carrito[i];

 if(!item)return;


 const p=
  inventario.find(
   x=>x.id===item.id
  );


 if(!p)return;


 item.qty+=cantidad;


 if(item.qty<=0){

  carrito.splice(i,1);

 }else if(
  item.qty>Number(p.stock)
 ){

  item.qty=Number(p.stock);

 }


 pintarCarrito();
}

 );

async function finalizarVenta(){

 if(!carrito.length){

  alert(
   "Agrega al menos un producto."
  );

  return;
 }


 const total=
  totalCarrito();


 const pago=
  document.getElementById(
   "pagoVenta"
  ).value;


 const recibido=
  Number(
   document.getElementById(
    "efectivoRecibido"
   )?.value||0
  );


 if(
  pago==="Efectivo" &&
  recibido<total
 ){

  alert(
   "El efectivo recibido es menor que el total."
  );

  return;
 }


 const clienteId=
  document.getElementById(
   "clienteVenta"
  ).value||null;


 const items=
  carrito.map(
   x=>({
    producto_id:x.id,
    cantidad:x.qty
   })
  );


 try{

  const r=
   await supabase.rpc(
    "registrar_venta",
    {
     p_cliente_id:clienteId,
     p_pago:pago,
     p_efectivo:
      pago==="Efectivo"
      ?
      recibido
      :
      0,
     p_items:items
    }
   );


  if(r.error)
   throw r.error;


  const result=r.data;


  const venta=
   await supabase
   .from("ventas")
   .select(
    "id,folio,fecha,total,pago,efectivo_recibido,cambio,puntos,cliente_id,clientes(nombre)"
   )
   .eq(
    "id",
    result.venta_id
   )
   .single();


  if(venta.error)
   throw venta.error;


  imprimirTicket(
   venta.data
  );


  carrito=[];


  await ir("venta");


  alert(
   "Venta registrada: "+
   result.folio
  );


 }catch(e){

  alert(
   "No se pudo registrar la venta:\n\n"+
   errorMsg(e)
  );

 }
}

function renderConfig(){

 document.getElementById("appContent").innerHTML=
 `
 <div class="card">

  <h2>
   ⚙️ Configuración
  </h2>

  <p class="muted">
   Sube aquí el logo de Nat.Nation.
   Se guardará en Supabase para que aparezca
   en todos tus dispositivos.
  </p>


  <div
   class="photo-upload"
   style="max-width:360px;margin-top:15px"
  >

   <img
    id="configLogoPreview"
    class="photo-preview"
    style="
     display:${configuracion.logo?"block":"none"}
    "
    src="${esc(configuracion.logo||"")}"
   >


   <label
    class="upload-btn"
    for="logoArchivo"
   >
    🖼️ Subir logo
   </label>


   <input
    id="logoArchivo"
    type="file"
    accept="image/*"
    onchange="previsualizarLogo(this)"
   >

  </div>


  <button
   class="btn btn-pink"
   style="margin-top:15px"
   onclick="guardarLogo()"
  >
   💾 Guardar logo
  </button>

 </div>
 `;
}


function previsualizarLogo(input){

 const f=input.files?.[0];

 const img=
  document.getElementById(
   "configLogoPreview"
  );


 if(!f||!img)return;


 img.src=
  URL.createObjectURL(f);

 img.style.display="block";
}


async function guardarLogo(){

 const f=
  document.getElementById(
   "logoArchivo"
  )?.files?.[0];


 if(!f){

  alert(
   "Selecciona una imagen para el logo."
  );

  return;
 }


 try{

  const up=
   await supabase.storage
   .from("pos")
   .upload(
    "branding/logo",
    f,
    {
     upsert:true,
     contentType:f.type,
     cacheControl:"0"
    }
   );


  if(up.error)
   throw up.error;


  const url=
   supabase.storage
   .from("pos")
   .getPublicUrl(
    "branding/logo"
   )
   .data
   .publicUrl;


  configuracion.logo=
   url+"?t="+Date.now();


  localStorage.setItem(
   "nn_config",
   JSON.stringify(configuracion)
  );


  actualizarLogo();


  alert(
   "✅ Logo guardado correctamente."
  );


 }catch(e){

  alert(
   "No se pudo subir el logo:\n\n"+
   errorMsg(e)
  );

 }
}


async function cargarLogoOnline(){

 try{

  const url=
   supabase.storage
   .from("pos")
   .getPublicUrl(
    "branding/logo"
   )
   .data
   .publicUrl;


  if(url){

   configuracion.logo=
    url+"?t="+Date.now();

   actualizarLogo();

  }

 }catch(e){

  console.warn(
   "Logo no disponible",
   e
  );

 }
}


function actualizarLogo(){

 const img=
  document.getElementById(
   "logoImg"
  );


 if(!img)return;


 if(configuracion.logo){

  img.src=
   configuracion.logo;

 }else{

  img.removeAttribute("src");

 }
}
