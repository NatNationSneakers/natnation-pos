<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
    --negro:#101010;
    --negro2:#171717;
    --rosa:#ff4f9a;
    --rosa2:#ff77b4;
    --rosa-claro:#fff0f7;
    --gris:#f7f7f8;
    --gris2:#e9e9ec;
    --texto:#222;
    --muted:#777;
    --blanco:#fff;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--gris);
    color:var(--texto);
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR NEGRO
========================= */

.sidebar{
    width:250px;
    background:var(--negro);
    color:white;
    padding:25px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:100;
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo-button{
    width:88px;
    height:88px;
    margin:auto;
    border-radius:18px;
    overflow:hidden;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid #fff;
    padding:0;
}

.logo-button img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#111;
    font-size:38px;
    font-weight:900;
}

.logo h2{
    margin:12px 0 2px;
    font-size:22px;
}

.logo span{
    color:#aaa;
    font-size:14px;
}

.logo-upload{
    display:inline-block;
    margin-top:10px;
    padding:7px 12px;
    border-radius:8px;
    background:var(--rosa);
    color:white;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.logo-upload input{
    display:none;
}

/* =========================
   MENU
========================= */

.menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu button{
    width:100%;
    background:transparent;
    color:#ddd;
    padding:14px 15px;
    border-radius:10px;
    text-align:left;
    font-weight:600;
    transition:.2s;
}

.menu button:hover{
    background:#252525;
    color:white;
}

.menu button.active{
    background:var(--rosa);
    color:white;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid var(--gris2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.topbar h1{
    margin:0;
    font-size:22px;
}

.status{
    font-size:14px;
    font-weight:bold;
}

.status.ok{
    color:#129447;
}

.status.error{
    color:#d62828;
}

.content{
    padding:30px;
}

.alert{
    background:#ffe2e2;
    color:#a40000;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

/* =========================
   TITULOS
========================= */

h2{
    margin:0 0 6px;
    font-size:29px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:25px;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.card{
    background:white;
    border:1px solid var(--gris2);
    border-radius:14px;
    padding:22px;
}

.card small{
    color:var(--muted);
}

.card strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

/* =========================
   PANELES
========================= */

.panel{
    background:white;
    border:1px solid var(--gris2);
    border-radius:14px;
    padding:22px;
    margin-bottom:22px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.panel-header h3{
    margin:0;
}

.search{
    width:100%;
    border:1px solid #d5d5da;
    border-radius:9px;
    padding:13px 14px;
    outline:none;
}

.search:focus{
    border-color:var(--rosa);
    box-shadow:0 0 0 3px rgba(255,79,154,.12);
}

/* =========================
   BOTONES ROSAS
========================= */

.btn{
    padding:12px 17px;
    border-radius:9px;
    font-weight:bold;
    transition:.2s;
}

.btn-primary{
    background:var(--rosa);
    color:white;
}

.btn-primary:hover{
    background:#ed3988;
}

.btn-secondary{
    background:#f1f1f3;
    color:#222;
}

.btn-secondary:hover{
    background:#e4e4e7;
}

.btn-danger{
    background:#ffe5ec;
    color:#c92855;
}

.btn-danger:hover{
    background:#ffd5e1;
}

/* =========================
   PRODUCTOS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}

.product{
    border:1px solid var(--gris2);
    border-radius:13px;
    overflow:hidden;
    background:white;
}

.product-img{
    width:100%;
    height:210px;
    background:#f1f1f3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-img{
    font-size:50px;
    color:#bbb;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin:0 0 6px;
}

.product-info p{
    margin:5px 0;
    color:var(--muted);
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#111!important;
    margin-top:10px!important;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.product-actions button{
    flex:1;
}

/* =========================
   TABLAS
========================= */

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:13px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.table th{
    font-size:13px;
    color:#777;
}

.empty{
    padding:35px;
    text-align:center;
    color:#777;
}

/* =========================
   MODALES
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:min(700px,100%);
    max-height:92vh;
    overflow:auto;
    border-radius:16px;
    padding:27px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.modal-header h3{
    margin:0;
    font-size:23px;
}

.close{
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:bold;
    font-size:14px;
}

.field input,
.field select{
    padding:12px;
    border:1px solid #d2d2d7;
    border-radius:9px;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:var(--rosa);
}

.preview{
    width:150px;
    height:150px;
    border-radius:12px;
    background:#f1f1f3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

/* =========================
   VENTA
========================= */

.cart-layout{
    display:grid;
    grid-template-columns:1fr 390px;
    gap:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    width:32px;
    height:32px;
    border-radius:7px;
    background:#eee;
}

.total{
    font-size:26px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    margin:20px 0;
}

/* =========================
   CLIP
========================= */

.clip-box{
    margin-top:18px;
    padding:18px;
    border-radius:13px;
    background:#fff0f7;
    border:1px solid #ffc1dc;
    text-align:center;
}

.clip-icon{
    width:58px;
    height:58px;
    margin:0 auto 10px;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.clip-box strong{
    display:block;
    font-size:18px;
}

.clip-box span{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:13px;
}

/* =========================
   TICKET
========================= */

.ticket{
    display:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .cart-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .app{
        display:block;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .content{
        padding:18px;
    }

    .topbar{
        padding:0 18px;
    }
}

/* =========================
   IMPRESIÓN
========================= */

@media print{

    body *{
        visibility:hidden;
    }

    .ticket,
    .ticket *{
        visibility:visible;
    }

    .ticket{
        display:block;
        position:absolute;
        left:0;
        top:0;
        width:80mm;
        padding:5mm;
        font-family:Arial,sans-serif;
        color:#000;
        background:white;
    }
}
</style>
</head>
