<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | Punto de Venta</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f8;
  color:#222;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

.app{
  min-height:100vh;
  display:flex;
}

/* ===== BARRA LATERAL TIPO LOYVERSE ===== */
.sidebar{
  width:245px;
  background:#101010;
  color:white;
  min-height:100vh;
  padding:24px 16px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:20;
}
.logo-box{
  text-align:center;
  margin-bottom:28px;
}
.logo-preview{
  width:74px;
  height:74px;
  border-radius:18px;
  object-fit:cover;
  display:block;
  margin:0 auto 10px;
  background:#222;
}
.logo-text{
  font-size:20px;
  font-weight:800;
  line-height:1.05;
}
.logo-sub{
  color:#f58ab4;
  font-size:11px;
  margin-top:5px;
}
.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.menu button{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border-radius:10px;
  background:transparent;
  color:#ddd;
  font-weight:700;
}
.menu button:hover{background:#292929}
.menu button.active{
  background:#ef4d8d;
  color:#fff;
}
.sidebar-bottom{
  position:absolute;
  left:16px;
  right:16px;
  bottom:18px;
}
.sidebar-bottom button{
  width:100%;
  background:#222;
  color:#ddd;
  padding:11px;
  border-radius:10px;
}

/* ===== CONTENIDO ===== */
.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}
.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid #e5e5e5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}
.page-title{
  font-size:24px;
  font-weight:800;
}
.top-actions{
  display:flex;
  gap:10px;
}
.btn{
  padding:11px 17px;
  border-radius:9px;
  font-weight:700;
}
.btn-pink{background:#ef4d8d;color:white}
.btn-dark{background:#191919;color:white}
.btn-light{background:#eee;color:#222}
.content{
  padding:28px;
}

/* ===== TARJETAS / DASHBOARD ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:24px;
}
.card{
  background:white;
  border:1px solid #e8e8e8;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}
.card-label{color:#777;font-size:13px}
.card-value{font-size:27px;font-weight:800;margin-top:7px}

/* ===== PRODUCTOS ===== */
.toolbar{
  background:white;
  border:1px solid #e8e8e8;
  border-radius:14px;
  padding:15px;
  display:flex;
  gap:12px;
  margin-bottom:18px;
}
.search{
  flex:1;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:9px;
}
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:18px;
}
.product-card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}
.product-photo{
  width:100%;
  height:175px;
  object-fit:cover;
  background:#f0f0f0;
}
.no-photo{
  height:175px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  background:#f4f4f4;
}
.product-info{padding:13px}
.product-name{font-weight:800}
.product-meta{color:#777;font-size:13px;margin-top:4px}
.product-price{font-size:19px;font-weight:800;margin-top:9px}
.stock{font-size:12px;margin-top:5px}
.stock.low{color:#d13d3d;font-weight:700}
.product-actions{display:flex;gap:7px;margin-top:12px}
.product-actions button{flex:1;padding:9px;border-radius:8px}

/* ===== TABLAS ===== */
.table-wrap{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:auto;
}
table{width:100%;border-collapse:collapse}
th,td{padding:14px;border-bottom:1px solid #eee;text-align:left}
th{font-size:13px;color:#777;background:#fafafa}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.modal-box{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:25px;
}
.close{
  float:right;
  font-size:28px;
  color:#777;
  background:none;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field input,.field select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
}
.full{grid-column:1/-1}

/* FOTO */
.photo-upload{
  border:2px dashed #ddd;
  border-radius:14px;
  padding:18px;
  text-align:center;
}
.photo-preview{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:12px;
  display:none;
  margin:0 auto 12px;
}
.photo-upload input{display:none}
.upload-btn{
  display:inline-block;
  background:#ef4d8d;
  color:white;
  padding:11px 18px;
  border-radius:9px;
  font-weight:700;
}
.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* ===== VENTA ===== */
.sale-layout{
  display:grid;
  grid-template-columns:1fr 370px;
  gap:20px;
}
.sale-products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.sale-product{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
}
.sale-product img,.sale-product .no-photo{
  width:100%;
  height:145px;
  object-fit:cover;
}
.sale-product .no-photo{height:145px}
.sale-product-info{padding:10px}
.cart{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:15px;
  padding:18px;
  position:sticky;
  top:92px;
  height:max-content;
}
.cart-row{
  display:flex;
  gap:8px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.cart-row img{
  width:48px;height:48px;object-fit:cover;border-radius:7px;
}
.cart-row-info{flex:1}
.total-box{
  margin-top:15px;
  padding-top:15px;
  border-top:2px solid #222;
}
.total-line{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
.total-line.total{
  font-size:23px;
  font-weight:800;
}
.payment-select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:8px 0;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .sidebar{width:190px}
  .main{margin-left:190px;width:calc(100% - 190px)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .sale-layout{grid-template-columns:1fr}
  .cart{position:static}
}
@media(max-width:650px){
  .sidebar{
    width:72px;
    padding:12px 8px;
  }
  .logo-text,.logo-sub,.menu span,.sidebar-bottom{display:none}
  .logo-preview{width:50px;height:50px}
  .menu button{text-align:center;padding:13px 5px;font-size:20px}
  .main{margin-left:72px;width:calc(100% - 72px)}
  .topbar{padding:0 15px}
  .page-title{font-size:18px}
  .content{padding:15px}
  .cards{grid-template-columns:1fr 1fr}
  .product-grid{grid-template-columns:1fr 1fr}
  .sale-products{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
}

/* IMPRESIÓN */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{
    display:block;
    position:absolute;
    left:0;
    top:0;
    width:80mm;
    background:white;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo-box">
      <img id="logoImg" class="logo-preview" alt="Logo">
      <div class="logo-text">Nat.Nation</div>
      <div class="logo-sub">DONDE EMPIEZA TU ESTILO</div>
    </div>

    <nav class="menu">
      <button id="navVenta" onclick="ir('venta')">🛒 <span>Venta</span></button>
      <button id="navProductos" onclick="ir('productos')">👟 <span>Productos</span></button>
      <button id="navClientes" onclick="ir('clientes')">👤 <span>Clientes</span></button>
      <button id="navPuntos" onclick="ir('puntos')">⭐ <span>Puntos</span></button>
      <button id="navReportes" onclick="ir('reportes')">📊 <span>Reportes</span></button>
      <button id="navConfig" onclick="ir('config')">⚙️ <span>Configuración</span></button>
    </nav>

    <div class="sidebar-bottom">
      <button onclick="alert('Nat.Nation Sneakers\\nPunto de Venta')">ℹ️ Acerca de</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">Venta</div>
      <div class="top-actions">
        <button class="btn btn-light" onclick="ir('productos')">👟 Productos</button>
        <button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button>
      </div>
    </header>

    <section class="content" id="appContent"></section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="printArea"></div>

<script>
/* =========================================================
   NAT.NATION SNEAKERS - POS
   Fotos: se pueden subir directamente desde el dispositivo.
   En esta versión se guardan localmente en el navegador.
   ========================================================= */

let inventario = leer("nn_inventario", []);
let clientes = leer("nn_clientes", []);
let ventas = leer("nn_ventas", []);
let configuracion = leer("nn_config", {
  logo:"",
  puntosPorPeso:0.1
});
let carrito = [];
let fotoTemporal = "";
let paginaActual = "venta";

function leer(clave, defecto){
  try{
    const x = localStorage.getItem(clave);
    return x ? JSON.parse(x) : defecto;
  }catch(e){
    return defecto;
  }
}

function guardar(){
  localStorage.setItem("nn_inventario",JSON.stringify(inventario));
  localStorage.setItem("nn_clientes",JSON.stringify(clientes));
  localStorage.setItem("nn_ventas",JSON.stringify(ventas));
  localStorage.setItem("nn_config",JSON.stringify(configuracion));
}

function dinero(n){
  return Number(n||0).toLocaleString("es-MX",{
    style:"currency",
    currency:"MXN"
  });
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function abrirModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}
function cerrarModal(){
  document.getElementById("modal").classList.remove("show");
}
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") cerrarModal();
});

function activarNav(id){
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  const b=document.getElementById(id);
  if(b)b.classList.add("active");
}

function ir(pagina){
  paginaActual=pagina;

  const titulos={
    venta:"Venta",
    productos:"Productos",
    clientes:"Clientes",
    puntos:"Programa de puntos",
    reportes:"Reportes",
    config:"Configuración"
  };

  document.getElementById("pageTitle").textContent=titulos[pagina]||"Nat.Nation";

  const nav={
    venta:"navVenta",
    productos:"navProductos",
    clientes:"navClientes",
    puntos:"navPuntos",
    reportes:"navReportes",
    config:"navConfig"
  };

  activarNav(nav[pagina]);

  if(pagina==="venta") renderVenta();
  if(pagina==="productos") renderProductos();
  if(pagina==="clientes") renderClientes();
  if(pagina==="puntos") renderPuntos();
  if(pagina==="reportes") renderReportes();
  if(pagina==="config") renderConfig();
}

/* =========================
   PRODUCTOS / INVENTARIO
   ========================= */

function renderProductos(){
  const totalExistencias=inventario.reduce((a,p)=>a+Number(p.stock||0),0);

  document.getElementById("appContent").innerHTML=`
    <div class="cards">
      <div class="card">
        <div class="card-label">Productos</div>
        <div class="card-value">${inventario.length}</div>
      </div>
      <div class="card">
        <div class="card-label">Pares en existencia</div>
        <div class="card-value">${totalExistencias}</div>
      </div>
      <div class="card">
        <div class="card-label">Valor del inventario</div>
        <div class="card-value">${dinero(inventario.reduce((a,p)=>a+Number(p.price||0)*Number(p.stock||0),0))}</div>
      </div>
      <div class="card">
        <div class="card-label">Stock bajo</div>
        <div class="card-value">${inventario.filter(p=>Number(p.stock)<=2).length}</div>
      </div>
    </div>

    <div class="toolbar">
      <input id="buscarProducto" class="search"
        placeholder="🔎 Buscar por modelo, talla, color o SKU..."
        oninput="filtrarProductos()">
      <button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button>
    </div>

    <div id="productosGrid" class="product-grid"></div>
  `;

  pintarProductos(inventario);
}

function pintarProductos(lista){
  const grid=document.getElementById("productosGrid");
  if(!grid)return;

  if(!lista.length){
    grid.innerHTML=`
      <div class="card" style="grid-column:1/-1;text-align:center;padding:50px">
        <div style="font-size:55px">👟</div>
        <h2>Aún no tienes productos</h2>
        <p>Agrega tu primer par y podrás subirle su foto desde tu dispositivo.</p>
        <button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button>
      </div>`;
    return;
  }

  grid.innerHTML=lista.map((p,i)=>{
    const realIndex=inventario.indexOf(p);
    return `
      <div class="product-card">
        ${p.photo
          ? `<img class="product-photo" src="${p.photo}" alt="${esc(p.model)}">`
          : `<div class="no-photo">👟</div>`}

        <div class="product-info">
          <div class="product-name">${esc(p.model)}</div>
          <div class="product-meta">
            Talla ${esc(p.size)}
            ${p.color ? " · "+esc(p.color) : ""}
          </div>
          ${p.sku ? `<div class="product-meta">SKU: ${esc(p.sku)}</div>` : ""}
          <div class="product-price">${dinero(p.price)}</div>
          <div class="stock ${Number(p.stock)<=2?"low":""}">
            Existencia: ${Number(p.stock)}
          </div>

          <div class="product-actions">
            <button class="btn-light" onclick="editarProducto(${realIndex})">✏️ Editar</button>
            <button class="btn-dark" onclick="eliminarProducto(${realIndex})">🗑️</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function filtrarProductos(){
  const q=(document.getElementById("buscarProducto")?.value||"").toLowerCase().trim();

  const lista=inventario.filter(p=>
    String(p.model||"").toLowerCase().includes(q) ||
    String(p.size||"").toLowerCase().includes(q) ||
    String(p.color||"").toLowerCase().includes(q) ||
    String(p.sku||"").toLowerCase().includes(q)
  );

  pintarProductos(lista);
}

function abrirProducto(indice=null){
  fotoTemporal = indice!==null ? (inventario[indice].photo||"") : "";

  abrirModal(`
    <button class="close" onclick="cerrarModal()">×</button>
    <h2>${indice===null?"＋ Agregar producto":"✏️ Editar producto"}</h2>
    <p style="color:#777">Puedes seleccionar la foto directamente desde tu iPhone, iPad, Mac o computadora.</p>

    <div class="form-grid">

      <div class="field full">
        <label>Foto del producto</label>
        <div class="photo-upload">
          <img id="previewFoto" class="photo-preview"
               src="${fotoTemporal}" style="${fotoTemporal?"display:block":""}">
          <div id="fotoIcono" style="${fotoTemporal?"display:none":""};font-size:45px">👟</div>
          <p id="fotoTexto">${fotoTemporal?"Foto seleccionada":"No hay foto seleccionada"}</p>

          <label class="upload-btn">
            📷 Subir foto
            <input id="fotoProducto" type="file" accept="image/*" onchange="cargarFoto(this)">
          </label>

          ${fotoTemporal?`<button class="btn btn-light" type="button" onclick="quitarFoto()">Quitar foto</button>`:""}
        </div>
      </div>

      <div class="field">
        <label>Modelo *</label>
        <input id="prodModelo" value="${indice!==null?esc(inventario[indice].model):""}" placeholder="Ej. Nike Air Force">
      </div>

      <div class="field">
        <label>SKU / Código</label>
        <input id="prodSKU" value="${indice!==null?esc(inventario[indice].sku||""):""}" placeholder="Ej. AF-001">
      </div>

      <div class="field">
        <label>Talla *</label>
        <input id="prodTalla" value="${indice!==null?esc(inventario[indice].size):""}" placeholder="Ej. 29">
      </div>

      <div class="field">
        <label>Color</label>
        <input id="prodColor" value="${indice!==null?esc(inventario[indice].color||""):""}" placeholder="Ej. Blanco">
      </div>

      <div class="field">
        <label>Precio de venta *</label>
        <input id="prodPrecio" type="number" step="0.01" min="0"
          value="${indice!==null?Number(inventario[indice].price):""}" placeholder="899">
      </div>

      <div class="field">
        <label>Existencia *</label>
        <input id="prodStock" type="number" min="0" step="1"
          value="${indice!==null?Number(inventario[indice].stock):""}" placeholder="5">
      </div>

    </div>

    <div class="form-actions">
      <button class="btn btn-light" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-pink" onclick="guardarProducto(${indice===null?"null":indice})">
        💾 Guardar producto
      </button>
    </div>
  `);
}

function cargarFoto(input){
  const file=input.files?.[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Selecciona una imagen.");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(e){
    fotoTemporal=e.target.result;

    const img=document.getElementById("previewFoto");
    const icon=document.getElementById("fotoIcono");
    const texto=document.getElementById("fotoTexto");

    if(img){
      img.src=fotoTemporal;
      img.style.display="block";
    }
    if(icon)icon.style.display="none";
    if(texto)texto.textContent=file.name;
  };

  reader.readAsDataURL(file);
}

function quitarFoto(){
  fotoTemporal="";
  const img=document.getElementById("previewFoto");
  const icon=document.getElementById("fotoIcono");
  const texto=document.getElementById("fotoTexto");

  if(img){
    img.src="";
    img.style.display="none";
  }
  if(icon)icon.style.display="block";
  if(texto)texto.textContent="No hay foto seleccionada";
}

function guardarProducto(indice){
  const model=document.getElementById("prodModelo").value.trim();
  const sku=document.getElementById("prodSKU").value.trim();
  const size=document.getElementById("prodTalla").value.trim();
  const color=document.getElementById("prodColor").value.trim();
  const price=Number(document.getElementById("prodPrecio").value);
  const stock=Number(document.getElementById("prodStock").value);

  if(!model || !size || !Number.isFinite(price) || price<0 ||
     !Number.isInteger(stock) || stock<0){
    alert("Completa modelo, talla, precio y existencia correctamente.");
    return;
  }

  const producto={
    model,size,color,sku,
    price,stock,
    photo:fotoTemporal
  };

  if(indice===null){
    inventario.push(producto);
  }else{
    inventario[indice]=producto;
  }

  guardar();
  cerrarModal();
  renderProductos();
}

function editarProducto(indice){
  abrirProducto(indice);
}

function eliminarProducto(indice){
  if(!confirm("¿Eliminar este producto del inventario?"))return;

  inventario.splice(indice,1);
  guardar();
  renderProductos();
}

/* =========================
   VENTA
   ========================= */

function renderVenta(){
  const productosDisponibles=inventario.filter(p=>Number(p.stock)>0);

  document.getElementById("appContent").innerHTML=`
    <div class="toolbar">
      <input id="buscarVenta" class="search"
        placeholder="🔎 Buscar producto para vender..."
        oninput="filtrarVenta()">
      <button class="btn btn-light" onclick="limpiarCarrito()">Vaciar carrito</button>
    </div>

    <div class="sale-layout">
      <div>
        <div id="saleProducts" class="sale-products"></div>
      </div>

      <aside class="cart">
        <h2 style="margin-top:0">🛒 Venta actual</h2>
        <div id="cartItems"></div>

        <div class="total-box">

              min="0" step="0.01" oninput="actualizarPago()" placeholder="0.00">

              <span>Cambio</span>
              <strong id="cambioVenta">${dinero(0)}</strong>

  pintarVenta(productosDisponibles);

}

function pintarVenta(lista){
  const box=document.getElementById("saleProducts");
  if(!box)return;

  if(!lista.length){
    box.innerHTML=`
      <div class="card" style="grid-column:1/-1;text-align:center;padding:45px">
        <div style="font-size:50px">👟</div>
        <h2>No hay productos disponibles</h2>
        <p>Agrega productos al inventario para comenzar una venta.</p>
        <button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button>
      </div>`;
    return;
  }

  box.innerHTML=lista.map(p=>{
    const index=inventario.indexOf(p);

    return `
      <div class="sale-product" onclick="agregarCarrito(${index})">
        ${p.photo
          ? `<img src="${p.photo}" alt="${esc(p.model)}">`
          : `<div class="no-photo">👟</div>`}

        <div class="sale-product-info">
          <div style="font-weight:800">${esc(p.model)}</div>
          <div style="font-size:12px;color:#777">
            Talla ${esc(p.size)}${p.color?" · "+esc(p.color):""}
          </div>
          <div style="font-size:18px;font-weight:800;margin-top:5px">
            ${dinero(p.price)}
          </div>
          <div style="font-size:12px;color:#777">
            ${p.stock} disponibles
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function filtrarVenta(){
  const q=(document.getElementById("buscarVenta")?.value||"").toLowerCase().trim();

  const lista=inventario.filter(p=>
    Number(p.stock)>0 &&
    (
      String(p.model||"").toLowerCase().includes(q) ||
      String(p.size||"").toLowerCase().includes(q) ||
      String(p.color||"").toLowerCase().includes(q) ||
      String(p.sku||"").toLowerCase().includes(q)
    )
  );

  pintarVenta(lista);
}

function agregarCarrito(indice){
  const p=inventario[indice];
  if(!p || Number(p.stock)<=0){
    alert("Producto sin existencia.");
    return;
  }

  const existente=carrito.find(x=>x.index===indice);

  if(existente){
    if(existente.qty>=Number(p.stock)){
      alert("No hay más existencia disponible.");
      return;
    }
    existente.qty++;
  }else{
    carrito.push({index:indice,qty:1});
  }

  pintarCarrito();
}

function quitarCarrito(i){
  carrito.splice(i,1);
  pintarCarrito();
}

function cambiarCantidad(i,delta){
  const item=carrito[i];
  const p=inventario[item.index];
  item.qty+=delta;

  if(item.qty<=0){
    carrito.splice(i,1);
  }else if(item.qty>Number(p.stock)){
    item.qty=Number(p.stock);
  }

  pintarCarrito();
}

function limpiarCarrito(){
  carrito=[];
  pintarCarrito();
}

function totalCarrito(){
  return carrito.reduce((sum,item)=>{
    const p=inventario[item.index];
    return sum+(Number(p.price)||0)*item.qty;
  },0);
}

function pintarCarrito(){
  const box=document.getElementById("cartItems");
  if(!box)return;

  if(!carrito.length){
    box.innerHTML=`
      <div style="text-align:center;color:#888;padding:30px 5px">
        El carrito está vacío.<br>
        Toca un producto para agregarlo.
      </div>`;
  }else{
    box.innerHTML=carrito.map((item,i)=>{
      const p=inventario[item.index];

      return `
        <div class="cart-row">
          ${p.photo
            ? `<img src="${p.photo}">`
            : `<div style="width:48px;height:48px;border-radius:7px;background:#eee;display:flex;align-items:center;justify-content:center">👟</div>`}

          <div class="cart-row-info">
            <div style="font-weight:700">${esc(p.model)}</div>
            <div style="font-size:12px;color:#777">
              Talla ${esc(p.size)}
            </div>
            <div>${dinero(p.price)}</div>
          </div>

          <button class="btn-light" onclick="cambiarCantidad(${i},-1)">−</button>
          <strong>${item.qty}</strong>
          <button class="btn-light" onclick="cambiarCantidad(${i},1)">＋</button>
          <button class="btn-light" onclick="quitarCarrito(${i})">🗑️</button>
        </div>
      `;
    }).join("");
  }

  const total=totalCarrito();

  const sub=document.getElementById("subtotalVenta");
  const tot=document.getElementById("totalVenta");

  if(sub)sub.textContent=dinero(total);
  if(tot)tot.textContent=dinero(total);

  actualizarPago();
}

function actualizarPago(){
  const pago=document.getElementById("pagoVenta");
  const box=document.getElementById("efectivoBox");
  if(!pago)return;

  if(pago.value==="Efectivo"){
    if(box)box.style.display="block";

    const recibido=Number(document.getElementById("efectivoRecibido")?.value||0);
    const cambio=Math.max(0,recibido-totalCarrito());

    const c=document.getElementById("cambioVenta");
    if(c)c.textContent=dinero(cambio);
  }else{
    if(box)box.style.display="none";
  }
}

function finalizarVenta(){
  if(!carrito.length){
    alert("Agrega al menos un producto.");
    return;
  }

  const total=totalCarrito();
  const pago=document.getElementById("pagoVenta").value;
  const recibido=Number(document.getElementById("efectivoRecibido")?.value||0);

  if(pago==="Efectivo" && recibido<total){
    alert("El efectivo recibido es menor que el total.");
    return;
  }

  /* Verificar stock antes de descontar */
  for(const item of carrito){
    const p=inventario[item.index];

    if(!p || Number(p.stock)<item.qty){
      alert("La existencia cambió. Revisa el inventario.");
      renderVenta();
      return;
    }
  }

  const clienteIndex=document.getElementById("clienteVenta").value;
  let cliente=null;
  let puntos=0;

  if(clienteIndex!==""){
    cliente=clientes[Number(clienteIndex)];
    puntos=Math.floor(total*Number(configuracion.puntosPorPeso||0.1));
    cliente.points=Number(cliente.points||0)+puntos;
  }

  const productos=carrito.map(item=>{
    const p=inventario[item.index];

    p.stock-=item.qty;

    return {
      model:p.model,
      size:p.size,
      color:p.color,
      price:Number(p.price),
      qty:item.qty,
      photo:p.photo||""
    };
  });

  const venta={
    folio:"NN-"+Date.now(),
    date:new Date().toISOString(),
    products:productos,
    total,
    payment:pago,
    client:cliente?cliente.name:"",
    points:puntos,
    cashReceived:pago==="Efectivo"?recibido:0,
    change:pago==="Efectivo"?Math.max(0,recibido-total):0
  };

  ventas.push(venta);
  guardar();

  imprimirTicket(venta);
  carrito=[];

  alert("Venta registrada correctamente.");
  ir("venta");
}

    String(c.phone||"").toLowerCase().includes(q) ||

function abrirCliente(indice=null){
  const c=indice===null?{}:clientes[indice];

  abrirModal(`
    <button class="close" onclick="cerrarModal()">×</button>
    <h2>${indice===null?"＋ Nuevo cliente":"✏️ Editar cliente"}</h2>

    <div class="form-grid">
      <div class="field">
        <label>Nombre *</label>
        <input id="cliNombre" value="${esc(c.name||"")}" placeholder="Nombre del cliente">
      </div>

      <div class="field">
        <label>Teléfono</label>
        <input id="cliTelefono" value="${esc(c.phone||"")}" placeholder="55...">
      </div>

      <div class="field">
        <label>Tarjeta / código escaneable</label>
        <input id="cliTarjeta" value="${esc(c.cardCode||"")}"
          placeholder="Escanea o escribe el código">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-light" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-pink" onclick="guardarCliente(${indice===null?"null":indice})">
        💾 Guardar cliente
      </button>
    </div>
  `);
}

function guardarCliente(indice){
  const name=document.getElementById("cliNombre").value.trim();
  const phone=document.getElementById("cliTelefono").value.trim();
  const cardCode=document.getElementById("cliTarjeta").value.trim();

  if(!name){
    alert("Escribe el nombre del cliente.");
    return;
  }

  const cliente={
    name,
    phone,
    cardCode,
    points:indice===null?0:Number(clientes[indice].points||0)
  };

  if(indice===null)clientes.push(cliente);
  else clientes[indice]=cliente;

  guardar();
  cerrarModal();
  renderClientes();
}

function eliminarCliente(i){
  if(!confirm("¿Eliminar este cliente?"))return;
  clientes.splice(i,1);
  guardar();
  renderClientes();
}

function renderConfig(){
  document.getElementById("appContent").innerHTML=`
    <div class="card">
      <h2>⚙️ Configuración de la tienda</h2>
      <p style="color:#777">
        Aquí podrás personalizar la información que aparece en el sistema.
      </p>

      <div class="form-grid">
        <div class="field full">
          <label>Logo de Nat.Nation</label>

          <div class="photo-upload">
            <img id="previewLogo" class="photo-preview"
              src="${configuracion.logo||""}"
              style="${configuracion.logo?"display:block":""}">

            <div id="logoIcono" style="${configuracion.logo?"display:none":""};font-size:45px">
              🖼️
            </div>

            <p>Sube el logo desde tu dispositivo</p>

            <label class="upload-btn">
              📷 Subir logo
              <input type="file" accept="image/*" onchange="cargarLogo(this)">
            </label>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-pink" onclick="guardarConfiguracion()">💾 Guardar cambios</button>
      </div>
    </div>
  `;
}

function cargarLogo(input){
  const file=input.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    configuracion.logo=e.target.result;

    const img=document.getElementById("previewLogo");
    const icon=document.getElementById("logoIcono");

    if(img){
      img.src=configuracion.logo;
      img.style.display="block";
    }
    if(icon)icon.style.display="none";
  };

  reader.readAsDataURL(file);
}

function guardarConfiguracion(){
  guardar();
  actualizarLogo();
  alert("Configuración guardada.");
}

function actualizarLogo(){
  const img=document.getElementById("logoImg");

  if(configuracion.logo){
    img.src=configuracion.logo;
  }else{
    img.removeAttribute("src");
    img.alt="NN";
  }
}

      <hr>

      ${venta.products.map(p=>`
        <div style="display:flex;justify-content:space-between;margin:5px 0">
          <span>${esc(p.model)} x${p.qty}</span>
          <span>${dinero(p.price*p.qty)}</span>
        </div>
      `).join("")}

      <hr>

      <div style="display:flex;justify-content:space-between;font-weight:bold">

  `;

  setTimeout(()=>window.print(),100);
}
