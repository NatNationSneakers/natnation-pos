<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#202124;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.layout{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:265px;
    background:#101827;
    color:white;
    padding:28px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo-box{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    width:78px;
    height:78px;
    background:white;
    color:#101827;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:bold;
    margin:auto;
}

.logo-title{
    font-size:22px;
    font-weight:bold;
    margin-top:12px;
}

.logo-sub{
    color:#aeb7c7;
    margin-top:5px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu button{
    border:0;
    background:transparent;
    color:#e9edf5;
    text-align:left;
    padding:16px 14px;
    border-radius:11px;
    font-size:16px;
}

.menu button:hover,
.menu button.active{
    background:#27364c;
}

.main{
    margin-left:265px;
    width:calc(100% - 265px);
    min-height:100vh;
}

.topbar{
    height:85px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.topbar h2{
    margin:0;
}

.status{
    font-size:14px;
    font-weight:bold;
}

.status.ok{
    color:#159447;
}

.status.error{
    color:#d92323;
}

.content{
    padding:30px;
}

.alert{
    background:#ffe1e1;
    color:#b21f1f;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
}

.page-title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:4px;
}

.page-subtitle{
    color:#687386;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    border:1px solid #e0e3e8;
    border-radius:14px;
    padding:22px;
}

.card-label{
    color:#6c7585;
    margin-bottom:10px;
}

.card-value{
    font-size:28px;
    font-weight:bold;
}

.panel{
    background:white;
    border:1px solid #e0e3e8;
    border-radius:14px;
    padding:22px;
    margin-bottom:22px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.panel-header h3{
    margin:0;
}

.primary{
    border:0;
    background:#111827;
    color:white;
    padding:13px 20px;
    border-radius:10px;
    font-weight:bold;
}

.primary:hover{
    background:#263247;
}

.secondary{
    border:1px solid #d5d9e0;
    background:white;
    padding:11px 16px;
    border-radius:9px;
}

.danger{
    border:0;
    background:#dc2626;
    color:white;
    padding:9px 13px;
    border-radius:8px;
}

.search{
    width:100%;
    border:1px solid #ccd2dc;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    background:#f7f8fa;
    padding:14px;
    color:#677184;
}

td{
    padding:14px;
    border-top:1px solid #edf0f3;
}

.product-img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #ddd;
    background:#f4f4f4;
}

.no-img{
    width:65px;
    height:65px;
    border-radius:10px;
    background:#f0f1f3;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:11px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group label{
    font-weight:bold;
}

.form-group input,
.form-group select{
    padding:12px;
    border:1px solid #ccd2dc;
    border-radius:9px;
}

.full{
    grid-column:1/-1;
}

.preview{
    max-width:150px;
    max-height:150px;
    border-radius:12px;
    display:none;
}

.sale-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product-card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    background:white;
}

.product-card img,
.product-card .no-img{
    width:100%;
    height:150px;
    margin-bottom:10px;
}

.product-card img{
    object-fit:cover;
}

.product-card-title{
    font-weight:bold;
    margin-bottom:5px;
}

.product-card-price{
    font-size:20px;
    font-weight:bold;
    margin-bottom:5px;
}

.product-card-stock{
    color:#687386;
    margin-bottom:10px;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:12px 0;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-total{
    font-size:25px;
    font-weight:bold;
    text-align:right;
    margin-top:20px;
}

.payment-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:15px 0;
}

.payment-buttons button{
    padding:12px;
    border:1px solid #ccd2dc;
    background:white;
    border-radius:8px;
}

.payment-buttons button.selected{
    background:#111827;
    color:white;
}

.empty{
    padding:30px;
    text-align:center;
    color:#737b89;
}

.ticket{
    display:none;
}

@media(max-width:900px){
    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
        width:calc(100% - 210px);
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .sale-grid{
        grid-template-columns:1fr;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .sidebar{
        width:75px;
        padding:15px 8px;
    }

    .logo{
        width:50px;
        height:50px;
        font-size:25px;
    }

    .logo-title,
    .logo-sub{
        display:none;
    }

    .menu button{
        font-size:0;
        text-align:center;
    }

    .menu button:first-letter{
        font-size:22px;
    }

    .main{
        margin-left:75px;
        width:calc(100% - 75px);
    }

    .content{
        padding:15px;
    }

    .topbar{
        padding:0 15px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .product-grid{
        grid-template-columns:1fr;
    }
}

@media print{
    body *{
        visibility:hidden;
    }

    #ticket,
    #ticket *{
        visibility:visible;
    }

    #ticket{
        display:block !important;
        position:absolute;
        left:0;
        top:0;
        width:80mm;
        padding:5mm;
        background:white;
        color:black;
    }

    .ticket-center{
        text-align:center;
    }

    .ticket-line{
        border-top:1px dashed #000;
        margin:8px 0;
    }
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">
    <div class="logo-box">
        <div class="logo">N</div>
        <div class="logo-title">Nat.Nation</div>
        <div class="logo-sub">Sneakers</div>
    </div>

    <div class="menu">
        <button onclick="ir('inicio')" id="btn-inicio">🏠 Inicio</button>
        <button onclick="ir('productos')" id="btn-productos">👟 Productos</button>
        <button onclick="ir('venta')" id="btn-venta">🛒 Nueva venta</button>
        <button onclick="ir('clientes')" id="btn-clientes">👤 Clientes</button>
        <button onclick="ir('reportes')" id="btn-reportes">📊 Reportes</button>
    </div>
</aside>

<main class="main">

<header class="topbar">
    <h2>Nat.Nation Sneakers</h2>
    <div id="status" class="status">🟡 Conectando...</div>
</header>

<section class="content" id="app"></section>

</main>
</div>

<div id="ticket" class="ticket"></div>

<script>

const SUPABASE_URL = "https://nasvzzdzkljozyhhjize.supabase.co";
const SUPABASE_KEY = "sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const NEGOCIO = {
    nombre: "Nat.Nation Sneakers",
    direccion: "Calle Juan Clímaco Ramírez SNVC, San Andrés, 55780 Jaltenco, Méx.",
    telefono: "5624570336"
};

let productos = [];
let clientes = [];
let ventas = [];
let carrito = [];
let metodoPago = "efectivo";
let clienteVenta = null;

const app = document.getElementById("app");
const statusEl = document.getElementById("status");

function dinero(valor){
    return Number(valor || 0).toLocaleString("es-MX",{
        style:"currency",
        currency:"MXN"
    });
}

function esc(valor){
    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function mostrarEstado(ok,mensaje){
    statusEl.textContent = ok ? "🟢 Conectado" : "🔴 Error de conexión";
    statusEl.className = ok ? "status ok" : "status error";

    if(!ok){
        app.innerHTML = `
            <div class="alert">
                ${esc(mensaje || "Supabase respondió con un error.")}
            </div>
        `;
    }
}

async function cargarTodo(){
    try{

        const p = await supabaseClient
            .from("productos")
            .select("*")
            .order("created_at",{ascending:false});

        if(p.error) throw p.error;

        const c = await supabaseClient
            .from("clientes")
            .select("*")
            .order("created_at",{ascending:false});

        if(c.error) throw c.error;

        const v = await supabaseClient
            .from("ventas")
            .select("*")
            .order("fecha",{ascending:false});

        if(v.error) throw v.error;

        productos = p.data || [];
        clientes = c.data || [];
        ventas = v.data || [];

        mostrarEstado(true);

        ir("inicio");

    }catch(error){

        console.error(error);

        mostrarEstado(
            false,
            "Supabase respondió con un error: " +
            (error.message || "Error desconocido")
        );
    }
}

function ir(pagina){

    document.querySelectorAll(".menu button")
        .forEach(x=>x.classList.remove("active"));

    const boton = document.getElementById("btn-"+pagina);

    if(boton){
        boton.classList.add("active");
    }

    if(pagina==="inicio") mostrarInicio();
    if(pagina==="productos") mostrarProductos();
    if(pagina==="venta") mostrarVenta();
    if(pagina==="clientes") mostrarClientes();
    if(pagina==="reportes") mostrarReportes();
}

function mostrarInicio(){

    const hoy = new Date().toDateString();

    const ventasHoy = ventas.filter(v =>
        new Date(v.fecha).toDateString() === hoy
    );

    const totalHoy = ventasHoy.reduce(
        (a,v)=>a+Number(v.total||0),0
    );

    const stock = productos.reduce(
        (a,p)=>a+Number(p.stock||0),0
    );

    app.innerHTML = `

        <div class="page-title">Inicio</div>
        <div class="page-subtitle">
            Bienvenida a tu punto de venta.
        </div>

        <div class="cards">

            <div class="card">
                <div class="card-label">Productos</div>
                <div class="card-value">${productos.length}</div>
            </div>

            <div class="card">
                <div class="card-label">Stock total</div>
                <div class="card-value">${stock}</div>
            </div>

            <div class="card">
                <div class="card-label">Clientes</div>
                <div class="card-value">${clientes.length}</div>
            </div>

            <div class="card">
                <div class="card-label">Ventas de hoy</div>
                <div class="card-value">${dinero(totalHoy)}</div>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">
                <h3>Últimas ventas</h3>

                <button class="primary" onclick="ir('venta')">
                    + Nueva venta
                </button>
            </div>

            ${
                ventas.length
                ?
                `
                <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Folio</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Pago</th>
                        </tr>
                    </thead>
                    <tbody>

                    ${ventas.slice(0,10).map(v=>`

                        <tr>
                            <td>${esc(v.folio)}</td>
                            <td>${new Date(v.fecha).toLocaleString("es-MX")}</td>
                            <td>${dinero(v.total)}</td>
                            <td>${esc(v.metodo_pago)}</td>
                        </tr>

                    `).join("")}

                    </tbody>
                </table>
                </div>
                `
                :
                `<div class="empty">No hay ventas registradas.</div>`
            }

        </div>
    `;
}

function mostrarProductos(){

    app.innerHTML = `

        <div class="page-title">Productos</div>

        <div class="page-subtitle">
            Administra tu inventario.
        </div>

        <div class="panel">

            <div class="panel-header">

                <input
                    id="buscarProducto"
                    class="search"
                    style="margin:0"
                    placeholder="Buscar producto, SKU o código..."
                    oninput="filtrarProductos()"
                >

                <button class="primary" onclick="nuevoProducto()">
                    + Nuevo producto
                </button>

            </div>

            <div id="listaProductos"></div>

        </div>
    `;

    pintarProductos(productos);
}

function filtrarProductos(){

    const texto = document
        .getElementById("buscarProducto")
        .value
        .toLowerCase();

    const filtrados = productos.filter(p =>
        String(p.modelo||"").toLowerCase().includes(texto) ||
        String(p.sku||"").toLowerCase().includes(texto) ||
        String(p.codigo_barras||"").toLowerCase().includes(texto)
    );

    pintarProductos(filtrados);
}

function pintarProductos(lista){

    const cont = document.getElementById("listaProductos");

    if(!cont) return;

    if(!lista.length){

        cont.innerHTML =
            `<div class="empty">No hay productos registrados.</div>`;

        return;
    }

    cont.innerHTML = `

        <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Producto</th>
                    <th>Talla</th>
                    <th>SKU</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

            ${lista.map(p=>`

                <tr>

                    <td>

                        ${
                            p.imagen_url
                            ?
                            `<img src="${esc(p.imagen_url)}" class="product-img">`
                            :
                            `<div class="no-img">Sin foto</div>`
                        }

                    </td>

                    <td>${esc(p.modelo)}</td>

                    <td>${esc(p.talla)}</td>

                    <td>${esc(p.sku)}</td>

                    <td>${dinero(p.precio)}</td>

                    <td>${p.stock}</td>

                    <td>

                        <button
                            class="secondary"
                            onclick="editarProducto('${p.id}')"
                        >
                            Editar
                        </button>

                        <button
                            class="danger"
                            onclick="eliminarProducto('${p.id}')"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>

            `).join("")}

            </tbody>

        </table>

        </div>
    `;
}

function nuevoProducto(){

    app.innerHTML = `

        <div class="page-title">Nuevo producto</div>

        <div class="page-subtitle">
            Registra un producto en tu inventario.
        </div>

        <div class="panel">

            <form onsubmit="guardarProducto(event)">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Modelo</label>
                        <input id="modelo" required>
                    </div>

                    <div class="form-group">
                        <label>Talla</label>
                        <input id="talla" required>
                    </div>

                    <div class="form-group">
                        <label>SKU</label>
                        <input id="sku">
                    </div>

                    <div class="form-group">
                        <label>Código de barras</label>
                        <input id="codigo_barras">
                    </div>

                    <div class="form-group">
                        <label>Precio de venta</label>
                        <input id="precio" type="number" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Costo</label>
                        <input id="costo" type="number" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label>Stock</label>
                        <input id="stock" type="number" value="0" required>
                    </div>

                    <div class="form-group">
                        <label>Foto del producto</label>
                        <input
                            id="foto"
                            type="file"
                            accept="image/*"
                            onchange="previsualizarFoto(event)"
                        >
                    </div>

                    <div class="full">
                        <img id="preview" class="preview">
                    </div>

                    <div class="full">

                        <button class="primary" type="submit">
                            Guardar producto
                        </button>

                        <button
                            class="secondary"
                            type="button"
                            onclick="ir('productos')"
                        >
                            Cancelar
                        </button>

                    </div>

                </div>

            </form>

        </div>
    `;
}

function previsualizarFoto(event){

    const archivo = event.target.files[0];

    if(!archivo) return;

    const preview = document.getElementById("preview");

    preview.src = URL.createObjectURL(archivo);
    preview.style.display = "block";
}

async function subirImagen(archivo){

    if(!archivo) return null;

    const extension =
        archivo.name.split(".").pop().toLowerCase();

    const nombre =
        "productos/" +
        crypto.randomUUID() +
        "." +
        extension;

    const subida = await supabaseClient
        .storage
        .from("pos")
        .upload(nombre,archivo,{
            upsert:false,
            contentType:archivo.type
        });

    if(subida.error) throw subida.error;

    const url =
        supabaseClient
        .storage
        .from("pos")
        .getPublicUrl(nombre);

    return url.data.publicUrl;
}

async function guardarProducto(event){

    event.preventDefault();

    try{

        const archivo =
            document.getElementById("foto").files[0];

        let imagen_url = null;

        if(archivo){
            imagen_url = await subirImagen(archivo);
        }

        const datos = {

            modelo:
                document.getElementById("modelo").value.trim(),

            talla:
                document.getElementById("talla").value.trim(),

            sku:
                document.getElementById("sku").value.trim() || null,

            codigo_barras:
                document.getElementById("codigo_barras").value.trim() || null,

            precio:
                Number(document.getElementById("precio").value || 0),

            costo:
                Number(document.getElementById("costo").value || 0),

            stock:
                Number(document.getElementById("stock").value || 0),

            imagen_url
        };

        const resultado =
            await supabaseClient
            .from("productos")
            .insert(datos)
            .select()
            .single();

        if(resultado.error) throw resultado.error;

        productos.unshift(resultado.data);

        alert("Producto guardado correctamente.");

        ir("productos");

    }catch(error){

        console.error(error);

        alert(
            "No se pudo guardar el producto:\n\n" +
            error.message
        );
    }
}

async function editarProducto(id){

    const p = productos.find(x=>x.id===id);

    if(!p) return;

    app.innerHTML = `

        <div class="page-title">Editar producto</div>

        <div class="panel">

            <form onsubmit="actualizarProducto(event,'${p.id}')">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Modelo</label>
                        <input id="modelo" value="${esc(p.modelo)}" required>
                    </div>

                    <div class="form-group">
                        <label>Talla</label>
                        <input id="talla" value="${esc(p.talla)}" required>
                    </div>

                    <div class="form-group">
                        <label>SKU</label>
                        <input id="sku" value="${esc(p.sku)}">
                    </div>

                    <div class="form-group">
                        <label>Código de barras</label>
                        <input id="codigo_barras" value="${esc(p.codigo_barras)}">
                    </div>

                    <div class="form-group">
                        <label>Precio</label>
                        <input id="precio" type="number" step="0.01" value="${p.precio}">
                    </div>

                    <div class="form-group">
                        <label>Costo</label>
                        <input id="costo" type="number" step="0.01" value="${p.costo}">
                    </div>

                    <div class="form-group">
                        <label>Stock</label>
                        <input id="stock" type="number" value="${p.stock}">
                    </div>

                    <div class="form-group">
                        <label>Nueva foto</label>
                        <input id="foto" type="file" accept="image/*">
                    </div>

                    <div class="full">

                        ${
                            p.imagen_url
                            ?
                            `<img src="${esc(p.imagen_url)}" class="product-img">`
                            :

            document.getElementById("foto").files[0];

        if(archivo){
            imagen_url = await subirImagen(archivo);
        }

        const datos = {

            modelo:
                document.getElementById("modelo").value.trim(),

            talla:
                document.getElementById("talla").value.trim(),

            sku:
                document.getElementById("sku").value.trim() || null,

            codigo_barras:
                document.getElementById("codigo_barras").value.trim() || null,

            precio:
                Number(document.getElementById("precio").value || 0),

            costo:
                Number(document.getElementById("costo").value || 0),

            stock:
                Number(document.getElementById("stock").value || 0),

            imagen_url
        };

        const resultado =
            await supabaseClient
            .from("productos")
            .update(datos)
            .eq("id",id)
            .select()
            .single();

        productos =
            productos.map(x=>x.id===id ? resultado.data : x);

        ir("productos");

function buscarVentaProducto(texto){

    texto = texto.toLowerCase();

    const lista = productos.filter(p =>
        String(p.modelo||"").toLowerCase().includes(texto) ||
        String(p.sku||"").toLowerCase().includes(texto) ||
        String(p.codigo_barras||"").toLowerCase().includes(texto)
    );

    pintarProductosVenta(lista);
}

function pintarProductosVenta(lista){

    const cont = document.getElementById("productosVenta");

    if(!cont) return;

    const disponibles =
        lista.filter(p=>Number(p.stock)>0);

    if(!disponibles.length){

        cont.innerHTML =
            `<div class="empty">No hay productos disponibles.</div>`;

        return;
    }

    cont.innerHTML = disponibles.map(p=>`

        <div class="product-card">

            ${
                p.imagen_url
                ?
                `<img src="${esc(p.imagen_url)}">`
                :

            <div class="product-card-title">
                ${esc(p.modelo)}

                Talla: ${esc(p.talla)}
            </div>

            <div class="product-card-price">
                ${dinero(p.precio)}
            </div>

            <div class="product-card-stock">
                Stock: ${p.stock}
            </div>

                class="primary"
                style="width:100%"
                onclick="agregarCarrito('${p.id}')"
            >
                Agregar
            </button>

        </div>

    `).join("");
}

function agregarCarrito(id){

    const p = productos.find(x=>x.id===id);

    if(!p) return;

    const existente =
        carrito.find(x=>x.producto.id===id);

    const cantidadActual =
        existente ? existente.cantidad : 0;

    if(cantidadActual >= Number(p.stock)){
        alert("No hay más stock disponible.");
        return;
    }

    if(existente){
        existente.cantidad++;
    }else{
        carrito.push({
            producto:p,
            cantidad:1
        });
    }

    pintarCarrito();
}

function quitarCarrito(id){

    const i =
        carrito.findIndex(x=>x.producto.id===id);

    if(i===-1) return;

    carrito[i].cantidad--;

    if(carrito[i].cantidad<=0){
        carrito.splice(i,1);
    }

    pintarCarrito();
}

function totalCarrito(){

    return carrito.reduce(
        (total,item)=>
            total +
            Number(item.producto.precio)*item.cantidad,
        0
    );
}

function pintarCarrito(){

function actualizarCambio(){

    const total = totalCarrito();

    const efectivo =
        Number(
            document.getElementById("efectivo")?.value || 0
        );

    const cambio =
        Math.max(0,efectivo-total);

    const elemento =
        document.getElementById("cambio");

    if(elemento){
        elemento.textContent =
            "Cambio: " + dinero(cambio);
    }
}

async function obtenerFolio(){

    const numero =
        ventas.length + 1;

    return "NN-" +
        String(numero).padStart(6,"0");
}

async function registrarVenta(){

    if(!carrito.length){

        alert("Agrega al menos un producto.");
        return;
    }

    try{

        for(const item of carrito){

            if(item.cantidad > Number(item.producto.stock)){

                throw new Error(
                    "Stock insuficiente para " +
                    item.producto.modelo
                );
            }
        }

        const total = totalCarrito();

        const efectivo =
            Number(
                document.getElementById("efectivo")?.value || 0
            );

        if(metodoPago==="efectivo" && efectivo<total){

            alert("El efectivo recibido es menor al total.");
            return;
        }

        const cambio =
            metodoPago==="efectivo"
            ? Math.max(0,efectivo-total)
            : 0;

        const folio = await obtenerFolio();

        const puntos =
            clienteVenta
            ?
            Math.floor(total/10)
            :
            0;

        const ventaData = {

            folio,

            total,

            metodo_pago:metodoPago,

            cliente_id:
                clienteVenta ? clienteVenta.id : null,

            efectivo_recibido:
                metodoPago==="efectivo" ? efectivo : 0,

            cambio,

            puntos_ganados:puntos
        };

        const venta =
            await supabaseClient
            .from("ventas")
            .insert(ventaData)
            .select()
            .single();

        if(venta.error) throw venta.error;

        const detalles =
            carrito.map(item=>({

                venta_id:venta.data.id,

                producto_id:item.producto.id,

                producto_nombre:item.producto.modelo,

                talla:item.producto.talla,

                cantidad:item.cantidad,

                precio_unitario:item.producto.precio,

                subtotal:
                    Number(item.producto.precio) *
                    item.cantidad
            }));

        const detalle =
            await supabaseClient
            .from("venta_detalles")
            .insert(detalles);

        if(detalle.error) throw detalle.error;

        for(const item of carrito){

            const nuevoStock =
                Number(item.producto.stock) -
                item.cantidad;

            const actualizacion =
                await supabaseClient
                .from("productos")
                .update({
                    stock:nuevoStock
                })
                .eq("id",item.producto.id);

            if(actualizacion.error){
                throw actualizacion.error;
            }

            item.producto.stock = nuevoStock;
        }

        if(clienteVenta && puntos>0){

            const nuevosPuntos =
                Number(clienteVenta.puntos||0)+puntos;

            const actualizacion =
                await supabaseClient
                .from("clientes")
                .update({
                    puntos:nuevosPuntos
                })
                .eq("id",clienteVenta.id);

            if(actualizacion.error){
                throw actualizacion.error;
            }

            clienteVenta.puntos = nuevosPuntos;
        }

        ventas.unshift({
            ...venta.data
        });

        imprimirTicket(
            venta.data,
            detalles,
            cambio
        );

        carrito = [];

        await cargarTodo();

    }catch(error){

        console.error(error);

        alert(
            "No se pudo registrar la venta:\n\n" +
            error.message
        );
    }
}
