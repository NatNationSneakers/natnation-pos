<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#202124;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:240px;
    background:#111827;
    color:white;
    min-height:100vh;
    padding:20px 14px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
}

.logo-area{
    text-align:center;
    padding:10px 5px 25px;
}

.logo-area img{
    width:75px;
    height:75px;
    object-fit:contain;
    border-radius:15px;
    display:none;
    margin:auto;
}

.logo-placeholder{
    width:70px;
    height:70px;
    background:white;
    color:#111827;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:30px;
    font-weight:bold;
}

.logo-area h2{
    font-size:18px;
    margin-top:12px;
}

.logo-area p{
    font-size:11px;
    color:#aeb5c1;
    margin-top:4px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#d1d5db;
    text-align:left;
    padding:13px 15px;
    border-radius:9px;
    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#263244;
    color:white;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:240px;
    width:calc(100% - 240px);
    min-height:100vh;
}

.topbar{
    height:65px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:10;
}

.topbar-title{
    font-weight:bold;
    font-size:18px;
}

.connection{
    font-size:13px;
    color:#777;
}

.content{
    padding:25px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:25px;
}

.page-title p{
    color:#6b7280;
    margin-top:5px;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    border:1px solid #e5e7eb;
}

.card-title{
    font-size:13px;
    color:#6b7280;
}

.card-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

/* =========================
   PANELS
========================= */

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
}

.panel-header h2{
    font-size:18px;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-primary:hover{
    background:#263244;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-danger{
    background:#fee2e2;
    color:#991b1b;
}

.btn-success{
    background:#dcfce7;
    color:#166534;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f9fafb;
    color:#6b7280;
    font-size:12px;
    text-align:left;
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.product-thumb{
    width:48px;
    height:48px;
    border-radius:8px;
    object-fit:cover;
    background:#f1f3f5;
}

.no-image{
    width:48px;
    height:48px;
    border-radius:8px;
    background:#f1f3f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

/* =========================
   FORMS
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
}

.form-group input,
.form-group select{
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:11px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#111827;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

/* =========================
   SEARCH
========================= */

.search{
    width:100%;
    border:1px solid #d1d5db;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

/* =========================
   PRODUCTS
========================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.product-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
}

.product-card img,
.product-image-placeholder{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#f3f4f6;
}

.product-image-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.product-info{
    padding:15px;
}

.product-info h3{
    font-size:15px;
    margin-bottom:5px;
}

.product-info p{
    font-size:13px;
    color:#6b7280;
    margin-bottom:4px;
}

.price{
    font-size:19px;
    font-weight:bold;
    margin:10px 0;
}

.stock{
    font-size:12px;
}

/* =========================
   SALE
========================= */

.sale-layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:20px;
}

.sale-products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.sale-product{
    border:1px solid #e5e7eb;
    border-radius:10px;
    overflow:hidden;
    background:white;
}

.sale-product img,
.sale-product .sale-no-image{
    width:100%;
    height:130px;
    object-fit:cover;
}

.sale-no-image{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3f4f6;
    font-size:35px;
}

.sale-product-info{
    padding:10px;
}

.sale-product-info strong{
    display:block;
    font-size:13px;
}

.sale-product-info span{
    font-size:12px;
    color:#6b7280;
}

.sale-product-info button{
    width:100%;
    margin-top:8px;
}

.cart{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    position:sticky;
    top:85px;
    height:max-content;
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.cart-item-info{
    flex:1;
}

.cart-item-info strong{
    font-size:13px;
    display:block;
}

.cart-item-info small{
    color:#6b7280;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    margin:18px 0;
}

.payment-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:10px 0;
}

.payment-buttons button{
    padding:10px 4px;
    border:1px solid #d1d5db;
    background:white;
    border-radius:7px;
}

.payment-buttons button.selected{
    background:#111827;
    color:white;
}

.cash-box{
    display:none;
    margin-top:10px;
}

.cash-box input{
    width:100%;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

.change{
    margin-top:7px;
    font-weight:bold;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:14px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:none;
    font-size:25px;
}

/* =========================
   TICKET
========================= */

.ticket{
    width:300px;
    background:white;
    padding:20px;
    margin:auto;
    font-family:monospace;
}

.ticket-center{
    text-align:center;
}

.ticket-line{
    border-top:1px dashed #000;
    margin:10px 0;
}

.ticket-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin:5px 0;
}

/* =========================
   ALERT
========================= */

.alert{
    padding:12px 15px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.alert.error{
    background:#fee2e2;
    color:#991b1b;
}

.alert.success{
    background:#dcfce7;
    color:#166534;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .sale-layout{
        grid-template-columns:1fr;
    }

    .cart{
        position:static;
    }
}

@media(max-width:800px){
    .sidebar{
        width:70px;
        padding:10px 5px;
    }

    .logo-area h2,
    .logo-area p{
        display:none;
    }

    .logo-placeholder{
        width:50px;
        height:50px;
        font-size:20px;
    }

    .menu button{
        font-size:0;
        text-align:center;
    }

    .menu button:first-letter{
        font-size:20px;
    }

    .main{
        margin-left:70px;
        width:calc(100% - 70px);
    }

    .content{
        padding:15px;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .sale-products{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    .cards{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .product-grid,
    .sale-products{
        grid-template-columns:1fr 1fr;
    }

    .topbar-title{
        font-size:14px;
    }
}

/* =========================
   PRINT
========================= */

@media print{
    body *{
        visibility:hidden !important;
    }

    #ticketPrint,
    #ticketPrint *{
        visibility:visible !important;
    }

    #ticketPrint{
        position:absolute;
        left:0;
        top:0;
        width:300px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo-area">
        <div class="logo-placeholder">N</div>
        <img id="logoImg" alt="Logo">
        <h2>Nat.Nation</h2>
        <p>Sneakers</p>
    </div>

    <nav class="menu">

        <button onclick="mostrarPagina('inicio')" id="menu-inicio">
            🏠 Inicio
        </button>

        <button onclick="mostrarPagina('productos')" id="menu-productos">
            👟 Productos
        </button>

        <button onclick="mostrarPagina('venta')" id="menu-venta">
            🛒 Nueva venta
        </button>

        <button onclick="mostrarPagina('clientes')" id="menu-clientes">
            👤 Clientes
        </button>

        <button onclick="mostrarPagina('reportes')" id="menu-reportes">
            📊 Reportes
        </button>

    </nav>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<header class="topbar">

    <div class="topbar-title">
        Nat.Nation Sneakers
    </div>

    <div class="connection" id="connection">
        🟡 Conectando...
    </div>

</header>

<div class="content">

<div id="alert" class="alert"></div>

<div id="appContent"></div>

</div>

</main>

</div>


<!-- =========================
     MODAL PRODUCTO
========================= -->

<div class="modal" id="productoModal">

<div class="modal-box">

    <div class="modal-header">

        <h2 id="productoModalTitle">
            Nuevo producto
        </h2>

        <button class="close" onclick="cerrarProductoModal()">
            ×
        </button>

    </div>

    <input type="hidden" id="productoId">

    <div class="form-grid">

        <div class="form-group">
            <label>SKU</label>
            <input id="sku" placeholder="Ej. NN001">
        </div>

        <div class="form-group">
            <label>Código de barras</label>
            <input id="codigoBarras" placeholder="Código">
        </div>

        <div class="form-group full">
            <label>Modelo</label>
            <input id="modelo" placeholder="Ej. Urban Black">
        </div>

        <div class="form-group">
            <label>Talla</label>
            <input id="talla" placeholder="Ej. 26">
        </div>

        <div class="form-group">
            <label>Precio de venta</label>
            <input id="precio" type="number" step="0.01">
        </div>

        <div class="form-group">
            <label>Costo</label>
            <input id="costo" type="number" step="0.01">
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input id="stock" type="number" min="0">
        </div>

        <div class="form-group full">
            <label>Foto del producto</label>
            <input id="imagen" type="file" accept="image/*">
        </div>

    </div>

    <div class="form-actions">

        <button class="btn btn-secondary"
                onclick="cerrarProductoModal()">
            Cancelar
        </button>

        <button class="btn btn-primary"
                onclick="guardarProducto()">
            Guardar producto
        </button>

    </div>

</div>

</div>


<!-- =========================
     MODAL CLIENTE
========================= -->

<div class="modal" id="clienteModal">

<div class="modal-box">

    <div class="modal-header">

        <h2>Nuevo cliente</h2>

        <button class="close"
                onclick="cerrarClienteModal()">
            ×
        </button>

    </div>

    <div class="form-grid">

        <div class="form-group full">
            <label>Nombre</label>
            <input id="clienteNombre">
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input id="clienteTelefono">
        </div>

        <div class="form-group">
            <label>Código de tarjeta</label>
            <input id="clienteCodigo">
        </div>

    </div>

    <div class="form-actions">

        <button class="btn btn-secondary"
                onclick="cerrarClienteModal()">
            Cancelar
        </button>

        <button class="btn btn-primary"
                onclick="guardarCliente()">
            Guardar cliente
        </button>

    </div>

</div>

</div>


<!-- =========================
     TICKET OCULTO
========================= -->

<div id="ticketPrint" style="display:none"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   NEGOCIO
========================================================= */

const NEGOCIO = {

    nombre:"Nat.Nation Sneakers",

    direccion:
    "Calle Juan Clímaco Ramírez SNVC, San Andrés, 55780 Jaltenco, Méx.",

    telefono:
    "5624570336"

};


/* =========================================================
   VARIABLES
========================================================= */

let productos = [];
let clientes = [];
let ventas = [];
let carrito = [];

let metodoPago = "efectivo";
let clienteVenta = null;


/* =========================================================
   UTILIDADES
========================================================= */

function money(numero){

    return Number(numero || 0)
        .toLocaleString("es-MX",{
            style:"currency",
            currency:"MXN"
        });

}


function esc(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function mostrarAlert(mensaje,tipo="success"){

    const alert = document.getElementById("alert");

    alert.textContent = mensaje;

    alert.className =
        "alert " + tipo;

    alert.style.display="block";

    setTimeout(()=>{
        alert.style.display="none";
    },4000);

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarTodo(){

    try{

        const productosResult =
            await supabaseClient
            .from("productos")
            .select("*")
            .order("created_at",{ascending:false});

        if(productosResult.error)
            throw productosResult.error;

        productos =
            productosResult.data || [];


        const clientesResult =
            await supabaseClient
            .from("clientes")
            .select("*")
            .order("created_at",{ascending:false});

        if(clientesResult.error)
            throw clientesResult.error;

        clientes =
            clientesResult.data || [];


        const ventasResult =
            await supabaseClient
            .from("ventas")
            .select("*")
            .order("fecha",{ascending:false});

        if(ventasResult.error)
            throw ventasResult.error;

        ventas =
            ventasResult.data || [];


        document.getElementById("connection").innerHTML =
            "🟢 Conectado a Supabase";


        mostrarInicio();

    }catch(error){

        console.error(error);

        document.getElementById("connection").innerHTML =
            "🔴 Error de conexión";

        mostrarInicio();

        mostrarAlert(
            "Supabase respondió con un error. Revisa la consola o mándame captura.",
            "error"
        );

    }

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function mostrarPagina(pagina){

    document.querySelectorAll(".menu button")
        .forEach(b=>b.classList.remove("active"));

    const boton =
        document.getElementById("menu-"+pagina);

    if(boton)
        boton.classList.add("active");


    if(pagina==="inicio")
        mostrarInicio();

    if(pagina==="productos")
        mostrarProductos();

    if(pagina==="venta")
        mostrarVenta();

    if(pagina==="clientes")
        mostrarClientes();

    if(pagina==="reportes")
        mostrarReportes();

}


/* =========================================================
   INICIO
========================================================= */

function mostrarInicio(){

    const totalProductos =
        productos.length;

    const stockTotal =
        productos.reduce(
            (sum,p)=>sum + Number(p.stock || 0),
            0
        );

    const totalClientes =
        clientes.length;

    const ventasHoy =
        ventas.filter(v=>{

            const fecha =
                new Date(v.fecha);

            const hoy =
                new Date();

            return fecha.toDateString() ===
                   hoy.toDateString();

        });


    const montoHoy =
        ventasHoy.reduce(
            (sum,v)=>sum + Number(v.total || 0),
            0
        );


    document.getElementById("appContent").innerHTML = `

        <div class="page-title">

            <h1>Inicio</h1>

            <p>
                Bienvenida a tu punto de venta.
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Productos
                </div>

                <div class="card-value">
                    ${totalProductos}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Stock total
                </div>

                <div class="card-value">
                    ${stockTotal}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Clientes
                </div>

                <div class="card-value">
                    ${totalClientes}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Ventas de hoy
                </div>

                <div class="card-value">
                    ${money(montoHoy)}
                </div>

            </div>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    Últimas ventas
                </h2>

                <button
                    class="btn btn-primary"
                    onclick="mostrarPagina('venta')">

                    + Nueva venta

                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Folio</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Pago</th>
                        </tr>

                    </thead>

                    <tbody>

                    ${
                        ventas.slice(0,10).map(v=>`

                            <tr>

                                <td>
                                    ${esc(v.folio)}
                                </td>

                                <td>
                                    ${new Date(v.fecha)
                                      .toLocaleString("es-MX")}
                                </td>

                                <td>
                                    ${money(v.total)}
                                </td>

                                <td>
                                    ${esc(v.metodo_pago)}
                                </td>

async function guardarProducto(){

    try{

        const id =
            document.getElementById("productoId").value;

        const archivo =
            document.getElementById("imagen").files[0];


        let imagen_url = null;


        if(id){

            const existente =
                productos.find(p=>p.id===id);

            imagen_url =
                existente?.imagen_url || null;

        }


        if(archivo){

            const extension =
                archivo.name
                .split(".")
                .pop()
                .toLowerCase();


            const nombreArchivo =
                `${crypto.randomUUID()}.${extension}`;


            const upload =
                await supabaseClient
                .storage
                .from("pos")
                .upload(
                    `productos/${nombreArchivo}`,
                    archivo,
                    {
                        upsert:false,
                        contentType:archivo.type
                    }
                );


            if(upload.error)
                throw upload.error;


            const publicUrl =
                supabaseClient
                .storage
                .from("pos")
                .getPublicUrl(
                    `productos/${nombreArchivo}`
                );


            imagen_url =
                publicUrl.data.publicUrl;

        }


        const datos = {

            sku:
                document.getElementById("sku").value
                .trim() || null,

            codigo_barras:
                document.getElementById("codigoBarras").value
                .trim() || null,

            modelo:
                document.getElementById("modelo").value
                .trim(),

            talla:
                document.getElementById("talla").value
                .trim(),

            precio:
                Number(document.getElementById("precio").value || 0),

            costo:
                Number(document.getElementById("costo").value || 0),

            stock:
                Number(document.getElementById("stock").value || 0),

            imagen_url:
                imagen_url

        };


        if(!datos.modelo || !datos.talla){

            mostrarAlert(
                "Modelo y talla son obligatorios.",
                "error"
            );

            return;

        }


        let resultado;


        if(id){

            resultado =
                await supabaseClient
                .from("productos")
                .update(datos)
                .eq("id",id);

        }else{

            resultado =
                await supabaseClient
                .from("productos")
                .insert(datos);

        }


        if(resultado.error)
            throw resultado.error;


        cerrarProductoModal();

        await cargarTodo();

        mostrarPagina("productos");

        mostrarAlert(
            "Producto guardado correctamente."
        );

    }catch(error){

        console.error(error);

        mostrarAlert(
            error.message || "No se pudo guardar el producto.",
            "error"
        );

    }

}

function agregarCarrito(id){

    const producto =
        productos.find(p=>p.id===id);

    if(!producto)
        return;


    const existente =
        carrito.find(i=>i.producto.id===id);


    if(existente){

        if(existente.cantidad >=
           Number(producto.stock)){

            mostrarAlert(
                "No hay más stock disponible.",
                "error"
            );

            return;

        }

        existente.cantidad++;

    }else{

        carrito.push({

            producto:producto,

            cantidad:1

        });

    }


    renderCarrito();

}


function quitarCarrito(id){

    const index =
        carrito.findIndex(
            i=>i.producto.id===id
        );


    if(index===-1)
        return;


    carrito.splice(index,1);

    renderCarrito();

}


function cambiarCantidad(id,cantidad){

    const item =
        carrito.find(
            i=>i.producto.id===id
        );


    if(!item)
        return;


    cantidad =
        Number(cantidad);


    if(cantidad<=0){

        quitarCarrito(id);

        return;

    }


    if(cantidad >
       Number(item.producto.stock)){

        mostrarAlert(
            "Cantidad mayor al stock.",
            "error"
        );

        return;

    }


    item.cantidad=cantidad;

    renderCarrito();

}


function totalCarrito(){

    return carrito.reduce(

        (total,item)=>

            total +
            Number(item.producto.precio || 0) *
            item.cantidad,

        0

    );

}

async function finalizarVenta(){

    try{

        if(!carrito.length){

            mostrarAlert(
                "Agrega al menos un producto.",
                "error"
            );

            return;

        }


        const total =
            totalCarrito();


        let efectivoRecibido=0;
        let cambio=0;


        if(metodoPago==="efectivo"){

            efectivoRecibido =
                Number(
                    document.getElementById(
                        "efectivoRecibido"
                    ).value || 0
                );


            if(efectivoRecibido < total){

                mostrarAlert(
                    "El efectivo recibido no alcanza para cubrir la venta.",
                    "error"
                );

                return;

            }


            cambio =
                efectivoRecibido-total;

        }


        /* ---------------------------------
           GENERAR FOLIO
        --------------------------------- */

        const ahora =
            new Date();


        const fechaFolio =
            ahora.toISOString()
            .replace(/[-:TZ.]/g,"")
            .slice(0,14);


        const folio =
            "NN-" +
            fechaFolio +
            "-" +
            Math.floor(
                Math.random()*900+100
            );


        const puntosGanados =
            clienteVenta
            ? Math.floor(total/10)
            : 0;


        /* ---------------------------------
           VENTA
        --------------------------------- */

        const ventaInsert =
            await supabaseClient
            .from("ventas")
            .insert({

                folio:folio,

                total:total,

                metodo_pago:metodoPago,

                cliente_id:
                    clienteVenta
                    ? clienteVenta.id
                    : null,

                efectivo_recibido:
                    efectivoRecibido,

                cambio:cambio,

                puntos_ganados:
                    puntosGanados

            })
            .select()
            .single();


        if(ventaInsert.error)
            throw ventaInsert.error;


        const venta =
            ventaInsert.data;


        /* ---------------------------------
           DETALLES
        --------------------------------- */

        const detalles =
            carrito.map(item=>({

                venta_id:
                    venta.id,

                producto_id:
                    item.producto.id,

                producto_nombre:
                    item.producto.modelo,

                talla:
                    item.producto.talla,

                cantidad:
                    item.cantidad,

                precio_unitario:
                    Number(item.producto.precio),

                subtotal:
                    Number(item.producto.precio) *
                    item.cantidad

            }));


        const detallesInsert =
            await supabaseClient
            .from("venta_detalles")
            .insert(detalles);


        if(detallesInsert.error)
            throw detallesInsert.error;


        /* ---------------------------------
           ACTUALIZAR STOCK
        --------------------------------- */

        for(const item of carrito){

            const nuevoStock =
                Number(item.producto.stock) -
                item.cantidad;


            const update =
                await supabaseClient
                .from("productos")
                .update({
                    stock:nuevoStock
                })
                .eq("id",item.producto.id);


            if(update.error)
                throw update.error;

        }


        /* ---------------------------------
           PUNTOS
        --------------------------------- */

        if(clienteVenta && puntosGanados>0){

            const nuevosPuntos =
                Number(clienteVenta.puntos || 0) +
                puntosGanados;


            const updateCliente =
                await supabaseClient
                .from("clientes")
                .update({
                    puntos:nuevosPuntos
                })
                .eq("id",clienteVenta.id);


            if(updateCliente.error)
                throw updateCliente.error;

        }


        /* ---------------------------------
           TICKET
        --------------------------------- */

        generarTicket(
            venta,
            carrito,
            clienteVenta,
            efectivoRecibido,
            cambio,
            puntosGanados
        );


        await cargarTodo();


        mostrarAlert(
            "Venta registrada correctamente."
        );


        setTimeout(()=>{

            window.print();

        },500);


        carrito=[];

        clienteVenta=null;


    }catch(error){

        console.error(error);

        mostrarAlert(
            error.message ||
            "No se pudo registrar la venta.",
            "error"
        );

    }

}

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Nombre
                            </th>

                            <th>
                                Teléfono
                            </th>

                            <th>
                                Tarjeta
                            </th>

                            <th>
                                Puntos
                            </th>

                            <th>
                                Acción
                            </th>

                        </tr>

                    </thead>


                    <tbody id="clientesTable">

                    </tbody>

                </table>

            </div>

        </div>

    `;


    renderClientes(clientes);

}


function renderClientes(lista){

    const tbody =
        document.getElementById(
            "clientesTable"
        );


    if(!tbody)
        return;


    tbody.innerHTML =
        lista.map(c=>`

            <tr>

                <td>
                    ${esc(c.nombre)}
                </td>

                <td>
                    ${esc(c.telefono || "-")}
                </td>

                <td>
                    ${esc(c.codigo_tarjeta || "-")}
                </td>

                <td>
                    ⭐ ${Number(c.puntos || 0)}
                </td>

                <td>

                    <button
                        class="btn btn-danger"
                        onclick="eliminarCliente('${c.id}')">

                        Eliminar

                    </button>

                </td>

            </tr>

        `).join("");

}


function filtrarClientes(){

    const texto =
        document.getElementById(
            "buscarCliente"
        ).value
        .toLowerCase();


    const lista =
        clientes.filter(c=>

            String(c.nombre||"")
                .toLowerCase()
                .includes(texto)

            ||

            String(c.telefono||"")
                .toLowerCase()
                .includes(texto)

            ||

            String(c.codigo_tarjeta||"")
                .toLowerCase()
                .includes(texto)

        );


    renderClientes(lista);

}


function abrirClienteModal(){

    document.getElementById(
        "clienteModal"
    ).style.display="flex";


    document.getElementById(
        "clienteNombre"
    ).value="";

    document.getElementById(
        "clienteTelefono"
    ).value="";

    document.getElementById(
        "clienteCodigo"
    ).value="";

}


function cerrarClienteModal(){

    document.getElementById(
        "clienteModal"
    ).style.display="none";

}


async function guardarCliente(){

    const nombre =
        document.getElementById(
            "clienteNombre"
        ).value.trim();


    if(!nombre){

        mostrarAlert(
            "El nombre es obligatorio.",
            "error"
        );

        return;

    }


    const datos={

        nombre:nombre,

        telefono:
            document.getElementById(
                "clienteTelefono"
            ).value.trim() || null,

        codigo_tarjeta:
            document.getElementById(
                "clienteCodigo"
            ).value.trim() || null,

        puntos:0

    };


    const resultado =
        await supabaseClient
        .from("clientes")
        .insert(datos);


    if(resultado.error){

        mostrarAlert(
            resultado.error.message,
            "error"
        );

        return;

    }


    cerrarClienteModal();

    await cargarTodo();

    mostrarPagina("clientes");

    mostrarAlert(
        "Cliente guardado correctamente."
    );

}


async function eliminarCliente(id){

    if(!confirm(
        "¿Eliminar este cliente?"
    ))
        return;


    const resultado =
        await supabaseClient
        .from("clientes")
        .delete()
        .eq("id",id);


    if(resultado.error){

        mostrarAlert(
            resultado.error.message,
            "error"
        );

        return;

    }


    await cargarTodo();

    mostrarPagina("clientes");

}
