<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | Punto de Venta</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
header{text-align:center;background:#111;color:#fff;padding:28px 16px}
header h1{margin:0 0 6px;font-size:30px}
header p{margin:0;font-size:16px}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:22px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer}
.primary,.pink{background:#ec0a6a;color:#fff}
.danger{background:#e53935;color:#fff}
.secondary{background:#eee;color:#222}
.nn-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}
.nn-modal-box{background:#fff;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px;position:relative}
.nn-close{position:absolute;right:18px;top:12px;font-size:28px;cursor:pointer}
.nn-form{display:grid;gap:12px}
.nn-form input,.nn-form select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:15px}
.nn-card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:25px;color:#777}
.total{font-size:24px;font-weight:700;margin:18px 0}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
</style>
</head>

<body>
<header>
  <h1>Nat.Nation Sneakers</h1>
  <p>Donde empieza tu estilo.</p>
</header>

<main>
  <div class="grid">
    <div class="card">
      <h2>🛍️ Punto de Venta</h2>
      <p>Sistema de ventas en línea para Nat.Nation Sneakers.</p>
      <button class="pink" onclick="nuevaVenta()">🛒 Nueva venta</button>
    </div>

    <div class="card">
      <h2>👟 Inventario</h2>
      <p>Modelos, tallas, precios y existencias.</p>
      <button onclick="mostrarInventario()">👟 Inventario</button>
    </div>

    <div class="card">
      <h2>👤 Clientes</h2>
      <p>Clientes y programa de puntos.</p>
      <button onclick="mostrarClientes()">👤 Clientes</button>
    </div>

    <div class="card">
      <h2>📊 Reportes</h2>
      <p>Ventas, formas de pago y tickets.</p>
      <button onclick="mostrarReportes()">📊 Reportes</button>
    </div>
  </div>
</main>

<div id="modal" class="nn-modal" onclick="cerrarFondo(event)">
  <div class="nn-modal-box">
    <span class="nn-close" onclick="cerrar()">×</span>
    <div id="contenido"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
let inventario = leer("nn_inventario", []);
let clientes = leer("nn_clientes", []);
let ventas = leer("nn_ventas", []);
let carrito = [];

function leer(clave, defecto){
  try{
    const dato = localStorage.getItem(clave);
    return dato ? JSON.parse(dato) : defecto;
  }catch(e){
    return defecto;
  }
}

function guardar(){
  localStorage.setItem("nn_inventario", JSON.stringify(inventario));
  localStorage.setItem("nn_clientes", JSON.stringify(clientes));
  localStorage.setItem("nn_ventas", JSON.stringify(ventas));
}

function abrir(html){
  document.getElementById("contenido").innerHTML = html;
  document.getElementById("modal").style.display = "flex";
}

function cerrar(){
  document.getElementById("modal").style.display = "none";
}

function cerrarFondo(e){
  if(e.target.id === "modal") cerrar();
}

function dinero(n){
  return "$" + Number(n || 0).toLocaleString("es-MX",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function esc(texto){
  return String(texto ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

/* =========================
   FOLIOS
========================= */

function obtenerSiguienteFolio(){
  let ultimo = Number(localStorage.getItem("nn_ultimo_folio") || 0);
  ultimo++;
  localStorage.setItem("nn_ultimo_folio", String(ultimo));
  return String(ultimo).padStart(6,"0");
}

/* =========================
   VENTAS
========================= */

function nuevaVenta(){
  carrito = [];
  renderVenta();
}

function renderVenta(){
  if(!inventario.length){
    abrir(`
      <h2>🛒 Nueva venta</h2>
      <div class="nn-card empty">
        Primero agrega productos al inventario.
      </div>
      <button class="primary" onclick="mostrarInventario()">👟 Ir al inventario</button>
    `);
    return;
  }

  const opcionesProductos = inventario
    .map((p,i)=>`
      <option value="${i}" ${Number(p.stock)<=0 ? "disabled":""}>
        ${esc(p.modelo)} | Talla #${esc(p.talla)} | ${dinero(p.precio)} | Stock: ${p.stock}
      </option>
    `).join("");

  const opcionesClientes = `
    <option value="">Público general</option>
    ${clientes.map((c,i)=>`
      <option value="${i}">
        ${esc(c.nombre)} | Puntos: ${Number(c.puntos||0)}
      </option>
    `).join("")}
  `;

  abrir(`
    <h2>🛒 Nueva venta</h2>

    <label>Producto</label>
    <select id="productoVenta">
      ${opcionesProductos}
    </select>

    <div class="actions" style="margin-top:10px">
      <button class="primary" onclick="agregarCarrito()">＋ Agregar al carrito</button>
      <button class="secondary" onclick="mostrarClientes()">👤 Ver clientes</button>
    </div>

    <div id="listaCarrito" style="margin-top:15px"></div>

    <div class="total">
      Total: <span id="totalVenta">$0.00</span>
    </div>

    <label>Forma de pago</label>
    <select id="pago" onchange="actualizarPago()">
      <option value="Efectivo">💵 Efectivo</option>
      <option value="Transferencia">🏦 Transferencia</option>
      <option value="Tarjeta">💳 Tarjeta</option>
    </select>

    <div id="efectivoBox">
      <label>Recibido en efectivo</label>
      <input id="recibido" type="number" min="0" step="0.01"
             placeholder="Ej. 500" oninput="actualizarCambio()">
      <div id="cambio">Cambio: $0.00</div>
    </div>

    <label style="margin-top:12px">Cliente</label>
    <select id="clienteVenta" onchange="actualizarClientePorSelect()">
      ${opcionesClientes}
    </select>

    <label>Código de tarjeta del cliente (opcional)</label>
    <input id="codigoCliente"
           placeholder="Escanea o escribe el código de la tarjeta">

    <div class="actions" style="margin-top:16px">
      <button class="primary" onclick="finalizarVenta()">💰 Finalizar venta</button>
      <button class="secondary" onclick="cerrar()">Cancelar</button>
    </div>
  `);

  actualizarPago();
  renderCarrito();
}

function agregarCarrito(){
  const i = Number(document.getElementById("productoVenta").value);
  const p = inventario[i];

  if(!p || Number(p.stock)<=0){
    alert("Ese producto no tiene existencias.");
    return;
  }

  const cantidadEnCarrito = carrito.filter(x=>x.indice===i).length;

  if(cantidadEnCarrito >= Number(p.stock)){
    alert("No puedes agregar más unidades de este producto.");
    return;
  }

  carrito.push({indice:i});
  renderCarrito();
}

function quitarCarrito(pos){
  carrito.splice(pos,1);
  renderCarrito();
}

function renderCarrito(){
  const lista = document.getElementById("listaCarrito");
  const totalEl = document.getElementById("totalVenta");

  if(!lista) return;

  if(!carrito.length){
    lista.innerHTML = `<div class="nn-card empty">El carrito está vacío.</div>`;
    totalEl.textContent = "$0.00";
    actualizarCambio();
    return;
  }

  let total = 0;

  lista.innerHTML = carrito.map((item,pos)=>{
    const p = inventario[item.indice];
    total += Number(p.precio);

    return `
      <div class="nn-card">
        <b>${esc(p.modelo)}</b> · Talla #${esc(p.talla)}
        <br>${dinero(p.precio)}
        <button class="secondary" onclick="quitarCarrito(${pos})">Quitar</button>
      </div>
    `;
  }).join("");

  totalEl.textContent = dinero(total);
  actualizarCambio();
}

function actualizarPago(){
  const pago = document.getElementById("pago");
  const box = document.getElementById("efectivoBox");

  if(!pago || !box) return;

  box.style.display = pago.value === "Efectivo" ? "block" : "none";
  actualizarCambio();
}

function actualizarCambio(){
  const total = carrito.reduce((s,item)=>s+Number(inventario[item.indice].precio),0);
  const recibido = Number(document.getElementById("recibido")?.value || 0);
  const cambio = Math.max(0, recibido-total);

  const el = document.getElementById("cambio");
  if(el) el.textContent = "Cambio: " + dinero(cambio);
}

function actualizarClientePorSelect(){
  const select = document.getElementById("clienteVenta");
  const codigo = document.getElementById("codigoCliente");

  if(!select || !codigo) return;

  if(select.value === ""){
    codigo.value = "";
  }else{
    codigo.value = clientes[Number(select.value)]?.codigo || "";
  }
}

function finalizarVenta(){
  if(!carrito.length){
    alert("Agrega al menos un producto.");
    return;
  }

  const pago = document.getElementById("pago").value;
  const total = carrito.reduce((s,item)=>s+Number(inventario[item.indice].precio),0);

  let recibido = 0;
  let cambio = 0;

  if(pago === "Efectivo"){
    recibido = Number(document.getElementById("recibido").value || 0);

    if(recibido < total){
      alert("El efectivo recibido es menor al total.");
      return;
    }

    cambio = recibido-total;
  }

  const clienteSelect = document.getElementById("clienteVenta");
  const clienteIndex = clienteSelect.value === "" ? null : Number(clienteSelect.value);
  const clienteObj = clienteIndex === null ? null : clientes[clienteIndex];

  /* Descontar inventario */
  const cantidades = {};

  carrito.forEach(item=>{
    cantidades[item.indice] = (cantidades[item.indice] || 0) + 1;
  });

  for(const indice in cantidades){
    inventario[indice].stock =
      Number(inventario[indice].stock) - cantidades[indice];
  }

  /* Puntos: solamente para clientes registrados */
  const puntos = clienteObj ? Math.floor(total/10) : 0;

  if(clienteObj){
    clienteObj.puntos = Number(clienteObj.puntos || 0) + puntos;
  }

  const folio = obtenerSiguienteFolio();

  const venta = {
    folio,
    fecha: new Date().toLocaleString("es-MX"),
    productos: carrito.map(item=>{
      const p = inventario[item.indice];
      return {
        modelo:p.modelo,
        talla:p.talla,
        precio:Number(p.precio)
      };
    }),
    total,
    pago,
    cliente: clienteObj ? clienteObj.nombre : "Público general",
    clienteCodigo: clienteObj ? clienteObj.codigo : "",
    puntos,
    recibido,
    cambio
  };

  ventas.push(venta);
  guardar();

  imprimirTicket(venta);

  cerrar();

  setTimeout(()=>{
    alert(
      "¡Venta registrada!\n\n" +
      "Ticket: " + venta.folio + "\n" +
      "Total: " + dinero(total) + "\n" +
      "Pago: " + pago + "\n" +
      "Puntos: +" + puntos
    );
  },100);
}

/* =========================
   TICKET
========================= */

function imprimirTicket(v){
  const productos = v.productos.map(p=>`
    <div class="ticket-row">
      <span>${esc(p.modelo)} T#${esc(p.talla)}</span>
      <span>${dinero(p.precio)}</span>
    </div>
  `).join("");

  document.getElementById("printArea").innerHTML = `
    <div style="max-width:320px;margin:0 auto;font-family:Arial,sans-serif">
      <h2 style="text-align:center;margin-bottom:4px">Nat.Nation Sneakers</h2>
      <p style="text-align:center;margin-top:0">Donde empieza tu estilo.</p>

      <hr>

      <h3 style="text-align:center">Ticket ${esc(v.folio)}</h3>

      <p style="text-align:center">
        ${esc(v.fecha)}<br>
        Cliente: ${esc(v.cliente)}
      </p>

      <hr>

      ${productos}

      <hr>

      <div class="ticket-row">
        <b>TOTAL</b>
        <b>${dinero(v.total)}</b>
      </div>

      <p style="text-align:center">
        Pago: <b>${esc(v.pago)}</b><br>
        ${v.pago==="Efectivo"
          ? `Recibido: ${dinero(v.recibido)} · Cambio: ${dinero(v.cambio)}`
          : ""}
      </p>

      ${v.puntos>0 ? `
        <p style="text-align:center">
          Puntos ganados: ⭐ ${v.puntos}
        </p>
      ` : ""}

      <hr>

      <p style="text-align:center">¡Gracias por tu compra!</p>
    </div>
  `;

  window.print();
}

/* =========================
   INVENTARIO
========================= */

function mostrarInventario(){
  abrir(`
    <h2>👟 Inventario</h2>
    <button class="primary" onclick="agregarInventario()">＋ Agregar producto</button>
    <div id="listaInv"></div>
  `);

  listaInventario();
}

function listaInventario(){
  const l = document.getElementById("listaInv");
  if(!l) return;

  if(!inventario.length){
    l.innerHTML = `<div class="empty">No hay productos en inventario.</div>`;
    return;
  }

  l.innerHTML = inventario.map((p,i)=>`
    <div class="nn-card">
      <b>${esc(p.modelo)}</b> · Talla #${esc(p.talla)}<br>
      Precio: <b>${dinero(p.precio)}</b> ·
      Stock: <b>${p.stock}</b>

      <div class="actions" style="margin-top:10px">
        <button class="secondary" onclick="editarInventario(${i})">✏️ Editar</button>
        <button class="danger" onclick="eliminarInventario(${i})">🗑️ Eliminar</button>
      </div>
    </div>
  `).join("");
}

function agregarInventario(){
  abrir(`
    <h2>＋ Agregar producto</h2>

    <div class="nn-form">
      <input id="m" placeholder="Modelo del tenis">
      <input id="t" placeholder="Talla">
      <input id="p" type="number" min="0" step="0.01" placeholder="Precio de venta">
      <input id="s" type="number" min="0" step="1" placeholder="Existencias">

      <button class="primary" onclick="guardarProducto()">Guardar producto</button>
    </div>
  `);
}

function guardarProducto(){
  const modelo = document.getElementById("m").value.trim();
  const talla = document.getElementById("t").value.trim();
  const precio = Number(document.getElementById("p").value);
  const stock = Number(document.getElementById("s").value);

  if(!modelo || !talla || !Number.isFinite(precio) || precio<0 ||
     !Number.isInteger(stock) || stock<0){
    alert("Completa correctamente todos los campos.");
    return;
  }

  inventario.push({
    modelo,
    talla,
    precio,
    stock
  });

  guardar();
  mostrarInventario();
}

function editarInventario(i){
  const p = inventario[i];

  abrir(`
    <h2>✏️ Editar producto</h2>

    <div class="nn-form">
      <input id="em" value="${esc(p.modelo)}" placeholder="Modelo">
      <input id="et" value="${esc(p.talla)}" placeholder="Talla">
      <input id="ep" type="number" min="0" step="0.01" value="${Number(p.precio)}" placeholder="Precio">
      <input id="es" type="number" min="0" step="1" value="${Number(p.stock)}" placeholder="Stock">

      <button class="primary" onclick="actualizarInventario(${i})">
        Guardar cambios
      </button>
    </div>
  `);
}

function actualizarInventario(i){
  const modelo = document.getElementById("em").value.trim();
  const talla = document.getElementById("et").value.trim();
  const precio = Number(document.getElementById("ep").value);
  const stock = Number(document.getElementById("es").value);

  if(!modelo || !talla || !Number.isFinite(precio) || precio<0 ||
     !Number.isInteger(stock) || stock<0){
    alert("Completa correctamente todos los campos.");
    return;
  }

  inventario[i] = {modelo,talla,precio,stock};

  guardar();
  mostrarInventario();
}

function eliminarInventario(i){
  if(!confirm("¿Eliminar este producto del inventario?")) return;

  inventario.splice(i,1);
  guardar();
  mostrarInventario();
}

/* =========================
   CLIENTES
========================= */

function mostrarClientes(){
  abrir(`
    <h2>👤 Clientes y puntos</h2>

    <button class="primary" onclick="agregarCliente()">＋ Nuevo cliente</button>

    <div id="listaCli"></div>
  `);

  listaClientes();
}

function listaClientes(){
  const l = document.getElementById("listaCli");
  if(!l) return;

  if(!clientes.length){
    l.innerHTML = `<div class="empty">No hay clientes registrados.</div>`;
    return;
  }

  l.innerHTML = clientes.map((c,i)=>`
    <div class="nn-card">
      <b>${esc(c.nombre)}</b><br>
      Teléfono: ${esc(c.telefono || "-")}<br>
      Tarjeta: ${esc(c.codigo || "-")}<br>
      ⭐ Puntos: <b>${Number(c.puntos || 0)}</b>

      <div class="actions" style="margin-top:10px">
        <button class="secondary" onclick="editarCliente(${i})">✏️ Editar</button>
        <button class="danger" onclick="eliminarCliente(${i})">🗑️ Eliminar</button>
      </div>
    </div>
  `).join("");
}

function agregarCliente(){
  abrir(`
    <h2>＋ Nuevo cliente</h2>

    <div class="nn-form">
      <input id="cn" placeholder="Nombre del cliente">
      <input id="ct" placeholder="Teléfono">
      <input id="cc" placeholder="Código de tarjeta">

      <button class="primary" onclick="guardarCliente()">
        Guardar cliente
      </button>
    </div>
  `);
}

function guardarCliente(){
  const nombre = document.getElementById("cn").value.trim();
  const telefono = document.getElementById("ct").value.trim();
  const codigo = document.getElementById("cc").value.trim();

  if(!nombre){
    alert("Escribe el nombre del cliente.");
    return;
  }

  if(codigo && clientes.some(c=>c.codigo===codigo)){
    alert("Ese código de tarjeta ya está registrado.");
    return;
  }

  clientes.push({
    nombre,
    telefono,
    codigo,
    puntos:0
  });

  guardar();
  mostrarClientes();
}

function editarCliente(i){
  const c = clientes[i];

  abrir(`
    <h2>✏️ Editar cliente</h2>

    <div class="nn-form">
      <input id="ecn" value="${esc(c.nombre)}" placeholder="Nombre">
      <input id="ect" value="${esc(c.telefono || "")}" placeholder="Teléfono">
      <input id="ecc" value="${esc(c.codigo || "")}" placeholder="Código de tarjeta">

      <button class="primary" onclick="actualizarCliente(${i})">
        Guardar cambios
      </button>
    </div>
  `);
}

function actualizarCliente(i){
  const nombre = document.getElementById("ecn").value.trim();
  const telefono = document.getElementById("ect").value.trim();
  const codigo = document.getElementById("ecc").value.trim();

  if(!nombre){
    alert("Escribe el nombre del cliente.");
    return;
  }

  if(codigo && clientes.some((c,index)=>index!==i && c.codigo===codigo)){
    alert("Ese código de tarjeta ya está registrado.");
    return;
  }

  clientes[i] = {
    ...clientes[i],
    nombre,
    telefono,
    codigo
  };

  guardar();
  mostrarClientes();
}

function eliminarCliente(i){
  if(!confirm("¿Eliminar este cliente? Sus ventas históricas se conservarán.")) return;

  clientes.splice(i,1);
  guardar();
  mostrarClientes();
}

/* =========================
   REPORTES
========================= */

function mostrarReportes(){
  const total = ventas.reduce((s,v)=>s+Number(v.total||0),0);
  const efectivo = ventas.filter(v=>v.pago==="Efectivo")
                         .reduce((s,v)=>s+Number(v.total||0),0);
  const transferencia = ventas.filter(v=>v.pago==="Transferencia")
                              .reduce((s,v)=>s+Number(v.total||0),0);
  const tarjeta = ventas.filter(v=>v.pago==="Tarjeta")
                        .reduce((s,v)=>s+Number(v.total||0),0);
  const puntos = ventas.reduce((s,v)=>s+Number(v.puntos||0),0);

  abrir(`
    <h2>📊 Reportes</h2>

    <div class="nn-card">Ventas realizadas: <b>${ventas.length}</b></div>
    <div class="nn-card">Ventas totales: <b>${dinero(total)}</b></div>
    <div class="nn-card">💵 Efectivo: <b>${dinero(efectivo)}</b></div>
    <div class="nn-card">🏦 Transferencia: <b>${dinero(transferencia)}</b></div>
    <div class="nn-card">💳 Tarjeta: <b>${dinero(tarjeta)}</b></div>
    <div class="nn-card">⭐ Puntos generados: <b>${puntos}</b></div>

    <h3>Últimas ventas</h3>

    ${
      ventas.length
      ? ventas.slice(-10).reverse().map(v=>`
          <div class="nn-card">
            <b>Ticket ${esc(v.folio)}</b> · ${esc(v.fecha)}<br>
            ${esc(v.cliente || "Público general")} ·
            ${esc(v.pago)} · <b>${dinero(v.total)}</b>
          </div>
        `).join("")
      : `<div class="nn-card empty">No hay ventas registradas.</div>`
    }

    <hr>

    <div class="nn-card">
      <h3>⚙️ Inicio de operación real</h3>
      <p>
        Cuando termines las pruebas, usa este botón para borrar
        inventario, clientes, ventas y puntos de prueba.
      </p>

      <button class="danger" onclick="iniciarOperacionReal()">
        🧹 Borrar pruebas y comenzar desde 000001
      </button>
    </div>
  `);
}

function iniciarOperacionReal(){

  const ok = confirm(
    "⚠️ ATENCIÓN\\n\\n" +
    "Se borrarán TODOS los datos actuales de prueba:\\n\\n" +
    "• Inventario\\n" +
    "• Clientes\\n" +
    "• Ventas\\n" +
    "• Puntos\\n" +
    "• Numeración de tickets\\n\\n" +
    "El primer ticket real será 000001.\\n\\n" +
    "¿Continuar?"
  );

  if(!ok) return;

  const ok2 = confirm(
    "ÚLTIMA CONFIRMACIÓN\\n\\n" +
    "Esta acción no se puede deshacer desde el sistema.\\n\\n" +
    "¿Quieres comenzar la operación REAL desde cero?"
  );

  if(!ok2) return;

  inventario = [];
  clientes = [];
  ventas = [];
  carrito = [];

  localStorage.removeItem("nn_inventario");
  localStorage.removeItem("nn_clientes");
  localStorage.removeItem("nn_ventas");

  localStorage.setItem("nn_ultimo_folio","0");

  guardar();

  cerrar();

  alert(
    "✅ SISTEMA LISTO\\n\\n" +
    "Las pruebas fueron eliminadas.\\n\\n" +
    "🎟️ El próximo ticket será 000001."
  );
}

/* =========================
   LECTOR DE TARJETA
========================= */

document.addEventListener("input",function(e){
  if(!e.target || e.target.id!=="codigoCliente") return;

  const codigo = e.target.value.trim();
  if(!codigo) return;

  const cliente = clientes.find(c=>c.codigo===codigo);

  if(cliente){
    const select = document.getElementById("clienteVenta");

    if(select){
      const indice = clientes.indexOf(cliente);
      select.value = String(indice);
    }
  }
});
</script>
