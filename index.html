<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | Punto de Venta</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f7f7f8;
    color:#171717;
}

/* =========================
   ESTRUCTURA
========================= */

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:235px;
    background:#111111;
    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    padding:20px 14px;
    z-index:100;
}

.logo{
    width:150px;
    height:90px;
    object-fit:contain;
    display:block;
    margin:0 auto 20px;
}

.brand-fallback{
    text-align:center;
    margin-bottom:22px;
}

.brand-fallback strong{
    display:block;
    font-size:22px;
    font-style:italic;
}

.brand-fallback span{
    font-size:11px;
    letter-spacing:4px;
    color:#ff2b88;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu button{
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 15px;
    border-radius:10px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.menu button:hover,
.menu button.active{
    background:#ff2b88;
    color:white;
}

.menu button span{
    margin-right:10px;
}

/* =========================
   CONTENIDO
========================= */

.main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.topbar h1{
    font-size:26px;
}

.topbar p{
    color:#777;
    margin-top:5px;
}

.top-actions{
    display:flex;
    gap:10px;
}

/* =========================
   BOTONES
========================= */

.btn{
    border:0;
    padding:11px 17px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    background:#eee;
}

.btn-pink{
    background:#ff2b88;
    color:white;
}

.btn-black{
    background:#111;
    color:white;
}

.btn-danger{
    background:#ffe1e9;
    color:#c50045;
}

.btn:hover{
    opacity:.88;
}

/* =========================
   DASHBOARD
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stat small{
    color:#888;
}

.stat h2{
    margin-top:8px;
    font-size:25px;
}

/* =========================
   CATALOGO
========================= */

.section{
    background:white;
    border-radius:17px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-header h2{
    font-size:19px;
}

.search{
    width:300px;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product{
    border:1px solid #eee;
    border-radius:14px;
    overflow:hidden;
    background:white;
    transition:.2s;
    position:relative;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 20px rgba(0,0,0,.08);
}

.product-img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#f4f4f4;
}

.product-info{
    padding:13px;
}

.product-name{
    font-weight:bold;
    margin-bottom:6px;
}

.product-size{
    color:#777;
    font-size:13px;
}

.product-price{
    font-size:19px;
    font-weight:bold;
    margin-top:8px;
}

.stock{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.product-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.product-actions button{
    flex:1;
}

/* =========================
   TABLAS
========================= */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    color:#777;
    font-size:13px;
}

td{
    font-size:14px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:13px;
    font-weight:bold;
}

.field input,
.field select{
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

.preview{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
    display:none;
    margin-top:10px;
}

/* =========================
   VENTA
========================= */

.sale-layout{
    display:grid;
    grid-template-columns:1fr 390px;
    gap:20px;
}

.sale-products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.sale-product{
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.sale-product img{
    width:100%;
    height:130px;
    object-fit:cover;
}

.sale-product-info{
    padding:10px;
}

.cart{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.cart h3{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-total{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

.payment{
    margin-top:20px;
}

.payment select,
.payment input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-top:8px;
}

/* =========================
   CLIENTES
========================= */

.client-card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* =========================
   TICKET
========================= */

#printArea{
    display:none;
}

.ticket{
    width:80mm;
    background:white;
    padding:10px;
    font-family:monospace;
    color:#000;
}

.ticket-logo{
    width:55mm;
    display:block;
    margin:auto;
}

.ticket-center{
    text-align:center;
}

.ticket-line{
    border-top:1px dashed #000;
    margin:8px 0;
}

.ticket-row{
    display:flex;
    justify-content:space-between;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .sale-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){
    .sidebar{
        width:75px;
        padding:12px 8px;
    }

    .logo{
        width:55px;
    }

    .brand-fallback{
        display:none;
    }

    .menu button{
        text-align:center;
        font-size:0;
    }

    .menu button span{
        font-size:20px;
        margin:0;
    }

    .main{
        margin-left:75px;
        width:calc(100% - 75px);
        padding:15px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .search{
        width:100%;
    }

    .section-header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }
}

@media print{
    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        display:block;
        position:absolute;
        left:0;
        top:0;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     MENU LATERAL
========================= -->

<aside class="sidebar">

    <img src="logo.png" class="logo"
         onerror="this.style.display='none';document.getElementById('brandFallback').style.display='block';">

    <div id="brandFallback" class="brand-fallback" style="display:none;">
        <strong>Nat.Nation</strong>
        <span>SNEAKERS</span>
    </div>

    <nav class="menu">

        <button onclick="mostrarInicio()" class="active">
            <span>⌂</span> Inicio
        </button>

        <button onclick="mostrarVentas()">
            <span>🛒</span> Ventas
        </button>

        <button onclick="mostrarProductos()">
            <span>👟</span> Productos
        </button>

        <button onclick="mostrarClientes()">
            <span>👤</span> Clientes
        </button>

        <button onclick="mostrarPuntos()">
            <span>⭐</span> Puntos
        </button>

        <button onclick="mostrarReportes()">
            <span>📊</span> Reportes
        </button>

        <button onclick="mostrarConfiguracion()">
            <span>⚙️</span> Configuración
        </button>

    </nav>
</aside>


<!-- =========================
     CONTENIDO
========================= -->

<main class="main">

    <div class="topbar">

        <div>
            <h1 id="titulo">Inicio</h1>
            <p id="subtitulo">
                Punto de venta · Nat.Nation Sneakers
            </p>
        </div>

        <div class="top-actions">
            <button class="btn btn-pink" onclick="abrirProducto()">
                + Agregar producto
            </button>
        </div>

    </div>

    <div id="contenido"></div>

</main>

</div>


<!-- =========================
     MODAL
========================= -->

<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitulo">Ventana</h2>
            <button class="close" onclick="cerrarModal()">×</button>
        </div>

        <div id="modalContenido"></div>

    </div>

</div>


<div id="printArea"></div>


<script>

/* =====================================================
   DATOS
===================================================== */

let productos = JSON.parse(
    localStorage.getItem("natnation_productos") || "[]"
);

let clientes = JSON.parse(
    localStorage.getItem("natnation_clientes") || "[]"
);

let ventas = JSON.parse(
    localStorage.getItem("natnation_ventas") || "[]"
);

let carrito = [];

let puntosPorPeso = 1;


/* =====================================================
   GUARDAR
===================================================== */

function guardar(){

    localStorage.setItem(
        "natnation_productos",
        JSON.stringify(productos)
    );

    localStorage.setItem(
        "natnation_clientes",
        JSON.stringify(clientes)
    );

    localStorage.setItem(
        "natnation_ventas",
        JSON.stringify(ventas)
    );
}


/* =====================================================
   UTILIDADES
===================================================== */

function dinero(valor){
    return Number(valor || 0).toLocaleString(
        "es-MX",
        {
            style:"currency",
            currency:"MXN"
        }
    );
}

function esc(texto){
    return String(texto || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function cambiarTitulo(titulo,subtitulo=""){
    document.getElementById("titulo").textContent=titulo;
    document.getElementById("subtitulo").textContent=subtitulo;
}

function modal(titulo,contenido){

    document.getElementById("modalTitulo").textContent=titulo;
    document.getElementById("modalContenido").innerHTML=contenido;

    document.getElementById("modal").classList.add("show");
}

function cerrarModal(){
    document.getElementById("modal").classList.remove("show");
}


/* =====================================================
   INICIO
===================================================== */

function mostrarInicio(){

    cambiarTitulo(
        "Inicio",
        "Punto de venta · Nat.Nation Sneakers"
    );

    const ventasHoy = ventas.filter(v =>
        new Date(v.fecha).toDateString() === new Date().toDateString()
    );

    const totalHoy = ventasHoy.reduce(
        (a,v)=>a+Number(v.total),
        0
    );

    const stock = productos.reduce(
        (a,p)=>a+Number(p.stock || 0),
        0
    );

    document.getElementById("contenido").innerHTML=`

        <div class="stats">

            <div class="stat">
                <small>Ventas de hoy</small>
                <h2>${dinero(totalHoy)}</h2>
            </div>

            <div class="stat">
                <small>Ventas</small>
                <h2>${ventasHoy.length}</h2>
            </div>

            <div class="stat">
                <small>Productos</small>
                <h2>${productos.length}</h2>
            </div>

            <div class="stat">
                <small>Existencias</small>
                <h2>${stock}</h2>
            </div>

        </div>

        <div class="section">

            <div class="section-header">

                <div>
                    <h2>Productos</h2>
                    <p style="color:#888;margin-top:5px;">
                        Selecciona un producto para vender
                    </p>
                </div>

                <input
                    class="search"
                    id="buscarInicio"
                    placeholder="Buscar producto..."
                    oninput="filtrarInicio()"
                >

            </div>

            <div id="productosInicio" class="products">

                ${renderProductos(productos)}

            </div>

        </div>
    `;
}


function filtrarInicio(){

    const texto =
        document.getElementById("buscarInicio")
        .value
        .toLowerCase();

    const filtrados=productos.filter(p=>
        p.nombre.toLowerCase().includes(texto) ||
        String(p.talla).includes(texto)
    );

    document.getElementById("productosInicio").innerHTML =
        renderProductos(filtrados);
}


/* =====================================================
   PRODUCTOS
===================================================== */

function mostrarProductos(){

    cambiarTitulo(
        "Productos",
        "Inventario de Nat.Nation Sneakers"
    );

    document.getElementById("contenido").innerHTML=`

        <div class="section">

            <div class="section-header">

                <h2>Inventario</h2>

                <button
                    class="btn btn-pink"
                    onclick="abrirProducto()">
                    + Agregar producto
                </button>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Talla</th>
                            <th>Precio</th>
                            <th>Existencia</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${productos.map((p,i)=>`

                            <tr>

                                <td>
                                    <img
                                        src="${p.foto || ''}"
                                        style="
                                        width:55px;
                                        height:55px;
                                        object-fit:cover;
                                        border-radius:8px;
                                        background:#eee;
                                        "
                                    >
                                </td>

                                <td>
                                    <strong>${esc(p.nombre)}</strong>
                                </td>

                                <td>${esc(p.talla)}</td>

                                <td>${dinero(p.precio)}</td>

                                <td>${p.stock}</td>

                                <td>

                                    <button
                                        class="btn"
                                        onclick="editarProducto(${i})">
                                        Editar
                                    </button>

                                    <button
                                        class="btn btn-danger"
                                        onclick="eliminarProducto(${i})">
                                        Eliminar
                                    </button>

                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        </div>
    `;
}


function renderProductos(lista){

    if(!lista.length){

        return `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#888;
            ">
                No hay productos todavía.
                <br><br>
                Agrega tu primer par 👟
            </div>
        `;
    }

    return lista.map(p=>{

        const indice=productos.indexOf(p);

        return `

            <div class="product">

                <img
                    class="product-img"
                    src="${p.foto || ''}"
                    onerror="this.style.display='none'"
                >

                <div class="product-info">

                    <div class="product-name">
                        ${esc(p.nombre)}
                    </div>

                    <div class="product-size">
                        Talla #${esc(p.talla)}
                    </div>

                    <div class="product-price">
                        ${dinero(p.precio)}
                    </div>

                    <div class="stock">
                        Existencias: ${p.stock}
                    </div>

                    <div class="product-actions">

                        <button
                            class="btn btn-pink"
                            onclick="agregarVenta(${indice})">
                            Vender
                        </button>

                    </div>

                </div>

            </div>
        `;

    }).join("");
}


/* =====================================================
   AGREGAR PRODUCTO
===================================================== */

function abrirProducto(indice=null){

    const editar = indice !== null;

    const p = editar ? productos[indice] : {};

    modal(
        editar ? "Editar producto" : "Agregar producto",
        `

        <div class="form">

            <div class="field full">

                <label>Foto del producto</label>

                <input
                    type="file"
                    id="fotoProducto"
                    accept="image/*"
                    onchange="previsualizarFoto()"
                >

                <img
                    id="previewFoto"
                    class="preview"
                    src="${p.foto || ''}"
                    style="${p.foto ? 'display:block;' : ''}"
                >

            </div>

            <div class="field full">

                <label>Nombre / modelo</label>

                <input
                    id="nombreProducto"
                    value="${esc(p.nombre || '')}"
                    placeholder="Ej. Samba OG"
                >

            </div>

            <div class="field">

                <label>Talla</label>

                <input
                    id="tallaProducto"
                    value="${esc(p.talla || '')}"
                    placeholder="Ej. 25.5"
                >

            </div>

            <div class="field">

                <label>Precio de venta</label>

                <input
                    type="number"
                    id="precioProducto"
                    value="${p.precio || ''}"
                    placeholder="899"
                >

            </div>

            <div class="field">

                <label>Existencias</label>

                <input
                    type="number"
                    id="stockProducto"
                    value="${p.stock ?? ''}"
                    placeholder="1"
                >

            </div>

            <div class="field">

                <label>SKU / código</label>

                <input
                    id="skuProducto"
                    value="${esc(p.sku || '')}"
                    placeholder="Opcional"
                >

            </div>

            <div class="field full">

                <button
                    class="btn btn-pink"
                    onclick="guardarProducto(${editar ? indice : 'null'})">

                    ${editar ? "Guardar cambios" : "Agregar producto"}

                </button>

            </div>

        </div>

        `
    );
}


function previsualizarFoto(){

    const archivo =
        document.getElementById("fotoProducto").files[0];

    if(!archivo)return;

    const lector=new FileReader();

    lector.onload=function(e){

        const preview=
            document.getElementById("previewFoto");

        preview.src=e.target.result;
        preview.style.display="block";

    };

    lector.readAsDataURL(archivo);
}


function guardarProducto(indice){

    const archivo=
        document.getElementById("fotoProducto").files[0];

    const nombre=
        document.getElementById("nombreProducto").value.trim();

    const talla=
        document.getElementById("tallaProducto").value.trim();

    const precio=
        Number(document.getElementById("precioProducto").value);

    const stock=
        Number(document.getElementById("stockProducto").value);

    const sku=
        document.getElementById("skuProducto").value.trim();

    if(!nombre || !talla || !precio){

        alert("Completa nombre, talla y precio.");

        return;
    }


    const guardar=(foto)=>{

        const producto={

            nombre,
            talla,
            precio,
            stock,
            sku,
            foto:foto || (indice!==null ? productos[indice].foto : "")

        };


        if(indice===null){

            productos.push(producto);

        }else{

            productos[indice]=producto;

        }


        guardar();

        cerrarModal();

        mostrarProductos();

    };


    if(archivo){

        const lector=new FileReader();

        lector.onload=e=>guardar(e.target.result);

        lector.readAsDataURL(archivo);

    }else{

        guardar();

    }
}


function editarProducto(indice){

    abrirProducto(indice);

}


function eliminarProducto(indice){

    if(!confirm("¿Eliminar este producto?"))return;

    productos.splice(indice,1);

    guardar();

    mostrarProductos();

}


/* =====================================================
   VENTAS
===================================================== */

function mostrarVentas(){

    cambiarTitulo(
        "Ventas",
        "Realiza una nueva venta"
    );

    carrito=[];

    document.getElementById("contenido").innerHTML=`

        <div class="sale-layout">

            <div class="section">

                <div class="section-header">

                    <h2>Productos</h2>

                    <input
                        class="search"
                        id="buscarVenta"
                        placeholder="Buscar..."
                        oninput="filtrarVenta()"
                    >

                </div>

                <div
                    id="productosVenta"
                    class="sale-products">

                    ${renderProductosVenta(productos)}

                </div>

            </div>


            <div class="cart">

                <h3>🛒 Carrito</h3>

                <div id="carrito">
                    No hay productos.
                </div>

                <div class="payment">

                    <label>Cliente</label>

                    <select id="clienteVenta">

                        <option value="">
                            Venta sin cliente
                        </option>

                        ${clientes.map((c,i)=>`

                            <option value="${i}">
                                ${esc(c.nombre)}
                            </option>

                        `).join("")}

                    </select>


                    <label style="display:block;margin-top:15px;">
                        Forma de pago
                    </label>

                    <select id="pagoVenta"
                            onchange="actualizarPago()">

                        <option value="Efectivo">
                            💵 Efectivo
                        </option>

                        <option value="Transferencia">
                            🏦 Transferencia
                        </option>

                        <option value="Tarjeta">
                            💳 Tarjeta
                        </option>

                    </select>


                    <div id="efectivoBox">

                        <label style="display:block;margin-top:15px;">
                            Efectivo recibido
                        </label>

                        <input
                            type="number"
                            id="efectivoRecibido"
                            placeholder="$0"
                            oninput="actualizarCambio()"
                        >

                        <div
                            id="cambio"
                            style="
                            margin-top:10px;
                            font-weight:bold;
                            "
                        ></div>

                    </div>

                </div>

                <div
                    id="totalVenta"
                    class="cart-total">
                    Total: $0
                </div>

                <button
                    class="btn btn-pink"
                    style="width:100%;margin-top:15px;"
                    onclick="finalizarVenta()">

                    COBRAR

                </button>

            </div>

        </div>
    `;
}


function renderProductosVenta(lista){

    if(!lista.length){

        return `
            <p style="color:#888;">
                No hay productos.
            </p>
        `;
    }

    return lista.map(p=>{

        const i=productos.indexOf(p);

        return `

            <div
                class="sale-product"
                onclick="agregarVenta(${i})">

                <img
                    src="${p.foto || ''}"
                    onerror="this.style.display='none'"
                >

                <div class="sale-product-info">

                    <strong>
                        ${esc(p.nombre)}
                    </strong>

                    <div>
                        #${esc(p.talla)}
                    </div>

                    <b>
                        ${dinero(p.precio)}
                    </b>

                </div>

            </div>
        `;

    }).join("");
}


function filtrarVenta(){

    const texto=
        document.getElementById("buscarVenta")
        .value.toLowerCase();

    const lista=productos.filter(p=>
        p.nombre.toLowerCase().includes(texto) ||
        String(p.talla).includes(texto)
    );

    document.getElementById("productosVenta").innerHTML=
        renderProductosVenta(lista);
}


function agregarVenta(indice){

    const producto=productos[indice];

    if(!producto || producto.stock<=0){

        alert("Este producto está agotado.");

        return;
    }

    const existente=
        carrito.find(x=>x.indice===indice);

    if(existente){

        if(existente.cantidad>=producto.stock){

            alert("No hay más existencias.");

            return;
        }

        existente.cantidad++;

    }else{

        carrito.push({
            indice,
            cantidad:1
        });

    }

    renderCarrito();

}


function renderCarrito(){

    const contenedor=
        document.getElementById("carrito");

    if(!contenedor)return;

    if(!carrito.length){

        contenedor.innerHTML="No hay productos.";

        document.getElementById("totalVenta").textContent=
            "Total: $0";

        return;
    }


    let total=0;

    contenedor.innerHTML=carrito.map((item,i)=>{

        const p=productos[item.indice];

        const subtotal=
            Number(p.precio)*item.cantidad;

        total+=subtotal;

        return `

            <div class="cart-item">

                <div>

                    <strong>
                        ${esc(p.nombre)}
                    </strong>

                    <div style="color:#777;">
                        #${esc(p.talla)}
                        × ${item.cantidad}
                    </div>

                </div>

                <div>

                    ${dinero(subtotal)}

                    <button
                        class="btn btn-danger"
                        onclick="quitarCarrito(${i})"
                        style="padding:5px 8px;margin-left:5px;">
                        ×
                    </button>

                </div>

            </div>
        `;

    }).join("");


    document.getElementById("totalVenta").textContent=
        "Total: "+dinero(total);

    actualizarCambio();

}


function quitarCarrito(i){

    carrito.splice(i,1);

    renderCarrito();

}


function obtenerTotal(){

    return carrito.reduce((total,item)=>{

        const p=productos[item.indice];

        return total+
            Number(p.precio)*item.cantidad;

    },0);

}


function actualizarPago(){

    const pago=
        document.getElementById("pagoVenta").value;

    const box=
        document.getElementById("efectivoBox");

    if(pago==="Efectivo"){

        box.style.display="block";

    }else{

        box.style.display="none";

    }

}


function actualizarCambio(){

    const pago=
        document.getElementById("pagoVenta");

    const recibido=
        document.getElementById("efectivoRecibido");

    const cambio=
        document.getElementById("cambio");

    if(!pago || pago.value!=="Efectivo")return;

    const total=obtenerTotal();

    const efectivo=
        Number(recibido.value || 0);

    if(efectivo>=total){

        cambio.textContent=
            "Cambio: "+dinero(efectivo-total);

    }else{

        cambio.textContent=
            "Faltan: "+dinero(total-efectivo);

    }
}


function finalizarVenta(){

    if(!carrito.length){

        alert("Agrega productos al carrito.");

        return;
    }

    const total=obtenerTotal();

    const pago=
        document.getElementById("pagoVenta").value;

    const clienteIndice=
        document.getElementById("clienteVenta").value;


    let efectivo=0;
    let cambio=0;


    if(pago==="Efectivo"){

        efectivo=
            Number(
                document.getElementById("efectivoRecibido").value || 0
            );

        if(efectivo<total){

            alert("El efectivo recibido no es suficiente.");

            return;
        }

        cambio=efectivo-total;

    }


    const items=carrito.map(item=>{

        const p=productos[item.indice];

        p.stock-=item.cantidad;

        return {

            nombre:p.nombre,
            talla:p.talla,
            cantidad:item.cantidad,
            precio:p.precio,
            subtotal:p.precio*item.cantidad

        };

    });


    let puntos=0;

    let cliente=null;


    if(clienteIndice!==""){

        cliente=clientes[Number(clienteIndice)];

        puntos=Math.floor(total/puntosPorPeso);

        cliente.puntos=
            Number(cliente.puntos || 0)+puntos;

    }


    const venta={

        folio:
            "NN-"+Date.now(),

        fecha:
            new Date().toISOString(),

        productos:items,

        total,

        pago,

        cliente:
            cliente ? cliente.nombre : "",

        puntos,

        efectivo,

        cambio

    };


    ventas.push(venta);

    guardar();

    imprimirTicket(venta);

    carrito=[];

    mostrarInicio();

}

    document.getElementById("contenido").innerHTML=`

                <button

    `;
}


function abrirCliente(indice=null){

    const editar=indice!==null;
    const c=editar ? clientes[indice] : {};

    modal(
        editar ? "Editar cliente" : "Nuevo cliente",
        `

        <div class="form">

            <div class="field full">

                <label>Nombre</label>

                <input
                    id="nombreCliente"
                    value="${esc(c.nombre || '')}"
                >

            </div>

            <div class="field">

                <label>Teléfono</label>

                <input
                    id="telefonoCliente"
                    value="${esc(c.telefono || '')}"
                >

            </div>

            <div class="field">

                <label>Tarjeta / código</label>

                <input
                    id="codigoCliente"
                    value="${esc(c.codigo || '')}"
                >

            </div>

            <div class="field full">

                <button
                    class="btn btn-pink"
                    onclick="guardarCliente(${editar ? indice : 'null'})">

                    Guardar cliente

                </button>

            </div>

        </div>
        `
    );
}


function guardarCliente(indice){

    const nombre=
        document.getElementById("nombreCliente")
        .value.trim();

    const telefono=
        document.getElementById("telefonoCliente")
        .value.trim();

    const codigo=
        document.getElementById("codigoCliente")
        .value.trim();


    if(!nombre){

        alert("Escribe el nombre.");

        return;
    }


    const cliente={

        nombre,
        telefono,
        codigo,
        puntos:
            indice!==null
                ? clientes[indice].puntos || 0
                : 0

    };


    if(indice===null){

        clientes.push(cliente);

    }else{

        clientes[indice]=cliente;

    }


    guardar();

    cerrarModal();

    mostrarClientes();

}


function eliminarCliente(indice){

    if(!confirm("¿Eliminar cliente?"))return;

    clientes.splice(indice,1);

    guardar();

    mostrarClientes();

}
