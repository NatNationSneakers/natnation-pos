<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nat.Nation Sneakers POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#202124;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:265px;
    background:#111827;
    color:white;
    padding:28px 14px;
    z-index:10;
}

.logo{
    text-align:center;
    margin-bottom:40px;
}

.logo-box{
    width:78px;
    height:78px;
    background:white;
    color:#111827;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:bold;
    margin:auto;
}

.logo h2{
    margin:14px 0 4px;
    font-size:22px;
}

.logo p{
    margin:0;
    color:#9ca3af;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#e5e7eb;
    padding:15px 14px;
    border-radius:10px;
    text-align:left;
    font-size:16px;
}

.menu button:hover,
.menu button.active{
    background:#273449;
}

.main{
    margin-left:265px;
    min-height:100vh;
}

.topbar{
    height:85px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.topbar h1{
    margin:0;
    font-size:22px;
}

.connection{
    font-size:14px;
    font-weight:600;
}

.connected{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

.content{
    padding:30px;
}

.alert{
    background:#fee2e2;
    color:#b91c1c;
    padding:15px 18px;
    border-radius:10px;
    margin-bottom:20px;
    font-weight:600;
}

.page-title{
    margin-bottom:25px;
}

.page-title h2{
    margin:0 0 5px;
    font-size:30px;
}

.page-title p{
    margin:0;
    color:#6b7280;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
}

.card span{
    color:#6b7280;
    font-size:14px;
}

.card strong{
    display:block;
    margin-top:10px;
    font-size:30px;
}

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:24px;
    margin-bottom:22px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.panel-header h3{
    margin:0;
    font-size:21px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-weight:bold;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    margin-bottom:20px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:14px 10px;
    border-bottom:1px solid #e5e7eb;
}

th{
    background:#f9fafb;
    color:#6b7280;
    font-size:14px;
}

.empty{
    padding:30px;
    color:#6b7280;
    text-align:center;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow:auto;
    border-radius:16px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h3{
    margin:0;
}

.close{
    border:0;
    background:none;
    font-size:25px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

.product-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    background:white;
}

.product-image{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#f3f4f6;
}

.product-info{
    padding:14px;
}

.product-info h4{
    margin:0 0 6px;
}

.product-info p{
    margin:4px 0;
    color:#6b7280;
}

.price{
    color:#111827 !important;
    font-weight:bold;
    font-size:18px;
}

.sale-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.sale-product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:13px;
    margin-bottom:10px;
}

.sale-product-info strong{
    display:block;
}

.sale-product-info small{
    color:#6b7280;
}

.cart-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #e5e7eb;
}

.cart-total{
    font-size:25px;
    font-weight:bold;
    text-align:right;
    margin:20px 0;
}

.ticket{
    width:320px;
    background:white;
    padding:20px;
    margin:auto;
    font-family:Arial;
}

.ticket h2,
.ticket p{
    text-align:center;
    margin:5px 0;
}

.ticket-line{
    border-top:1px dashed #000;
    margin:12px 0;
}

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .sale-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .sidebar{
        width:75px;
        padding:15px 8px;
    }

    .logo h2,
    .logo p,
    .menu button span{
        display:none;
    }

    .logo-box{
        width:50px;
        height:50px;
        font-size:25px;
    }

    .main{
        margin-left:75px;
    }

    .content{
        padding:15px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

@media print{

    body *{
        visibility:hidden;
    }

    #ticketPrint,
    #ticketPrint *{
        visibility:visible;
    }

    #ticketPrint{
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

}

</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">

        <div class="logo-box">
            N
        </div>

        <h2>Nat.Nation</h2>
        <p>Sneakers</p>

    </div>

    <nav class="menu">

        <button onclick="ir('inicio')" id="menu-inicio">
            🏠 <span>Inicio</span>
        </button>

        <button onclick="ir('productos')" id="menu-productos">
            👟 <span>Productos</span>
        </button>

        <button onclick="ir('venta')" id="menu-venta">
            🛒 <span>Nueva venta</span>
        </button>

        <button onclick="ir('clientes')" id="menu-clientes">
            👤 <span>Clientes</span>
        </button>

        <button onclick="ir('reportes')" id="menu-reportes">
            📊 <span>Reportes</span>
        </button>

    </nav>

</aside>

<main class="main">

<header class="topbar">

    <h1>Nat.Nation Sneakers</h1>

    <div id="connection" class="connection">
        🟡 Conectando...
    </div>

</header>

<section class="content">

    <div id="alert"></div>

    <div id="app"></div>

</section>

</main>

<div class="modal" id="modalProducto">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Nuevo producto</h3>

            <button class="close" onclick="cerrarModal('modalProducto')">
                ×
            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Modelo</label>
                <input id="productoModelo">
            </div>

            <div class="form-group">
                <label>Talla</label>
                <input id="productoTalla">
            </div>

            <div class="form-group">
                <label>SKU</label>
                <input id="productoSku">
            </div>

            <div class="form-group">
                <label>Código de barras</label>
                <input id="productoCodigo">
            </div>

            <div class="form-group">
                <label>Precio</label>
                <input id="productoPrecio" type="number" step="0.01">
            </div>

            <div class="form-group">
                <label>Costo</label>
                <input id="productoCosto" type="number" step="0.01">
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input id="productoStock" type="number">
            </div>

            <div class="form-group">
                <label>Foto del producto</label>

            </div>

        </div>

        <br>

        <button class="btn btn-primary" onclick="guardarProducto()">

    </div>

</div>

<div class="modal" id="modalCliente">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Nuevo cliente</h3>

            <button class="close" onclick="cerrarModal('modalCliente')">
                ×
            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Nombre</label>
                <input id="clienteNombre">
            </div>

                <label>Teléfono</label>
                <input id="clienteTelefono">

            <div class="form-group full">
                <label>Código de tarjeta</label>
                <input id="clienteTarjeta">
            </div>

        </div>

        <br>

        <button class="btn btn-primary" onclick="guardarCliente()">
            Guardar cliente
        </button>

    </div>

</div>

<div id="ticketPrint" style="display:none;"></div>

<script>

const SUPABASE_URL = "https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY = "sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const NEGOCIO = {
    nombre:"Nat.Nation Sneakers",
    direccion:"Calle Juan Clímaco Ramírez SNVC, San Andrés, 55780 Jaltenco, Méx.",
    telefono:"5624570336"
};

let productos = [];
let clientes = [];
let ventas = [];
let carrito = [];

let paginaActual = "inicio";

function dinero(valor){

    return new Intl.NumberFormat(
        "es-MX",
        {
            style:"currency",
            currency:"MXN"
        }
    ).format(Number(valor || 0));

}

function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function mostrarError(mensaje){

    document.getElementById("alert").innerHTML =
        `<div class="alert">${escapeHTML(mensaje)}</div>`;

}

function limpiarError(){

    document.getElementById("alert").innerHTML = "";

}

function cerrarModal(id){

    document.getElementById(id).classList.remove("show");

}

function abrirModal(id){

    document.getElementById(id).classList.add("show");

}

function cambiarMenu(){

    document.querySelectorAll(".menu button")
        .forEach(b => b.classList.remove("active"));

    const boton =
        document.getElementById("menu-" + paginaActual);

    if(boton){
        boton.classList.add("active");
    }

}

function ir(pagina){

    paginaActual = pagina;

    cambiarMenu();

    limpiarError();

    if(pagina === "inicio"){
        mostrarInicio();
    }

    if(pagina === "productos"){
        mostrarProductos();
    }

    if(pagina === "venta"){
        mostrarVenta();
    }

    if(pagina === "clientes"){
        mostrarClientes();
    }

    if(pagina === "reportes"){
        mostrarReportes();
    }

}

async function cargarTodo(){

    try{

        const resultadoProductos =
            await supabaseClient
                .from("productos")
                .select("*")
                .order("created_at",{ascending:false});

        if(resultadoProductos.error){
            throw resultadoProductos.error;
        }

        productos = resultadoProductos.data || [];

        const resultadoClientes =
            await supabaseClient
                .from("clientes")
                .select("*")
                .order("created_at",{ascending:false});

        if(resultadoClientes.error){
            throw resultadoClientes.error;
        }

        clientes = resultadoClientes.data || [];

        const resultadoVentas =
            await supabaseClient
                .from("ventas")
                .select("*")
                .order("fecha",{ascending:false});

        if(resultadoVentas.error){
            throw resultadoVentas.error;
        }

        ventas = resultadoVentas.data || [];

        document.getElementById("connection").innerHTML =
            "🟢 Conectado";

        document.getElementById("connection").className =
            "connection connected";

        ir(paginaActual);

    }catch(error){

        console.error(error);

        document.getElementById("connection").innerHTML =
            "🔴 Error de conexión";

        document.getElementById("connection").className =
            "connection error";

        document.getElementById("alert").innerHTML =
            `<div class="alert">
                Supabase respondió con un error:
                ${escapeHTML(error.message || error)}
            </div>`;

        ir(paginaActual);

    }

}

function mostrarInicio(){

    const hoy = new Date().toDateString();

    const ventasHoy =
        ventas.filter(v =>
            new Date(v.fecha).toDateString() === hoy
        );

    const totalHoy =
        ventasHoy.reduce(
            (s,v)=>s+Number(v.total || 0),
            0
        );

    const stock =
        productos.reduce(
            (s,p)=>s+Number(p.stock || 0),
            0
        );

    document.getElementById("app").innerHTML = `

        <div class="page-title">

            <h2>Inicio</h2>

            <p>Bienvenida a tu punto de venta.</p>

        </div>

        <div class="cards">

            <div class="card">
                <span>Productos</span>
                <strong>${productos.length}</strong>
            </div>

            <div class="card">
                <span>Stock total</span>
                <strong>${stock}</strong>
            </div>

            <div class="card">
                <span>Clientes</span>
                <strong>${clientes.length}</strong>
            </div>

            <div class="card">
                <span>Ventas de hoy</span>
                <strong>${dinero(totalHoy)}</strong>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">

                <h3>Últimas ventas</h3>

                <button
                    class="btn btn-primary"
                    onclick="ir('venta')">
                    + Nueva venta
                </button>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Folio</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Pago</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${
                            ventas.slice(0,10).map(v => `
                                <tr>
                                    <td>${escapeHTML(v.folio)}</td>
                                    <td>${new Date(v.fecha).toLocaleString("es-MX")}</td>
                                    <td>${dinero(v.total)}</td>
                                    <td>${escapeHTML(v.metodo_pago)}</td>
                                </tr>
                            `).join("")
                        }

                    </tbody>

                </table>

            </div>

        </div>
    `;

}

function mostrarProductos(){

    document.getElementById("app").innerHTML = `

        <div class="page-title">

            <h2>Productos</h2>

            <p>Administra tu inventario.</p>

        </div>

        <div class="panel">

            <div class="panel-header">

                <input
                    class="search"
                    style="margin:0"
                    id="buscarProducto"
                    placeholder="Buscar producto, SKU o código..."
                    oninput="filtrarProductos()">

                <button
                    class="btn btn-primary"
                    onclick="abrirModal('modalProducto')">
                    + Nuevo producto
                </button>

            </div>

            <div id="listaProductos"></div>

        </div>

    `;

    renderProductos(productos);

}

function renderProductos(lista){

    const contenedor =
        document.getElementById("listaProductos");

    if(!lista.length){

        contenedor.innerHTML =
            `<div class="empty">No hay productos registrados.</div>`;

        return;

    }

    contenedor.innerHTML = `

        <div class="product-grid">

            ${lista.map(p => `

                <div class="product-card">

                    ${
                        p.imagen_url
                        ?
                        `<img class="product-image"
                              src="${escapeHTML(p.imagen_url)}">`
                        :
                        `<div class="product-image"></div>`
                    }

                    <div class="product-info">

                        <h4>${escapeHTML(p.modelo)}</h4>

                        <p>Talla: ${escapeHTML(p.talla)}</p>

                        <p>Stock: ${p.stock}</p>

                        <p class="price">${dinero(p.precio)}</p>

                    </div>

                </div>

            `).join("")}

        </div>

    `;

}

function filtrarProductos(){

    const texto =
        document.getElementById("buscarProducto")
            .value
            .toLowerCase();

    const lista =
        productos.filter(p =>
            String(p.modelo || "").toLowerCase().includes(texto) ||
            String(p.sku || "").toLowerCase().includes(texto) ||
            String(p.codigo_barras || "").toLowerCase().includes(texto)
        );

    renderProductos(lista);

}

async function guardarProducto(){

    try{

        const modelo =
            document.getElementById("productoModelo").value.trim();

        const talla =
            document.getElementById("productoTalla").value.trim();

        const sku =
            document.getElementById("productoSku").value.trim();

        const codigo =
            document.getElementById("productoCodigo").value.trim();

        const precio =
            Number(document.getElementById("productoPrecio").value || 0);

        const costo =
            Number(document.getElementById("productoCosto").value || 0);

        const stock =
            Number(document.getElementById("productoStock").value || 0);

        const archivo =
            document.getElementById("productoImagen").files[0];

        if(!modelo || !talla){

            alert("Modelo y talla son obligatorios.");

            return;

        }

        let imagen_url = null;

        if(archivo){

            const extension =
                archivo.name.split(".").pop();

            const nombreArchivo =
                `${crypto.randomUUID()}.${extension}`;

            const subida =
                await supabaseClient.storage
                    .from("pos")
                    .upload(
                        `productos/${nombreArchivo}`,
                        archivo,
                        {
                            upsert:false,
                            contentType:archivo.type
                        }
                    );

            if(subida.error){
                throw subida.error;
            }

            const url =
                supabaseClient.storage
                    .from("pos")
                    .getPublicUrl(
                        `productos/${nombreArchivo}`
                    );

            imagen_url = url.data.publicUrl;

        }

        const resultado =
            await supabaseClient
                .from("productos")
                .insert({
                    modelo,
                    talla,
                    sku:sku || null,
                    codigo_barras:codigo || null,
                    precio,
                    costo,
                    stock,
                    imagen_url
                })
                .select()
                .single();

        if(resultado.error){
            throw resultado.error;
        }

        productos.unshift(resultado.data);

        cerrarModal("modalProducto");

        document.getElementById("productoModelo").value = "";
        document.getElementById("productoTalla").value = "";
        document.getElementById("productoSku").value = "";
        document.getElementById("productoCodigo").value = "";
        document.getElementById("productoPrecio").value = "";
        document.getElementById("productoCosto").value = "";
        document.getElementById("productoStock").value = "";
        document.getElementById("productoImagen").value = "";

        mostrarProductos();

    }catch(error){

        console.error(error);

        alert(
            "No se pudo guardar el producto:\n\n" +
            (error.message || error)
        );

    }

}

function mostrarClientes(){

    document.getElementById("app").innerHTML = `

        <div class="page-title">

            <h2>Clientes</h2>

            <p>Clientes y puntos de lealtad.</p>

        </div>

        <div class="panel">

            <div class="panel-header">

                <h3>Clientes</h3>

                <button
                    class="btn btn-primary"
                    onclick="abrirModal('modalCliente')">
                    + Nuevo cliente
                </button>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Tarjeta</th>
                            <th>Puntos</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${
                            clientes.map(c => `

                                <tr>

                                    <td>${escapeHTML(c.nombre)}</td>

                                    <td>${escapeHTML(c.telefono || "")}</td>

                                    <td>${escapeHTML(c.codigo_tarjeta || "")}</td>

                                    <td>${c.puntos}</td>

                                </tr>

                            `).join("")
                        }

                    </tbody>

                </table>

            </div>

        </div>

    `;

}

async function guardarCliente(){

    try{

        const nombre =
            document.getElementById("clienteNombre").value.trim();

        const telefono =
            document.getElementById("clienteTelefono").value.trim();

        const tarjeta =
            document.getElementById("clienteTarjeta").value.trim();

        if(!nombre){

            alert("Escribe el nombre del cliente.");

            return;

        }

        const resultado =
            await supabaseClient
                .from("clientes")
                .insert({
                    nombre,
                    telefono:telefono || null,
                    codigo_tarjeta:tarjeta || null
                })
                .select()
                .single();

        if(resultado.error){
            throw resultado.error;
        }

        clientes.unshift(resultado.data);

        cerrarModal("modalCliente");

        document.getElementById("clienteNombre").value = "";
        document.getElementById("clienteTelefono").value = "";
        document.getElementById("clienteTarjeta").value = "";

        mostrarClientes();

    }catch(error){

        alert(
            "No se pudo guardar el cliente:\n\n" +
            (error.message || error)
        );

    }

}

function mostrarVenta(){

    document.getElementById("app").innerHTML = `

        <div class="page-title">

            <h2>Nueva venta</h2>

            <p>Selecciona productos y cobra al cliente.</p>

        </div>

        <div class="sale-layout">

            <div class="panel">

                <h3>Productos</h3>

                <input
                    class="search"
                    id="buscarVenta"
                    placeholder="Buscar producto..."
                    oninput="filtrarVenta()">

                <div id="productosVenta"></div>

            </div>

            <div class="panel">

                <h3>Carrito</h3>

                <div id="carrito"></div>

                <div class="cart-total" id="totalVenta">
                    $0.00
                </div>

                <select
                    id="metodoPago"
                    style="width:100%;padding:12px;margin-bottom:10px">

                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Tarjeta">Tarjeta</option>

                </select>

                <input
                    id="efectivoRecibido"
                    type="number"
                    placeholder="Efectivo recibido"
                    style="width:100%;padding:12px;margin-bottom:10px">

                <select
                    id="clienteVenta"
                    style="width:100%;padding:12px;margin-bottom:15px">

                    <option value="">
                        Venta sin cliente
                    </option>

                    ${
                        clientes.map(c => `
                            <option value="${c.id}">
                                ${escapeHTML(c.nombre)}
                            </option>
                        `).join("")
                    }

                </select>

                    style="width:100%"
                    onclick="realizarVenta()">
                    Cobrar
                </button>

            </div>

        </div>

    `;

    renderProductosVenta(productos);

}

function filtrarVenta(){

    const texto =
        document.getElementById("buscarVenta")
            .value
            .toLowerCase();

    renderProductosVenta(
        productos.filter(p =>
            String(p.modelo || "")
                .toLowerCase()
                .includes(texto) ||
            String(p.sku || "")
                .toLowerCase()
                .includes(texto)
        )
    );

}

function renderProductosVenta(lista){

    const contenedor =
        document.getElementById("productosVenta");

    if(!lista.length){

        contenedor.innerHTML =
            `<div class="empty">No hay productos.</div>`;

        return;

    }

    contenedor.innerHTML =
        lista.map(p => `

            <div class="sale-product">

                <div class="sale-product-info">

                    <strong>
                        ${escapeHTML(p.modelo)}
                    </strong>

                    <small>
                        Talla ${escapeHTML(p.talla)}
                        · Stock ${p.stock}
                        · ${dinero(p.precio)}
                    </small>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="agregarCarrito('${p.id}')"
                    ${p.stock <= 0 ? "disabled" : ""}>
                    +
                </button>

            </div>

        `).join("");

}

function agregarCarrito(id){

    const producto =
        productos.find(p => p.id === id);

    if(!producto){
        return;
    }

    const existente =
        carrito.find(x => x.id === id);

    if(existente){

        if(existente.cantidad >= producto.stock){

            alert("No hay más stock disponible.");

            return;

        }

        existente.cantidad++;

    }else{

        carrito.push({
            id:producto.id,
            modelo:producto.modelo,
            talla:producto.talla,
            precio:Number(producto.precio),
            cantidad:1
        });

    }

    renderCarrito();

}

function quitarCarrito(id){

    const item =
        carrito.find(x => x.id === id);

    if(!item){
        return;
    }

    item.cantidad--;

    if(item.cantidad <= 0){

        carrito =
            carrito.filter(x => x.id !== id);

    }

    renderCarrito();

}

function renderCarrito(){

    const contenedor =
        document.getElementById("carrito");

    if(!contenedor){
        return;
    }

    if(!carrito.length){

        contenedor.innerHTML =
            `<div class="empty">Carrito vacío.</div>`;

        document.getElementById("totalVenta").textContent =
            "$0.00";

        return;

    }

    let total = 0;

    contenedor.innerHTML =
        carrito.map(item => {

            const subtotal =
                item.precio * item.cantidad;

            total += subtotal;

            return `

                <div class="cart-row">

                    <div>

                        <strong>
                            ${escapeHTML(item.modelo)}
                        </strong>

                        <br>

                        <small>
                            Talla ${escapeHTML(item.talla)}
                            × ${item.cantidad}
                        </small>

                    </div>

                    <div>

                        ${dinero(subtotal)}

                        <button
                            class="btn btn-secondary"
                            onclick="quitarCarrito('${item.id}')">
                            −
                        </button>

                    </div>

                </div>

            `;

        }).join("");

    document.getElementById("totalVenta").textContent =
        dinero(total);

}

async function realizarVenta(){

    try{

        if(!carrito.length){

            alert("Agrega productos al carrito.");

            return;

        }

        const metodo =
            document.getElementById("metodoPago").value;

        const clienteId =
            document.getElementById("clienteVenta").value || null;

        const efectivo =
            Number(
                document.getElementById("efectivoRecibido").value || 0
            );

        const total =
            carrito.reduce(
                (s,item)=>
                    s + item.precio * item.cantidad,
                0
            );

        if(metodo === "Efectivo" && efectivo < total){

            alert(
                "El efectivo recibido es menor al total."
            );

            return;

        }

        for(const item of carrito){

            const producto =
                productos.find(p => p.id === item.id);

            if(!producto || producto.stock < item.cantidad){

                alert(
                    `Stock insuficiente para ${item.modelo}.`
                );

                return;

            }

        }

        const numero =
            String(ventas.length + 1).padStart(6,"0");

        const folio =
            "NN-" + numero;

        const cambio =
            metodo === "Efectivo"
            ? efectivo - total
            : 0;

        const puntos =
            Math.floor(total / 10);

        const ventaResultado =
            await supabaseClient
                .from("ventas")
                .insert({
                    folio,
                    total,
                    metodo_pago:metodo,
                    cliente_id:clienteId,
                    efectivo_recibido:
                        metodo === "Efectivo"
                        ? efectivo
                        : 0,
                    cambio,
                    puntos_ganados:puntos
                })
                .select()
                .single();

        if(ventaResultado.error){
            throw ventaResultado.error;
        }

        const venta =
            ventaResultado.data;

        const detalles =
            carrito.map(item => ({

                venta_id:venta.id,
                producto_id:item.id,
                producto_nombre:item.modelo,
                talla:item.talla,
                cantidad:item.cantidad,
                precio_unitario:item.precio,
                subtotal:item.precio * item.cantidad

            }));

        const detallesResultado =
            await supabaseClient
                .from("venta_detalles")
                .insert(detalles);

        if(detallesResultado.error){
            throw detallesResultado.error;
        }

        for(const item of carrito){

            const producto =
                productos.find(p => p.id === item.id);

            const nuevoStock =
                producto.stock - item.cantidad;

            const actualizacion =
                await supabaseClient
                    .from("productos")
                    .update({
                        stock:nuevoStock
                    })
                    .eq("id",item.id);

            if(actualizacion.error){
                throw actualizacion.error;
            }

            producto.stock =
                nuevoStock;

        }

        if(clienteId){

            const cliente =
                clientes.find(c => c.id === clienteId);

            if(cliente){

                const nuevosPuntos =
                    Number(cliente.puntos || 0) + puntos;

                const actualizacion =
                    await supabaseClient
                        .from("clientes")
                        .update({
                            puntos:nuevosPuntos
                        })
                        .eq("id",clienteId);

                if(actualizacion.error){
                    throw actualizacion.error;
                }

                cliente.puntos =
                    nuevosPuntos;

            }

        }

        ventas.unshift(venta);

        imprimirTicket(
            venta,
            cambio
        );

        carrito = [];

        mostrarVenta();

    }catch(error){

        console.error(error);

        alert(
            "No se pudo completar la venta:\n\n" +
            (error.message || error)
        );

    }

}

function imprimirTicket(venta,cambio){

    const ticket =
        document.getElementById("ticketPrint");

    const items =
        carrito.map(item => `

            <div>

                ${escapeHTML(item.modelo)}
                T${escapeHTML(item.talla)}
                ×${item.cantidad}

                <span style="float:right">
                    ${dinero(item.precio * item.cantidad)}
                </span>

            </div>

        `).join("");

    ticket.innerHTML = `

        <div class="ticket">

            <h2>${NEGOCIO.nombre}</h2>

            <p>${NEGOCIO.direccion}</p>

            <p>Tel. ${NEGOCIO.telefono}</p>

            <div class="ticket-line"></div>

            <p>
                Folio: ${escapeHTML(venta.folio)}
            </p>

            <p>
                ${new Date(venta.fecha).toLocaleString("es-MX")}
            </p>

            <div class="ticket-line"></div>

            ${items}

            <div class="ticket-line"></div>

            <h2>
                TOTAL ${dinero(venta.total)}
            </h2>

            <p>
                Pago: ${escapeHTML(venta.metodo_pago)}
            </p>

            ${
                venta.metodo_pago === "Efectivo"
                ?
                `
                    <p>
                        Recibido: ${dinero(venta.efectivo_recibido)}
                    </p>

                    <p>
                        Cambio: ${dinero(cambio)}
                    </p>
                `
                :
                ""
            }

            <div class="ticket-line"></div>

            <p>Gracias por tu compra.</p>

        </div>

    `;

    ticket.style.display = "block";

    window.print();

    setTimeout(() => {

        ticket.style.display = "none";

    },1000);

}
