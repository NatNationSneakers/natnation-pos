<script>


/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";


/* =====================================================
   VARIABLES
===================================================== */

let inventario = [];

let clientes = [];

let ventas = [];

let carrito = [];

let paginaActual = "inicio";

let configuracion = {
  logo:""
};


/* =====================================================
   API SUPABASE DIRECTA
===================================================== */

async function supabaseFetch(
  endpoint,
  options={}
){

  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    endpoint;


  const headers = {

    "apikey":SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json",

    ...(options.headers || {})

  };


  const respuesta =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  const texto =
    await respuesta.text();


  let data = null;


  if(texto){

    try{

      data =
        JSON.parse(texto);

    }catch{

      data = texto;

    }

  }


  if(!respuesta.ok){

    let mensaje =
      "Error de Supabase";


    if(data){

      if(typeof data === "string"){
        mensaje = data;
      }else{
        mensaje =
          data.message ||
          data.error_description ||
          data.hint ||
          data.details ||
          JSON.stringify(data);
      }

    }


    throw new Error(
      mensaje
    );

  }


  return data;
}


/* =====================================================
   STORAGE SUPABASE
===================================================== */

async function storageUpload(
  path,
  file,
  upsert=false
){

  const respuesta =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/pos/" +
      path,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            file.type || "application/octet-stream",
          "x-upsert":
            upsert ? "true" : "false"
        },

        body:file
      }
    );


  const texto =
    await respuesta.text();


  if(!respuesta.ok){

    throw new Error(
      texto ||
      "No se pudo subir el archivo."
    );

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/pos/" +
    path
  );
}


/* =====================================================
   UTILIDADES
===================================================== */

function dinero(numero){

  return Number(
    numero || 0
  ).toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function esc(valor){

  return String(
    valor ?? ""
  )
  .replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}


function errorMsg(error){

  console.error(
    error
  );

  return (
    error?.message ||
    "Ocurrió un error."
  );

}


/* =====================================================
   ESTADO DE CONEXIÓN
===================================================== */

function estadoConexion(
  texto,
  tipo
){

  const elemento =
    document.getElementById(
      "connectionStatus"
    );


  if(!elemento){
    return;
  }


  elemento.textContent =
    texto;


  if(tipo === "ok"){

    elemento.style.background =
      "#e8f7ed";

    elemento.style.color =
      "#166534";

  }


  if(tipo === "error"){

    elemento.style.background =
      "#fee2e2";

    elemento.style.color =
      "#991b1b";

  }


  if(tipo === "wait"){

    elemento.style.background =
      "#fff3cd";

    elemento.style.color =
      "#92400e";

  }

}


/* =====================================================
   PROBAR CONEXIÓN
===================================================== */

async function probarConexion(){

  estadoConexion(
    "🟡 Conectando...",
    "wait"
  );


  try{

    await supabaseFetch(
      "productos?select=id&limit=1"
    );


    estadoConexion(
      "🟢 Conectado",
      "ok"
    );


    return true;


  }catch(error){

    console.error(
      "Supabase:",
      error
    );


    estadoConexion(
      "🔴 Sin conexión",
      "error"
    );


    mostrarErrorConexion(
      errorMsg(error)
    );


    return false;

  }

}


/* =====================================================
   ERROR DE CONEXIÓN
===================================================== */

function mostrarErrorConexion(
  mensaje
){

  const contenido =
    document.getElementById(
      "appContent"
    );


  if(!contenido){
    return;
  }


  contenido.insertAdjacentHTML(
    "afterbegin",

    `

    <div
      id="conexionAviso"
      class="notice notice-error"
    >

      <strong>
        ⚠️ No se pudo conectar con Supabase
      </strong>

      <div
        style="margin-top:7px"
      >
        ${esc(mensaje)}
      </div>

      <button
        class="btn btn-dark"
        style="margin-top:10px"
        onclick="reintentarConexion()"
      >
        🔄 Reintentar conexión
      </button>

    </div>

    `
  );

}


async function reintentarConexion(){

  const aviso =
    document.getElementById(
      "conexionAviso"
    );


  if(aviso){
    aviso.remove();
  }


  const conectado =
    await probarConexion();


  if(conectado){

    await cargarDatos();

    renderPagina();

  }

}


/* =====================================================
   CARGAR DATOS
===================================================== */

async function cargarDatos(){

  const productos =
    await supabaseFetch(
      "productos?select=*&activo=eq.true&order=modelo.asc"
    );


  const clientesData =
    await supabaseFetch(
      "clientes?select=*&order=nombre.asc"
    );


  const ventasData =
    await supabaseFetch(
      "ventas?select=*&order=fecha.desc&limit=100"
    );


  inventario =
    Array.isArray(productos)
    ? productos
    : [];


  clientes =
    Array.isArray(clientesData)
    ? clientesData
    : [];


  ventas =
    Array.isArray(ventasData)
    ? ventasData
    : [];


  cargarLogo();


  estadoConexion(
    "🟢 Conectado",
    "ok"
  );

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

function ir(pagina){

  paginaActual =
    pagina;


  const titulos = {

    inicio:"Inicio",

    venta:"Nueva venta",

    productos:"Productos",

    clientes:"Clientes",

    puntos:"Programa de puntos",

    reportes:"Reportes",

    config:"Configuración"

  };


  document.getElementById(
    "pageTitle"
  ).textContent =
    titulos[pagina];


  document
    .querySelectorAll(
      ".menu button"
    )
    .forEach(
      boton =>
        boton.classList.remove(
          "active"
        )
    );


  const mapa = {

    inicio:"navInicio",

    venta:"navVenta",

    productos:"navProductos",

    clientes:"navClientes",

    puntos:"navPuntos",

    reportes:"navReportes",

    config:"navConfig"

  };


  const boton =
    document.getElementById(
      mapa[pagina]
    );


  if(boton){

    boton.classList.add(
      "active"
    );

  }


  renderPagina();

}


/* =====================================================
   RENDER PAGINA
===================================================== */

function renderPagina(){

  if(
    paginaActual === "inicio"
  ){

    renderInicio();

  }


  if(
    paginaActual === "venta"
  ){

    renderVenta();

/* =====================================================
   SUBIR FOTO PRODUCTO
===================================================== */

async function subirFotoProducto(
  archivo
){

  const extension =
    (
      archivo.name
      .split(".")
      .pop() ||
      "jpg"
    )
    .toLowerCase()
    .replace(
      /[^a-z0-9]/g,
      ""
    );


  const ruta =
    "productos/" +
    crypto.randomUUID() +
    "." +
    extension;


  return await storageUpload(
    ruta,
    archivo,
    false
  );

}


/* =====================================================
   GUARDAR PRODUCTO
===================================================== */

async function guardarProducto(
  indice
){

  const modelo =
    document.getElementById(
      "prodModelo"
    ).value.trim();


  const sku =
    document.getElementById(
      "prodSKU"
    ).value.trim();


  const talla =
    document.getElementById(
      "prodTalla"
    ).value.trim();


  const color =
    document.getElementById(
      "prodColor"
    ).value.trim();


  const precio =
    Number(
      document.getElementById(
        "prodPrecio"
      ).value
    );


  const costo =
    Number(
      document.getElementById(
        "prodCosto"
      ).value || 0
    );


  const stock =
    Number(
      document.getElementById(
        "prodStock"
      ).value
    );


  let photo_url =
    document.getElementById(
      "prodFoto"
    ).value.trim() ||
    null;


  const archivo =
    document.getElementById(
      "prodFotoArchivo"
    )?.files?.[0];


  if(
    !modelo ||
    !talla ||
    !Number.isFinite(precio) ||
    precio < 0 ||
    !Number.isInteger(stock) ||
    stock < 0
  ){

    alert(
      "Completa modelo, talla, precio y existencia."
    );

    return;

  }


  try{

    if(archivo){

      photo_url =
        await subirFotoProducto(
          archivo
        );

    }


    const datos = {

      modelo:modelo,

      sku:sku || null,

      talla:talla,

      color:color || null,

      precio:precio,

      costo:costo,

      stock:stock,

      photo_url:photo_url

    };


    if(indice === null){

      await supabaseFetch(
        "productos",
        {
          method:"POST",
          headers:{
            "Prefer":
              "return=representation"
          },
          body:
            JSON.stringify(
              datos
            )
        }
      );

    }else{

      await supabaseFetch(
        "productos?id=eq." +
        encodeURIComponent(
          inventario[indice].id
        ),
        {
          method:"PATCH",
          headers:{
            "Prefer":
              "return=representation"
          },
          body:
            JSON.stringify(
              datos
            )
        }
      );

    }


    cerrarModal();


    await cargarDatos();


    ir("productos");


  }catch(error){

    alert(
      "No se pudo guardar el producto:\n\n" +
      errorMsg(error)
    );

  }

}

/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function agregarCarrito(
  indice
){

  const producto =
    inventario[indice];


  if(!producto){
    return;
  }


  if(
    Number(
      producto.stock || 0
    ) <= 0
  ){

    alert(
      "Este producto no tiene existencia."
    );

    return;
  }


  const existente =
    carrito.find(
      item =>
        item.id ===
        producto.id
    );


  if(existente){

    if(
      existente.qty <
      Number(
        producto.stock
      )
    ){

      existente.qty++;

    }else{

      alert(
        "No hay más existencia."
      );

    }

  }else{

    carrito.push({

      id:producto.id,

      qty:1

    });

  }


  pintarCarrito();

}


/* =====================================================
   CANTIDAD CARRITO
===================================================== */

function cambiarCantidad(
  indice,
  cambio
){

  const item =
    carrito[indice];


  if(!item){
    return;
  }


  const producto =
    inventario.find(
      p =>
        p.id ===
        item.id
    );


  if(!producto){
    return;
  }


  item.qty +=
    cambio;


  if(
    item.qty <= 0
  ){

    carrito.splice(
      indice,
      1
    );

  }


  if(
    item.qty >
    Number(
      producto.stock
    )
  ){

    item.qty =
      Number(
        producto.stock
      );

  }


  pintarCarrito();

}

  carrito.splice(

  pintarCarrito();

          p =>
            p.id ===
            item.id
        );


      return total +
        (
          Number(
            producto?.precio || 0
          ) *
          item.qty
        );

    },
    0
  );

}

===================================================== */

function actualizarPago(){

  const selector =
    document.getElementById(
      "pagoVenta"
    );


  if(!selector){
    return;
  }


  const box =
    document.getElementById(
      "efectivoBox"
    );


  if(
    selector.value ===
    "Efectivo"
  ){

    box.style.display =
      "block";


    const recibido =
      Number(
        document.getElementById(
          "efectivoRecibido"
        )?.value || 0
      );


    const cambio =
      Math.max(
        0,
        recibido -
        totalCarrito()
      );


    document.getElementById(
      "cambioVenta"
    ).textContent =
      dinero(cambio);

  }else{

    box.style.display =
      "none";

  }

}


/* =====================================================
   FINALIZAR VENTA
===================================================== */

async function finalizarVenta(){

  if(!carrito.length){

    alert(
      "Agrega productos al carrito."
    );

    return;
  }


  const total =
    totalCarrito();


  const pago =
    document.getElementById(
      "pagoVenta"
    ).value;


  const recibido =
    Number(
      document.getElementById(
        "efectivoRecibido"
      )?.value || 0
    );


  if(
    pago === "Efectivo" &&
    recibido < total
  ){

    alert(
      "El efectivo recibido es menor que el total."
    );

    return;
  }


  const cliente =
    document.getElementById(
      "clienteVenta"
    ).value ||
    null;


  const items =
    carrito.map(
      item => ({

        producto_id:
          item.id,

        cantidad:
          item.qty

      })
    );


  try{

    const resultado =
      await supabaseFetch(
        "rpc/registrar_venta",
        {
          method:"POST",
          body:
            JSON.stringify({

              p_cliente_id:
                cliente,

              p_pago:
                pago,

              p_efectivo:
                pago === "Efectivo"
                ?
                recibido
                :
                0,

              p_items:
                items

            })
        }
      );


    let ventaId =
      null;

    let folio =
      null;


    if(
      resultado &&
      !Array.isArray(resultado)
    ){

      ventaId =
        resultado.venta_id;

      folio =
        resultado.folio;

    }


    if(
      Array.isArray(resultado) &&
      resultado.length
    ){

      ventaId =
        resultado[0].venta_id;

      folio =
        resultado[0].folio;

    }


    let venta = {

      folio:
        folio ||
        "VENTA",

      fecha:
        new Date().toISOString(),

      total:
        total,

      pago:
        pago,

      efectivo_recibido:
        recibido,

      cambio:
        Math.max(
          0,
          recibido-total
        ),

      puntos:
        0,

      clientes:
        cliente
        ?
        {
          nombre:
            clientes.find(
              c =>
                c.id ===
                cliente
            )?.nombre || ""
        }
        :
        null

    };


    if(ventaId){

      try{

        const ventasEncontradas =
          await supabaseFetch(
            "ventas?id=eq." +
            encodeURIComponent(
              ventaId
            ) +
            "&select=*"
          );


        if(
          ventasEncontradas &&
          ventasEncontradas.length
        ){

          venta =
            {
              ...venta,
              ...ventasEncontradas[0],
              clientes:
                cliente
                ?
                {
                  nombre:
                    clientes.find(
                      c =>
                        c.id ===
                        cliente
                    )?.nombre || ""
                }
                :
                null
            };

        }

      }catch(
        error
      ){

        console.warn(
          "No se pudo consultar el detalle de la venta",
          error
        );

      }

    }


    imprimirTicket(
      venta
    );


    carrito = [];


    await cargarDatos();


    ir("venta");


    alert(
      "✅ Venta registrada correctamente."
    );


  }catch(error){

    alert(
      "No se pudo registrar la venta:\n\n" +
      errorMsg(error)
    );

  }

}

async function guardarCliente(

){

      ).value.trim(),

    telefono:
      document.getElementById(
        "cliTelefono"
      ).value.trim(),

      ).value.trim() ||
      null

  };


  if(!datos.nombre){

    alert(
      "Escribe el nombre del cliente."
    );

    return;
  }


  try{

    if(indice === null){

      await supabaseFetch(
        "clientes",
        {
          method:"POST",
          headers:{
            "Prefer":
              "return=representation"
          },
          body:
            JSON.stringify(
              datos
            )
        }
      );

    }else{

      await supabaseFetch(
        "clientes?id=eq." +
        encodeURIComponent(
          clientes[indice].id
        ),
        {
          method:"PATCH",
          headers:{
            "Prefer":
              "return=representation"
          },
          body:
            JSON.stringify(
              datos
            )
        }
      );

    }


    cerrarModal();
