<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nat.Nation Sneakers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f7;
    color:#222;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   LATERAL
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:#111;
    color:white;
    padding:25px 16px;
    z-index:100;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-title{
    font-size:23px;
    font-weight:800;
}

.logo-sub{
    color:#f58ab4;
    font-size:12px;
    margin-top:5px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    border:0;
    width:100%;
    padding:14px;
    border-radius:10px;
    background:#202020;
    color:white;
    text-align:left;
}

.menu button:hover{
    background:#f58ab4;
    color:#111;
}

.sidebar-bottom{
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
}

.sidebar-bottom button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#292929;
    color:white;
}

/* =========================
   PRINCIPAL
========================= */

.main{
    margin-left:245px;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.brand{
    font-size:20px;
    font-weight:800;
}

.status{
    padding:8px 13px;
    border-radius:20px;
    background:#fff3cd;
    color:#856404;
    font-size:13px;
}

.content{
    padding:28px;
}

.page-title{
    font-size:27px;
    font-weight:800;
    margin-bottom:20px;
}

/* =========================
   TARJETAS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:22px;
}

.card{
    background:white;
    border:1px solid #e1e1e1;
    border-radius:15px;
    padding:20px;
}

.card-title{
    color:#777;
    font-size:13px;
}

.card-value{
    font-size:27px;
    font-weight:800;
    margin-top:8px;
}

/* =========================
   BOTONES
========================= */

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:white;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    margin-bottom:18px;
}

.btn{
    border:0;
    padding:11px 16px;
    border-radius:9px;
    font-weight:700;
}

.pink{
    background:#f58ab4;
    color:#111;
}

.dark{
    background:#111;
    color:white;
}

.green{
    background:#16a34a;
    color:white;
}

.red{
    background:#dc2626;
    color:white;
}

.blue{
    background:#2563eb;
    color:white;
}

.gray{
    background:#e5e7eb;
    color:#222;
}

/* =========================
   TABLAS
========================= */

.table-wrap{
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:13px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#fafafa;
    font-size:13px;
}

td{
    font-size:14px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    position:relative;
    background:white;
    width:min(850px,95vw);
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
}

.close{
    position:absolute;
    top:12px;
    right:18px;
    border:0;
    background:none;
    font-size:30px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form input,
.form select{
    padding:11px;
    border:1px solid #ccc;
    border-radius:9px;
}

.form-actions{
    grid-column:1/-1;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* =========================
   VENTA
========================= */

.sale-grid{
    display:grid;
    grid-template-columns:1fr 390px;
    gap:20px;
}

.sale-box{
    background:white;
    border:1px solid #ddd;
    border-radius:15px;
    padding:20px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:12px;
}

.product-card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
    background:white;
}

.product-card:hover{
    border-color:#f58ab4;
}

.product-name{
    font-weight:800;
}

.product-size{
    color:#777;
    margin-top:5px;
}

.product-price{
    font-size:19px;
    font-weight:800;
    margin:10px 0;
}

.stock{
    color:#15803d;
    font-size:12px;
}

.cart-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:25px;
    font-weight:800;
    margin-top:20px;
}

.empty{
    text-align:center;
    color:#777;
    padding:35px;
}

/* =========================
   TICKET
========================= */

#printArea{
    display:none;
}

.ticket{
    width:80mm;
    margin:auto;
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
}

.ticket-header{
    text-align:center;
}

.ticket-logo{
    font-size:20px;
    font-weight:900;
}

.ticket-title{
    font-size:13px;
    margin-top:3px;
}

.ticket-address{
    font-size:10px;
    margin-top:8px;
}

.ticket hr{
    border:0;
    border-top:1px dashed #555;
    margin:10px 0;
}

.ticket-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin:5px 0;
}

.ticket-total{
    font-size:19px;
    font-weight:900;
}

.ticket-center{
    text-align:center;
}

.ticket-small{
    font-size:10px;
}

@media print{

    body > *{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:80mm;
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .sidebar{
        width:190px;
    }

    .main{
        margin-left:190px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .sale-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){

    .sidebar{
        position:static;
        width:100%;
        min-height:auto;
    }

    .main{
        margin-left:0;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .form-actions{
        grid-column:auto;
    }

    .sidebar-bottom{
        position:static;
        margin-top:20px;
    }
}

</style>
</head>

<!-- =========================
     TICKET

<div id="printArea"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let productos = [];
let clientes = [];
let ventas = [];
let carrito = [];


/* =========================================================
   DATOS DEL NEGOCIO
========================================================= */

const NEGOCIO = {

    nombre:"Nat.Nation Sneakers",

    direccion:
    "Calle Juan Clímaco Ramírez SNVC, San Andrés, 55780 Jaltenco, Méx.",

    telefono:
    "5624570336"

};


/* =========================================================
   UTILIDADES
========================================================= */

function dinero(valor){

    return Number(valor || 0)
        .toLocaleString(
            "es-MX",
            {
                style:"currency",
                currency:"MXN"
            }
        );

}


function esc(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function abrirModal(html){

    document
        .getElementById("modalContenido")
        .innerHTML = html;

    document
        .getElementById("modal")
        .classList.add("show");

}


function cerrarModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}


function mostrarError(error){

    console.error(error);

    alert(
        "Ocurrió un error:\n\n" +
        (error?.message || error)
    );

}


/* =========================================================
   FOLIO
   ========================================================= */

/*
   Los folios son:

   000001
   000002
   000003
   ...

   Se calculan tomando la cantidad de ventas
   existentes en Supabase.
*/

async function obtenerSiguienteFolio(){

    const {count,error} =
        await supabaseClient
            .from("ventas")
            .select("id",{count:"exact",head:true});

    if(error)
        throw error;

    const numero =
        Number(count || 0) + 1;

    return String(numero)
        .padStart(6,"0");

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarTodo(){

    try{

        const productosResult =
            await supabaseClient
                .from("productos")
                .select("*")
                .eq("activo",true)
                .order("modelo");

        if(productosResult.error)
            throw productosResult.error;

        productos =
            productosResult.data || [];


        const clientesResult =
            await supabaseClient
                .from("clientes")
                .select("*")
                .order("nombre");

        if(clientesResult.error)
            throw clientesResult.error;

        clientes =
            clientesResult.data || [];


        const ventasResult =
            await supabaseClient
                .from("ventas")
                .select("*")
                .order("fecha",{ascending:false});

        if(ventasResult.error)
            throw ventasResult.error;

        ventas =
            ventasResult.data || [];


        document
            .getElementById("connectionStatus")
            .textContent =
            "● Conectado";


        document
            .getElementById("connectionStatus")
            .style.background =
            "#e9f8ef";


        document
            .getElementById("connectionStatus")
            .style.color =
            "#15803d";


        mostrarInicio();

    }
    catch(error){

        document
            .getElementById("connectionStatus")
            .textContent =
            "● Error de conexión";

        document
            .getElementById("connectionStatus")
            .style.background =
            "#fee2e2";

        document
            .getElementById("connectionStatus")
            .style.color =
            "#b91c1c";

        mostrarError(error);

    }

}


/* =========================================================
   INICIO
========================================================= */

function mostrarInicio(){

    const pares =
        productos.reduce(
            (s,p)=>
            s + Number(p.stock || 0),
            0
        );


    const totalVentas =
        ventas.reduce(
            (s,v)=>
            s + Number(v.total || 0),
            0
        );


    const puntos =
        clientes.reduce(
            (s,c)=>
            s + Number(c.puntos || 0),
            0
        );


    document
        .getElementById("contenido")
        .innerHTML = `

        <div class="page-title">
            Inicio
        </div>

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Productos
                </div>

                <div class="card-value">
                    ${productos.length}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Pares en inventario
                </div>

                <div class="card-value">
                    ${pares}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Clientes
                </div>

                <div class="card-value">
                    ${clientes.length}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Ventas
                </div>

                <div class="card-value">
                    ${dinero(totalVentas)}
                </div>

            </div>

        </div>


        <div class="toolbar">

            <button
                class="btn pink"
                onclick="mostrarVenta()">
                🛒 Nueva venta
            </button>

            <button
                class="btn dark"
                onclick="mostrarProductos()">
                👟 Productos
            </button>

            <button
                class="btn dark"
                onclick="mostrarClientes()">
                👤 Clientes
            </button>

            <button
                class="btn dark"
                onclick="mostrarReportes()">
                📊 Reportes
            </button>

        </div>


        <div class="card">

            <h3>
                Nat.Nation Sneakers
            </h3>

            <p>
                Donde empieza tu estilo.
            </p>

            <p>
                Sistema conectado en línea.
            </p>

        </div>

        `;

}


/* =========================================================
   PRODUCTOS
========================================================= */

function mostrarProductos(){

    document
        .getElementById("contenido")
        .innerHTML = `

        <div class="page-title">
            Productos / Inventario
        </div>


        <div class="toolbar">

            <button
                class="btn pink"
                onclick="nuevoProducto()">
                + Agregar producto
            </button>

            <input
                id="buscarProducto"
                placeholder="Buscar producto..."
                oninput="filtrarProductos()">

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>SKU</th>

                        <th>Modelo</th>

                        <th>Talla</th>

                        <th>Precio</th>

                        <th>Costo</th>

                        <th>Stock</th>

                        <th>Código</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody
                    id="tablaProductos">
                </tbody>

            </table>

        </div>

        `;

    pintarProductos(productos);

}


function pintarProductos(lista){

    const tbody =
        document
            .getElementById("tablaProductos");


    if(!lista.length){

        tbody.innerHTML = `

            <tr>

                <td colspan="8">

                    <div class="empty">

                        No hay productos.

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        lista.map(p=>`

        <tr>

            <td>
                ${esc(p.sku || "-")}
            </td>

            <td>
                <strong>
                    ${esc(p.modelo)}
                </strong>
            </td>

            <td>
                ${esc(p.talla)}
            </td>

            <td>
                ${dinero(p.precio)}
            </td>

            <td>
                ${dinero(p.costo)}
            </td>

            <td>
                <strong>
                    ${p.stock}
                </strong>
            </td>

            <td>
                ${esc(p.codigo_barras || "-")}
            </td>

            <td>

                <button
                    class="btn blue"
                    onclick="editarProducto(${p.id})">
                    Editar
                </button>

                <button
                    class="btn red"
                    onclick="eliminarProducto(${p.id})">
                    Eliminar
                </button>

            </td>

        </tr>

        `).join("");

}


function filtrarProductos(){

    const texto =
        document
            .getElementById("buscarProducto")
            .value
            .toLowerCase();


    const lista =
        productos.filter(p=>

            String(p.modelo || "")
                .toLowerCase()
                .includes(texto)

            ||

            String(p.talla || "")
                .toLowerCase()
                .includes(texto)

            ||

            String(p.sku || "")
                .toLowerCase()
                .includes(texto)

            ||

            String(p.codigo_barras || "")
                .toLowerCase()
                .includes(texto)

        );


    pintarProductos(lista);

}


/* =========================================================
   NUEVO PRODUCTO
========================================================= */

function nuevoProducto(){

    abrirModal(`

        <div class="page-title">
            Agregar producto
        </div>


        <div class="form">

            <div class="form-group">

                <label>
                    SKU
                </label>

                <input
                    id="p_sku">

            </div>


            <div class="form-group">

                <label>
                    Código de barras
                </label>

                <input
                    id="p_codigo">

            </div>


            <div class="form-group full">

                <label>
                    Modelo
                </label>

                <input
                    id="p_modelo"
                    placeholder="Ej. Nike Air Force">

            </div>


            <div class="form-group">

                <label>
                    Talla
                </label>

                <input
                    id="p_talla"
                    placeholder="Ej. 29">

            </div>


            <div class="form-group">

                <label>
                    Precio
                </label>

                <input
                    id="p_precio"
                    type="number"
                    step="0.01">

            </div>


            <div class="form-group">

                <label>
                    Costo
                </label>

                <input
                    id="p_costo"
                    type="number"
                    step="0.01">

            </div>


            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    id="p_stock"
                    type="number"
                    min="0">

            </div>


            <div class="form-actions">

                <button
                    class="btn gray"
                    onclick="cerrarModal()">
                    Cancelar
                </button>

                <button
                    class="btn pink"
                    onclick="guardarProducto()">
                    Guardar
                </button>

            </div>

        </div>

    `);

}


async function guardarProducto(){

    const modelo =
        document
            .getElementById("p_modelo")
            .value
            .trim();


    const talla =
        document
            .getElementById("p_talla")
            .value
            .trim();


    const precio =
        Number(
            document
                .getElementById("p_precio")
                .value || 0
        );


    const costo =
        Number(
            document
                .getElementById("p_costo")
                .value || 0
        );


    const stock =
        Number(
            document
                .getElementById("p_stock")
                .value || 0
        );


    if(!modelo){

        alert("Escribe el modelo.");
        return;

    }


    if(!talla){

        alert("Escribe la talla.");
        return;

    }


    if(precio <= 0){

        alert("Escribe un precio.");
        return;

    }


    const producto = {

        sku:
            document
                .getElementById("p_sku")
                .value
                .trim()
            || null,

        codigo_barras:
            document
                .getElementById("p_codigo")
                .value
                .trim()
            || null,

        modelo:modelo,

        talla:talla,

        precio:precio,

        costo:costo,

        stock:stock,

        activo:true

    };


    const {error} =
        await supabaseClient
            .from("productos")
            .insert(producto);


    if(error){

        mostrarError(error);
        return;

    }


    cerrarModal();

    await cargarTodo();

    mostrarProductos();

}


/* =========================================================
   EDITAR PRODUCTO
========================================================= */

function editarProducto(id){

    const p =
        productos.find(
            x=>x.id===id
        );


    if(!p)
        return;


    abrirModal(`

        <div class="page-title">
            Editar producto
        </div>


        <div class="form">

            <div class="form-group">

                <label>SKU</label>

                <input
                    id="ep_sku"
                    value="${esc(p.sku || "")}">

            </div>


            <div class="form-group">

                <label>
                    Código de barras
                </label>

                <input
                    id="ep_codigo"
                    value="${esc(p.codigo_barras || "")}">

            </div>


            <div class="form-group full">

                <label>
                    Modelo
                </label>

                <input
                    id="ep_modelo"
                    value="${esc(p.modelo)}">

            </div>


            <div class="form-group">

                <label>
                    Talla
                </label>

                <input
                    id="ep_talla"
                    value="${esc(p.talla)}">

            </div>


            <div class="form-group">

                <label>

function buscarCodigoVenta(event){

    if(event.key !== "Enter")
        return;


    const codigo =
        event.target.value.trim();


    const producto =
        productos.find(p=>

            String(p.codigo_barras || "") === codigo

            ||

            String(p.sku || "") === codigo

        );


    if(!producto){

        alert(
            "No encontré ese producto."
        );

        event.target.value="";

        return;

    }


    agregarCarrito(producto.id);

    event.target.value="";

}


function agregarCarrito(id){

    const producto =
        productos.find(
            p=>p.id===id
        );


    if(!producto)
        return;


    const existente =
        carrito.find(
            x=>x.producto.id===id
        );


    const cantidad =
        existente
        ? existente.cantidad
        : 0;


    if(cantidad >= producto.stock){

        alert(
            "No hay más stock disponible."
        );

        return;

    }


    if(existente){

        existente.cantidad++;

    }
    else{

        carrito.push({

            producto:producto,

            cantidad:1

        });

    }


    pintarCarrito();

    actualizarPago();

}


function quitarCarrito(id){

    const index =
        carrito.findIndex(
            x=>x.producto.id===id
        );


    if(index === -1)
        return;


    carrito[index].cantidad--;


    if(carrito[index].cantidad <= 0){

        carrito.splice(index,1);

    }


    pintarCarrito();

    actualizarPago();

}


function pintarCarrito(){

    const cont =
        document
            .getElementById("carrito");


    if(!carrito.length){

        cont.innerHTML = `

                El carrito está vacío.

            </div>

        return;

    cont.innerHTML =
        carrito.map(item=>`

                </strong>

                ×
                ${dinero(item.producto.precio)}

            </div>


            <div>

                <strong>
                    ${dinero(
                        item.cantidad *
                        Number(item.producto.precio)
                    )}
                </strong>

                <br>

                    class="btn gray"
                    onclick="quitarCarrito(${item.producto.id})">

                    −

                </button>

            </div>

        </div>

        `).join("");

}


function totalCarrito(){

    return carrito.reduce(

        (total,item)=>

            total +
            item.cantidad *
            Number(item.producto.precio),

        0

    );

}


function actualizarPago(){

    const total =
        totalCarrito();


    const totalElement =
        document
            .getElementById("totalVenta");


    if(totalElement){

        totalElement.textContent =
            dinero(total);

    }


    const metodo =
        document
            .getElementById("ventaPago")
            ?.value;


    const caja =
        document
            .getElementById("efectivoBox");


    if(caja){

        caja.style.display =
            metodo === "Efectivo"
            ? "block"
            : "none";

    }


    actualizarCambio();

}


function actualizarCambio(){

    const total =
        totalCarrito();


    const recibido =
        Number(
            document
                .getElementById("efectivoRecibido")
                ?.value || 0
        );


    const cambio =
        Math.max(
            0,
            recibido-total
        );


    const elemento =
        document
            .getElementById("cambioVenta");


    if(elemento){

        elemento.textContent =
            "Cambio: " +
            dinero(cambio);

    }

}

========================================================= */

async function finalizarVenta(){

    if(!carrito.length){

        alert(
            "Agrega productos al carrito."
        );

        return;

    }


    const metodo =
        document
            .getElementById("ventaPago")
            .value;


    const clienteId =
        document
            .getElementById("ventaCliente")
            .value
        || null;


    const total =
        totalCarrito();


    let recibido=0;

    let cambio=0;


    if(metodo==="Efectivo"){

        recibido =
            Number(
                document
                    .getElementById("efectivoRecibido")
                    .value || 0
            );


        if(recibido < total){

            alert(
                "El efectivo recibido es menor al total."
            );

            return;

        }


        cambio =
            recibido-total;

    }


    /* =========================
       VALIDAR STOCK
    ========================= */

    for(const item of carrito){

        const {data,error} =
            await supabaseClient
                .from("productos")
                .select("stock")
                .eq("id",item.producto.id)
                .single();


        if(error){

            mostrarError(error);
            return;

        }


        if(
            !data ||
            Number(data.stock) < item.cantidad
        ){

            alert(
                "El producto " +
                item.producto.modelo +
                " ya no tiene suficiente stock."
            );

            await cargarTodo();

            mostrarVenta();

            return;

        }

    }


    /* =========================
       PUNTOS
    ========================= */

    const puntos =
        Math.floor(total / 10);


    /* =========================
       FOLIO 000001...
    ========================= */

    let folio;

    try{

        folio =
            await obtenerSiguienteFolio();

    }
    catch(error){

        mostrarError(error);
        return;

    }


    /* =========================
       CREAR VENTA
    ========================= */

    const {data:venta,error:errorVenta} =
        await supabaseClient
            .from("ventas")
            .insert({

                folio:folio,

                total:total,

                metodo_pago:metodo,

                cliente_id:clienteId,

                efectivo_recibido:recibido,

                cambio:cambio,

                puntos_ganados:puntos

            })
            .select()
            .single();


    if(errorVenta){

        mostrarError(errorVenta);
        return;

    }


    /* =========================
       DETALLES
    ========================= */

    const detalles =
        carrito.map(item=>({

            venta_id:venta.id,

            producto_id:item.producto.id,

            producto_nombre:
                item.producto.modelo,

            talla:
                item.producto.talla,

            cantidad:
                item.cantidad,

            precio_unitario:
                item.producto.precio,

            subtotal:
                item.cantidad *
                Number(item.producto.precio)

        }));


    const {error:errorDetalle} =
        await supabaseClient
            .from("venta_detalles")
            .insert(detalles);


    if(errorDetalle){

        mostrarError(errorDetalle);
        return;

    }


    /* =========================
       ACTUALIZAR STOCK
    ========================= */

    for(const item of carrito){

        const nuevoStock =
            Number(item.producto.stock) -
            item.cantidad;


        const {error} =
            await supabaseClient
                .from("productos")
                .update({
                    stock:nuevoStock
                })
                .eq("id",item.producto.id);


        if(error){

            mostrarError(error);
            return;

        }

    }


    /* =========================
       ACTUALIZAR PUNTOS
    ========================= */

    if(clienteId){

        const cliente =
            clientes.find(
                c=>String(c.id)===String(clienteId)
            );


        if(cliente){

            const nuevosPuntos =
                Number(cliente.puntos || 0) +
                puntos;


            const {error} =
                await supabaseClient
                    .from("clientes")
                    .update({
                        puntos:nuevosPuntos
                    })
                    .eq("id",clienteId);


            if(error){

                mostrarError(error);
                return;

            }

        }

    }


    /* =========================
       TICKET
    ========================= */

    imprimirTicket({

        venta:venta,

        productos:carrito

    });


    carrito=[];


    await cargarTodo();


    alert(
        "Venta registrada.\n\n" +
        "Ticket: " +
        folio
    );


    mostrarVenta();

}

                    id="ec_puntos"
                    type="number"
                    value="${c.puntos || 0}">

            </div>


            <div class="form-actions">

                <button
                    class="btn gray"
                    onclick="cerrarModal()">

                    Cancelar

                </button>


                <button
                    class="btn pink"
                    onclick="actualizarCliente(${id})">

                    Guardar cambios

                </button>

            </div>

        </div>

    `);

}


async function actualizarCliente(id){

    const cambios = {

        nombre:
            document
                .getElementById("ec_nombre")
                .value
                .trim(),

        telefono:
            document
                .getElementById("ec_telefono")
                .value
                .trim()
            || null,

        codigo_tarjeta:
            document
                .getElementById("ec_tarjeta")
                .value
                .trim()
            || null,

        puntos:
            Number(
                document
                    .getElementById("ec_puntos")
                    .value || 0
            )

    };


    const {error} =
        await supabaseClient
            .from("clientes")
            .update(cambios)
            .eq("id",id);


    if(error){

        mostrarError(error);
        return;

    }


    cerrarModal();

    await cargarTodo();

    mostrarClientes();

}


async function eliminarCliente(id){

    if(!confirm(
        "¿Eliminar este cliente?"
    )){
        return;
    }


    const {error} =
        await supabaseClient
            .from("clientes")
            .delete()
            .eq("id",id);


    if(error){

        mostrarError(error);
        return;

    }


    await cargarTodo();

    mostrarClientes();

}

function mostrarReportes(){

    const total =
        ventas.reduce(
            (s,v)=>
            s + Number(v.total || 0),
            0

    const efectivo =
        ventas
            .filter(
                v=>v.metodo_pago==="Efectivo"
            )
            .reduce(
                (s,v)=>
                s + Number(v.total || 0),
                0
            );


    const transferencia =
        ventas
            .filter(
                v=>v.metodo_pago==="Transferencia"
            )
            .reduce(
                (s,v)=>
                s + Number(v.total || 0),
                0
            );


    const tarjeta =
        ventas
            .filter(
                v=>v.metodo_pago==="Tarjeta"
            )
            .reduce(
                (s,v)=>
                s + Number(v.total || 0),
                0
            );


    document
        .getElementById("contenido")
        .innerHTML = `

        <div class="page-title">
            Reportes
        </div>


        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Ventas
                </div>

                <div class="card-value">
                    ${dinero(total)}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Efectivo
                </div>

                <div class="card-value">
                    ${dinero(efectivo)}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Transferencias
                </div>

                <div class="card-value">
                    ${dinero(transferencia)}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Tarjetas
                </div>

                <div class="card-value">
                    ${dinero(tarjeta)}
                </div>

            </div>

        </div>


        <div class="card">

            <h3>
                Últimas ventas
            </h3>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Ticket
                            </th>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Pago
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Puntos
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            ventas.length

                            ?

                            ventas
                                .slice(0,30)
                                .map(v=>`

                                    <tr>

                                        <td>
                                            <strong>
                                                ${esc(v.folio)}
                                            </strong>
                                        </td>

                                        <td>
                                            ${new Date(v.fecha)
                                                .toLocaleString("es-MX")}
                                        </td>

                                        <td>
                                            ${esc(v.metodo_pago)}
                                        </td>

                                        <td>
                                            ${dinero(v.total)}
                                        </td>

                                        <td>
                                            ${v.puntos_ganados || 0}
                                        </td>

                                    </tr>

                                `)
                                .join("")

                            :

                            `

                            <tr>

                                <td colspan="5">

                                    <div class="empty">
                                        Todavía no hay ventas.
                                    </div>

                                </td>

                            </tr>

                            `
                        }

                    </tbody>

                </table>

            </div>

        </div>

        `;

}


/* =========================================================
   ARRANCAR

cargarTodo();

</script>
