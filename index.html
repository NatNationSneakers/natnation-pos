.table-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}th{font-size:13px;color:#777;background:#fafafa}

.sale-layout{display:grid;grid-template-columns:1fr 370px;gap:20px}.sale-products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sale-product{background:#fff;border:1px solid #e5e5e5;border-radius:13px;overflow:hidden;cursor:pointer}.sale-product img,.sale-product .no-photo{width:100%;height:145px;object-fit:cover}.sale-product .no-photo{height:145px}.sale-product-info{padding:10px}.cart{background:#fff;border:1px solid #e5e5e5;border-radius:15px;padding:18px;position:sticky;top:92px;height:max-content}.cart-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.cart-row img{width:48px;height:48px;object-fit:cover;border-radius:7px}.cart-row-info{flex:1}.total-box{margin-top:15px;padding-top:15px;border-top:2px solid #222}.total-line{display:flex;justify-content:space-between;margin:8px 0}.total-line.total{font-size:23px;font-weight:800}.payment-select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.photo-upload{border:2px dashed #ddd;border-radius:14px;padding:18px;text-align:center}.photo-preview{width:150px;height:150px;object-fit:cover;border-radius:12px;display:none;margin:0 auto 12px}.photo-upload input{display:none}.upload-btn{display:inline-block;background:#ef4d8d;color:#fff;padding:11px 18px;border-radius:9px;font-weight:700}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

<body>

<script>
/* =========================================================
   CONFIGURACIÓN SUPABASE
   Pega aquí SOLO la URL y la PUBLISHABLE KEY.
   NO pegues la secret/service_role key.
   ========================================================= */
const SUPABASE_URL = "PEGA_AQUI_TU_SUPABASE_URL";
const SUPABASE_KEY = "PEGA_AQUI_TU_PUBLISHABLE_KEY";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let inventario=[], clientes=[], ventas=[], carrito=[], configuracion={logo:"",puntosPorPeso:0.1};
let paginaActual="venta", fotoTemporal="";

function dinero(n){return Number(n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function abrirModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("show")}
function cerrarModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")cerrarModal()});
function activarNav(id){document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));const b=document.getElementById(id);if(b)b.classList.add("active")}
function errorMsg(e){console.error(e);return e?.message||"Ocurrió un error."}
function requireConfig(){
  if(SUPABASE_URL.includes("PEGA_AQUI")||SUPABASE_KEY.includes("PEGA_AQUI")){
    alert("Primero pega la URL y la Publishable Key de Supabase en index.html.");
    return false;
  }
  return true;
}

/* =========================
   DATOS
   ========================= */
async function cargarDatos(){
  if(!requireConfig())return;
  const [p,c,v]=await Promise.all([
    supabase.from("productos").select("*").eq("activo",true).order("modelo"),
    supabase.from("clientes").select("*").order("nombre"),
    supabase.from("ventas").select("id,folio,fecha,total,pago,efectivo_recibido,cambio,puntos,cliente_id,clientes(nombre)").order("fecha",{ascending:false}).limit(100)
  ]);
  if(p.error)throw p.error;if(c.error)throw c.error;if(v.error)throw v.error;
  inventario=p.data||[];clientes=c.data||[];ventas=v.data||[];
  configuracion=JSON.parse(localStorage.getItem("nn_config")||'{"logo":"","puntosPorPeso":0.1}');
  actualizarLogo();
}

function normalizarProducto(p){
  return {id:p.id,model:p.modelo,size:p.talla,color:p.color||"",sku:p.sku||"",price:Number(p.precio||0),cost:Number(p.costo||0),stock:Number(p.stock||0),photo:p.photo_url||""};
}
function productoActual(i){return inventario[i]}

async function ir(pagina){
  paginaActual=pagina;
  const titulos={venta:"Venta",productos:"Productos",clientes:"Clientes",puntos:"Programa de puntos",reportes:"Reportes",config:"Configuración"};
  document.getElementById("pageTitle").textContent=titulos[pagina]||"Nat.Nation";
  const nav={venta:"navVenta",productos:"navProductos",clientes:"navClientes",puntos:"navPuntos",reportes:"navReportes",config:"navConfig"};
  activarNav(nav[pagina]);
  try{
    await cargarDatos();
    if(pagina==="venta")renderVenta();
    if(pagina==="productos")renderProductos();
    if(pagina==="clientes")renderClientes();
    if(pagina==="puntos")renderPuntos();
    if(pagina==="reportes")renderReportes();
    if(pagina==="config")renderConfig();
  }catch(e){
    document.getElementById("appContent").innerHTML=`<div class="notice"><strong>No se pudo cargar Supabase.</strong><br>${esc(errorMsg(e))}</div>`;
  }
}

/* =========================
   PRODUCTOS
   ========================= */
function renderProductos(){
  const totalExistencias=inventario.reduce((a,p)=>a+Number(p.stock||0),0);
  document.getElementById("appContent").innerHTML=`
    <div class="cards">
      <div class="card"><div class="card-label">Productos</div><div class="card-value">${inventario.length}</div></div>
      <div class="card"><div class="card-label">Pares en existencia</div><div class="card-value">${totalExistencias}</div></div>
      <div class="card"><div class="card-label">Valor del inventario</div><div class="card-value">${dinero(inventario.reduce((a,p)=>a+Number(p.precio||0)*Number(p.stock||0),0))}</div></div>
      <div class="card"><div class="card-label">Stock bajo</div><div class="card-value">${inventario.filter(p=>Number(p.stock)<=2).length}</div></div>
    </div>
    <div class="toolbar"><input id="buscarProducto" class="search" placeholder="🔎 Buscar por modelo, talla, color o SKU..." oninput="filtrarProductos()"><button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button></div>
    <div id="productosGrid" class="product-grid"></div>`;
  pintarProductos(inventario);
}
function pintarProductos(lista){
  const grid=document.getElementById("productosGrid");if(!grid)return;
  if(!lista.length){grid.innerHTML=`<div class="card" style="grid-column:1/-1;text-align:center;padding:50px"><div style="font-size:55px">👟</div><h2>Aún no tienes productos</h2><p>Agrega tu primer par.</p><button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button></div>`;return}
  grid.innerHTML=lista.map(p=>{
    const realIndex=inventario.findIndex(x=>x.id===p.id);
    return `<div class="product-card">${p.photo_url?`<img class="product-photo" src="${p.photo_url}" alt="${esc(p.modelo)}">`:`<div class="no-photo">👟</div>`}<div class="product-info"><div class="product-name">${esc(p.modelo)}</div><div class="product-meta">Talla ${esc(p.talla)}${p.color?" · "+esc(p.color):""}</div>${p.sku?`<div class="product-meta">SKU: ${esc(p.sku)}</div>`:""}<div class="product-price">${dinero(p.precio)}</div><div class="stock ${Number(p.stock)<=2?"low":""}">Existencia: ${p.stock}</div><div class="product-actions"><button class="btn-light" onclick="editarProducto(${realIndex})">✏️ Editar</button><button class="btn-dark" onclick="eliminarProducto(${realIndex})">🗑️</button></div></div></div>`;
  }).join("");
}
function filtrarProductos(){const q=(document.getElementById("buscarProducto")?.value||"").toLowerCase().trim();pintarProductos(inventario.filter(p=>[p.modelo,p.talla,p.color,p.sku].some(x=>String(x||"").toLowerCase().includes(q))))}
function abrirProducto(indice=null){
  const p=indice===null?{}:inventario[indice];fotoTemporal=p.photo_url||"";
  abrirModal(`<button class="close" onclick="cerrarModal()">×</button><h2>${indice===null?"＋ Agregar producto":"✏️ Editar producto"}</h2>
  <div class="form-grid">
    <div class="field"><label>Modelo *</label><input id="prodModelo" value="${esc(p.modelo||"")}" placeholder="Ej. Nike Air Force"></div>
    <div class="field"><label>SKU / Código</label><input id="prodSKU" value="${esc(p.sku||"")}" placeholder="Ej. AF-001"></div>
    <div class="field"><label>Talla *</label><input id="prodTalla" value="${esc(p.talla||"")}" placeholder="Ej. 29"></div>
    <div class="field"><label>Color</label><input id="prodColor" value="${esc(p.color||"")}" placeholder="Ej. Blanco"></div>
    <div class="field"><label>Precio de venta *</label><input id="prodPrecio" type="number" step="0.01" min="0" value="${p.precio??""}"></div>
    <div class="field"><label>Costo</label><input id="prodCosto" type="number" step="0.01" min="0" value="${p.costo??""}"></div>
    <div class="field"><label>Existencia *</label><input id="prodStock" type="number" min="0" step="1" value="${p.stock??""}"></div>
    <div class="field full"><label>Foto (opcional)</label><input id="prodFoto" type="url" value="${esc(p.photo_url||"")}" placeholder="URL de imagen"></div>
  </div>
  <div class="form-actions"><button class="btn btn-light" onclick="cerrarModal()">Cancelar</button><button class="btn btn-pink" onclick="guardarProducto(${indice===null?"null":indice})">💾 Guardar producto</button></div>`);
}
async function guardarProducto(indice){
  const data={modelo:document.getElementById("prodModelo").value.trim(),sku:document.getElementById("prodSKU").value.trim()||null,talla:document.getElementById("prodTalla").value.trim(),color:document.getElementById("prodColor").value.trim(),precio:Number(document.getElementById("prodPrecio").value),costo:Number(document.getElementById("prodCosto").value||0),stock:Number(document.getElementById("prodStock").value),photo_url:document.getElementById("prodFoto").value.trim()||null};
  if(!data.modelo||!data.talla||!Number.isFinite(data.precio)||data.precio<0||!Number.isInteger(data.stock)||data.stock<0){alert("Completa modelo, talla, precio y existencia correctamente.");return}
  if(data.costo<0){alert("El costo no puede ser negativo.");return}
  try{
    const r=indice===null?await supabase.from("productos").insert(data).select().single():await supabase.from("productos").update(data).eq("id",inventario[indice].id).select().single();
    if(r.error)throw r.error;
    cerrarModal();await ir("productos");
  }catch(e){alert("No se pudo guardar el producto: "+errorMsg(e))}
}
function editarProducto(i){abrirProducto(i)}
async function eliminarProducto(i){
  if(!confirm("¿Eliminar este producto del inventario?"))return;
  try{const r=await supabase.from("productos").update({activo:false}).eq("id",inventario[i].id);if(r.error)throw r.error;await ir("productos")}catch(e){alert("No se pudo eliminar: "+errorMsg(e))}
}

/* =========================
   VENTA
   ========================= */
function renderVenta(){
  document.getElementById("appContent").innerHTML=`
  <div class="toolbar"><input id="buscarVenta" class="search" placeholder="🔎 Buscar producto para vender..." oninput="filtrarVenta()"><button class="btn btn-light" onclick="limpiarCarrito()">Vaciar carrito</button></div>
  <div class="sale-layout"><div><div id="saleProducts" class="sale-products"></div></div>
  <aside class="cart"><h2 style="margin-top:0">🛒 Venta actual</h2><div id="cartItems"></div>
  <div class="total-box"><div class="total-line"><span>Subtotal</span><strong id="subtotalVenta">${dinero(0)}</strong></div><div class="total-line total"><span>Total</span><span id="totalVenta">${dinero(0)}</span></div>
  <label style="font-size:13px;font-weight:700">Cliente</label><select id="clienteVenta" class="payment-select"><option value="">Sin cliente</option>${clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}${c.tarjeta?" · "+esc(c.tarjeta):""}</option>`).join("")}</select>
  <label style="font-size:13px;font-weight:700">Forma de pago</label><select id="pagoVenta" class="payment-select" onchange="actualizarPago()"><option value="Efectivo">💵 Efectivo</option><option value="Transferencia">🏦 Transferencia</option><option value="Tarjeta">💳 Tarjeta / Clip</option></select>
  <div id="efectivoBox"><label style="font-size:13px;font-weight:700">Efectivo recibido</label><input id="efectivoRecibido" class="payment-select" type="number" min="0" step="0.01" oninput="actualizarPago()" placeholder="0.00"><div class="total-line"><span>Cambio</span><strong id="cambioVenta">${dinero(0)}</strong></div></div>
  <button class="btn btn-pink" style="width:100%;margin-top:10px" onclick="finalizarVenta()">💳 Cobrar</button></div></aside></div>`;
  pintarVenta(inventario.filter(p=>Number(p.stock)>0));pintarCarrito();
}
function pintarVenta(lista){
  const box=document.getElementById("saleProducts");if(!box)return;
  if(!lista.length){box.innerHTML=`<div class="card" style="grid-column:1/-1;text-align:center;padding:45px"><div style="font-size:50px">👟</div><h2>No hay productos disponibles</h2><p>Agrega productos al inventario para comenzar.</p><button class="btn btn-pink" onclick="abrirProducto()">＋ Agregar producto</button></div>`;return}
  box.innerHTML=lista.map(p=>{const i=inventario.findIndex(x=>x.id===p.id);return `<div class="sale-product" onclick="agregarCarrito(${i})">${p.photo_url?`<img src="${p.photo_url}" alt="${esc(p.modelo)}">`:`<div class="no-photo">👟</div>`}<div class="sale-product-info"><div style="font-weight:800">${esc(p.modelo)}</div><div class="small">Talla ${esc(p.talla)}${p.color?" · "+esc(p.color):""}</div><div style="font-size:18px;font-weight:800;margin-top:5px">${dinero(p.precio)}</div><div class="small">${p.stock} disponibles</div></div></div>`}).join("");
}
function filtrarVenta(){const q=(document.getElementById("buscarVenta")?.value||"").toLowerCase().trim();pintarVenta(inventario.filter(p=>Number(p.stock)>0&&[p.modelo,p.talla,p.color,p.sku].some(x=>String(x||"").toLowerCase().includes(q))))}
function agregarCarrito(i){const p=inventario[i];if(!p||p.stock<=0)return alert("Producto sin existencia.");const x=carrito.find(a=>a.id===p.id);if(x){if(x.qty>=p.stock)return alert("No hay más existencia disponible.");x.qty++}else carrito.push({id:p.id,qty:1});pintarCarrito()}
function quitarCarrito(i){carrito.splice(i,1);pintarCarrito()}
function cambiarCantidad(i,d){const x=carrito[i],p=inventario.find(a=>a.id===x.id);x.qty+=d;if(x.qty<=0)carrito.splice(i,1);else if(x.qty>p.stock)x.qty=p.stock;pintarCarrito()}
function limpiarCarrito(){carrito=[];pintarCarrito()}
function totalCarrito(){return carrito.reduce((s,x)=>{const p=inventario.find(a=>a.id===x.id);return s+Number(p?.precio||0)*x.qty},0)}
function pintarCarrito(){
  const box=document.getElementById("cartItems");if(!box)return;
  box.innerHTML=carrito.length?carrito.map((x,i)=>{const p=inventario.find(a=>a.id===x.id);return `<div class="cart-row">${p.photo_url?`<img src="${p.photo_url}">`:`<div style="width:48px;height:48px;border-radius:7px;background:#eee;display:flex;align-items:center;justify-content:center">👟</div>`}<div class="cart-row-info"><div style="font-weight:700">${esc(p.modelo)}</div><div class="small">Talla ${esc(p.talla)}</div><div>${dinero(p.precio)}</div></div><button class="btn-light" onclick="cambiarCantidad(${i},-1)">−</button><strong>${x.qty}</strong><button class="btn-light" onclick="cambiarCantidad(${i},1)">＋</button><button class="btn-light" onclick="quitarCarrito(${i})">🗑️</button></div>`}).join(""):`<div style="text-align:center;color:#888;padding:30px 5px">El carrito está vacío.<br>Toca un producto para agregarlo.</div>`;
  const t=totalCarrito();document.getElementById("subtotalVenta").textContent=dinero(t);document.getElementById("totalVenta").textContent=dinero(t);actualizarPago();
}
function actualizarPago(){const pago=document.getElementById("pagoVenta");if(!pago)return;const box=document.getElementById("efectivoBox");if(pago.value==="Efectivo"){box.style.display="block";const recibido=Number(document.getElementById("efectivoRecibido")?.value||0);document.getElementById("cambioVenta").textContent=dinero(Math.max(0,recibido-totalCarrito()))}else box.style.display="none"}

async function finalizarVenta(){
  if(!carrito.length)return alert("Agrega al menos un producto.");
  const total=totalCarrito(),pago=document.getElementById("pagoVenta").value,recibido=Number(document.getElementById("efectivoRecibido")?.value||0);
  if(pago==="Efectivo"&&recibido<total)return alert("El efectivo recibido es menor que el total.");
  const clienteId=document.getElementById("clienteVenta").value||null;
  const items=carrito.map(x=>({producto_id:x.id,cantidad:x.qty}));
  try{
    const r=await supabase.rpc("registrar_venta",{p_cliente_id:clienteId,p_pago:pago,p_efectivo:pago==="Efectivo"?recibido:0,p_items:items});
    if(r.error)throw r.error;
    const result=r.data;
    const venta=await supabase.from("ventas").select("id,folio,fecha,total,pago,efectivo_recibido,cambio,puntos,cliente_id,clientes(nombre)").eq("id",result.venta_id).single();
    if(venta.error)throw venta.error;
    imprimirTicket(venta.data);
    carrito=[];await ir("venta");alert(`Venta registrada: ${result.folio}`);
  }catch(e){alert("No se pudo registrar la venta: "+errorMsg(e))}
}

/* =========================
   CLIENTES
   ========================= */
function renderClientes(){
  document.getElementById("appContent").innerHTML=`<div class="toolbar"><input id="buscarCliente" class="search" placeholder="🔎 Buscar cliente..." oninput="filtrarClientes()"><button class="btn btn-pink" onclick="abrirCliente()">＋ Nuevo cliente</button></div><div id="clientesTable"></div>`;
  pintarClientes(clientes);
}
function pintarClientes(lista){
  const box=document.getElementById("clientesTable");if(!box)return;
  box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Tarjeta / código</th><th>Puntos</th><th>Acciones</th></tr></thead><tbody>${lista.length?lista.map(c=>{const i=clientes.findIndex(x=>x.id===c.id);return `<tr><td><strong>${esc(c.nombre)}</strong></td><td>${esc(c.telefono||"")}</td><td>${esc(c.tarjeta||"")}</td><td><strong>${c.puntos||0}</strong></td><td><button class="btn btn-light" onclick="abrirCliente(${i})">✏️</button> <button class="btn btn-dark" onclick="eliminarCliente(${i})">🗑️</button></td></tr>`}).join(""):`<tr><td colspan="5" style="text-align:center;padding:35px">No hay clientes registrados.</td></tr>`}</tbody></table></div>`;
}
function filtrarClientes(){const q=(document.getElementById("buscarCliente")?.value||"").toLowerCase();pintarClientes(clientes.filter(c=>[c.nombre,c.telefono,c.tarjeta].some(x=>String(x||"").toLowerCase().includes(q))))}
function abrirCliente(i=null){const c=i===null?{}:clientes[i];abrirModal(`<button class="close" onclick="cerrarModal()">×</button><h2>${i===null?"＋ Nuevo cliente":"✏️ Editar cliente"}</h2><div class="form-grid"><div class="field"><label>Nombre *</label><input id="cliNombre" value="${esc(c.nombre||"")}" placeholder="Nombre del cliente"></div><div class="field"><label>Teléfono</label><input id="cliTelefono" value="${esc(c.telefono||"")}" placeholder="55..."></div><div class="field full"><label>Tarjeta / código escaneable</label><input id="cliTarjeta" value="${esc(c.tarjeta||"")}" placeholder="Escanea o escribe el código"></div></div><div class="form-actions"><button class="btn btn-light" onclick="cerrarModal()">Cancelar</button><button class="btn btn-pink" onclick="guardarCliente(${i===null?"null":i})">💾 Guardar cliente</button></div>`)}
async function guardarCliente(i){
  const data={nombre:document.getElementById("cliNombre").value.trim(),telefono:document.getElementById("cliTelefono").value.trim(),tarjeta:document.getElementById("cliTarjeta").value.trim()||null};
  if(!data.nombre)return alert("Escribe el nombre del cliente.");
  try{const r=i===null?await supabase.from("clientes").insert(data).select().single():await supabase.from("clientes").update(data).eq("id",clientes[i].id).select().single();if(r.error)throw r.error;cerrarModal();await ir("clientes")}catch(e){alert("No se pudo guardar el cliente: "+errorMsg(e))}
}
async function eliminarCliente(i){if(!confirm("¿Eliminar este cliente?"))return;try{const r=await supabase.from("clientes").delete().eq("id",clientes[i].id);if(r.error)throw r.error;await ir("clientes")}catch(e){alert("No se pudo eliminar: "+errorMsg(e))}}

/* =========================
   PUNTOS
   ========================= */
function renderPuntos(){
  const total=clientes.reduce((a,c)=>a+Number(c.puntos||0),0);
  document.getElementById("appContent").innerHTML=`<div class="cards"><div class="card"><div class="card-label">Clientes</div><div class="card-value">${clientes.length}</div></div><div class="card"><div class="card-label">Puntos acumulados</div><div class="card-value">${total}</div></div></div><div class="card"><h2>⭐ Programa de puntos</h2><p>La base calcula 1 punto por cada $10 MXN.</p></div><br><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Tarjeta</th><th>Puntos</th></tr></thead><tbody>${clientes.map(c=>`<tr><td>${esc(c.nombre)}</td><td>${esc(c.tarjeta||"")}</td><td><strong>${c.puntos||0}</strong></td></tr>`).join("")}</tbody></table></div>`;
}

/* =========================
   REPORTES
   ========================= */
function renderReportes(){
  const total=ventas.reduce((a,v)=>a+Number(v.total||0),0),ef=ventas.filter(v=>v.pago==="Efectivo").reduce((a,v)=>a+Number(v.total||0),0),tr=ventas.filter(v=>v.pago==="Transferencia").reduce((a,v)=>a+Number(v.total||0),0),ta=ventas.filter(v=>v.pago==="Tarjeta").reduce((a,v)=>a+Number(v.total||0),0);
  document.getElementById("appContent").innerHTML=`<div class="cards"><div class="card"><div class="card-label">Ventas</div><div class="card-value">${ventas.length}</div></div><div class="card"><div class="card-label">Ventas totales</div><div class="card-value">${dinero(total)}</div></div><div class="card"><div class="card-label">Efectivo</div><div class="card-value">${dinero(ef)}</div></div><div class="card"><div class="card-label">Tarjeta</div><div class="card-value">${dinero(ta)}</div></div></div><div class="card"><h2>🏦 Formas de pago</h2><p>Transferencia: <strong>${dinero(tr)}</strong></p><p>Tarjeta / Clip: <strong>${dinero(ta)}</strong></p><p>Efectivo: <strong>${dinero(ef)}</strong></p></div><br><div class="table-wrap"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th>Total</th></tr></thead><tbody>${ventas.map(v=>`<tr><td>${esc(v.folio)}</td><td>${new Date(v.fecha).toLocaleString("es-MX")}</td><td>${esc(v.clientes?.nombre||"Público general")}</td><td>${esc(v.pago)}</td><td><strong>${dinero(v.total)}</strong></td></tr>`).join("")}</tbody></table></div>`;
}

/* =========================
   CONFIGURACIÓN
   ========================= */
function renderConfig(){document.getElementById("appContent").innerHTML=`<div class="card"><h2>⚙️ Configuración</h2><p class="muted">El logo se guarda localmente en este navegador.</p><div class="field"><label>URL del logo (opcional)</label><input id="logoUrl" value="${esc(configuracion.logo||"")}" placeholder="https://..."></div><button class="btn btn-pink" style="margin-top:15px" onclick="guardarConfiguracion()">💾 Guardar</button></div>`}
function guardarConfiguracion(){configuracion.logo=document.getElementById("logoUrl").value.trim();localStorage.setItem("nn_config",JSON.stringify(configuracion));actualizarLogo();alert("Configuración guardada.")}
function actualizarLogo(){const img=document.getElementById("logoImg");if(!img)return;if(configuracion.logo)img.src=configuracion.logo;else img.removeAttribute("src")}

/* =========================
   TICKET
   ========================= */
function imprimirTicket(v){
  const nombre=v.clientes?.nombre||"";
  document.getElementById("printArea").innerHTML=`<div style="font-family:Arial,sans-serif;font-size:12px;padding:8px"><div style="text-align:center"><h2 style="margin:0">Nat.Nation Sneakers</h2><div>Donde empieza tu estilo.</div><div style="margin-top:8px">${esc(v.folio)}</div><div>${new Date(v.fecha).toLocaleString("es-MX")}</div></div><hr><div style="margin:7px 0">Venta registrada correctamente.</div><div style="display:flex;justify-content:space-between;font-weight:bold"><span>TOTAL</span><span>${dinero(v.total)}</span></div><div style="margin-top:7px">Pago: ${esc(v.pago)}</div>${v.pago==="Efectivo"?`<div>Recibido: ${dinero(v.efectivo_recibido)}</div><div>Cambio: ${dinero(v.cambio)}</div>`:""}${nombre?`<div>Cliente: ${esc(nombre)}</div>`:""}${v.puntos?`<div>Puntos ganados: ${v.puntos}</div>`:""}<hr><div style="text-align:center">¡Gracias por tu compra!</div></div>`;
  setTimeout(()=>window.print(),100);
}

/* INICIO */
actualizarLogo();
ir("venta");
</script>
</body>
</html>
