<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat.Nation Sneakers | Punto de Venta</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --pink:#f04f91;
  --pink2:#ff72aa;
  --black:#0b0b0d;
  --dark:#151519;
  --dark2:#202026;
  --white:#fff;
  --bg:#f5f5f7;
  --border:#e5e5e8;
  --text:#202024;
  --muted:#777780;
  --green:#159447;
  --red:#c92d3b;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:var(--black);
  color:white;
  padding:22px 16px;
  z-index:100;
  overflow-y:auto;
}

.brand-area{
  text-align:center;
  padding:8px 5px 28px;
}

.logo-img{
  width:78px;
  height:78px;
  object-fit:cover;
  border-radius:18px;
  display:block;
  margin:0 auto 12px;
  background:#222229;
  border:2px solid #292930;
}

.logo-fallback{
  width:78px;
  height:78px;
  border-radius:18px;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  font-size:36px;
  font-weight:900;
}

.brand-name{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.brand-sub{
  color:#ff75aa;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  margin-top:5px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.menu button{
  width:100%;
  padding:14px 15px;
  text-align:left;
  border-radius:11px;
  background:transparent;
  color:#d7d7dc;
  font-weight:700;
  transition:.2s;
}

.menu button:hover{
  background:#25252c;
  color:#fff;
}

.menu button.active{
  background:var(--pink);
  color:#fff;
  box-shadow:0 7px 20px rgba(240,79,145,.22);
}

.sidebar-bottom{
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid #29292e;
}

.sidebar-bottom button{
  width:100%;
  background:#1d1d22;
  color:#ddd;
  padding:12px;
  border-radius:10px;
}

/* ================= MAIN ================= */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:74px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-title{
  font-size:25px;
  font-weight:900;
}

.top-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.status{
  padding:8px 13px;
  border-radius:30px;
  font-size:12px;
  font-weight:bold;
  background:#e9f8ef;
  color:#148340;
}

.content{
  padding:28px;
}

/* ================= BUTTONS ================= */

.btn{
  padding:11px 17px;
  border-radius:9px;
  font-weight:800;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-pink{
  background:var(--pink);
  color:white;
}

.btn-pink:hover{
  background:#dd397b;
}

.btn-black{
  background:var(--black);
  color:white;
}

.btn-light{
  background:#ededf0;
  color:#222;
}

.btn-danger{
  background:var(--red);
  color:#fff;
}

.btn-green{
  background:var(--green);
  color:#fff;
}

/* ================= DASHBOARD ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:24px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.035);
}

.card-label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.card-value{
  margin-top:8px;
  font-size:27px;
  font-weight:900;
}

.card-pink{
  border-top:4px solid var(--pink);
}

/* ================= TOOLBAR ================= */

.toolbar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
}

input,select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d9d9df;
  border-radius:9px;
  background:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(240,79,145,.10);
}

/* ================= TABLE ================= */

.table-wrap{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#fafafa;
  color:#666;
  font-size:12px;
  text-transform:uppercase;
  padding:14px;
  text-align:left;
  border-bottom:1px solid var(--border);
}

td{
  padding:13px 14px;
  border-bottom:1px solid #eeeef1;
  font-size:14px;
}

tr:last-child td{
  border-bottom:0;
}

.product-thumb{
  width:50px;
  height:50px;
  border-radius:9px;
  object-fit:cover;
  background:#eee;
}

.stock-good{
  color:var(--green);
  font-weight:800;
}

.stock-low{
  color:#d17b00;
  font-weight:800;
}

.stock-zero{
  color:var(--red);
  font-weight:800;
}

/* ================= SALE ================= */

.sale-grid{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:20px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.panel-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:15px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.product-card{
  border:1px solid #e3e3e7;
  border-radius:13px;
  overflow:hidden;
  background:#fff;
  cursor:pointer;
  transition:.18s;
}

.product-card:hover{
  border-color:var(--pink);
  transform:translateY(-2px);
  box-shadow:0 7px 18px rgba(0,0,0,.08);
}

.product-photo{
  width:100%;
  height:145px;
  object-fit:cover;
  background:#f0f0f2;
}

.product-info{
  padding:12px;
}

.product-model{
  font-weight:900;
}

.product-meta{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.product-price{
  color:var(--pink);
  font-size:18px;
  font-weight:900;
  margin-top:7px;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-name{
  font-weight:800;
}

.cart-meta{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.qty{
  display:flex;
  align-items:center;
  gap:6px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:7px;
  background:#eee;
  font-weight:bold;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:25px;
  font-weight:900;
  margin-top:20px;
  padding-top:15px;
  border-top:2px solid #eee;
}

.payment-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}

.payment-options button{
  padding:10px 5px;
  border-radius:9px;
  background:#eee;
  font-weight:800;
}

.payment-options button.active{
  background:var(--pink);
  color:#fff;
}

.notice{
  padding:12px 14px;
  border-radius:10px;
  background:#fff4f8;
  color:#a52658;
  margin-bottom:15px;
  font-size:13px;
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  position:relative;
  background:#fff;
  width:min(700px,100%);
  max-height:92vh;
  overflow-y:auto;
  border-radius:18px;
  padding:25px;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#eee;
  font-size:22px;
}

.modal-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
  padding-right:35px;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#666;
  margin-bottom:6px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:22px;
}

.upload-box{
  border:2px dashed #d9d9df;
  border-radius:12px;
  padding:18px;
  text-align:center;
}

.preview{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  display:block;
  margin:0 auto 12px;
  background:#eee;
}

/* ================= EMPTY ================= */

.empty{
  padding:40px;
  text-align:center;
  color:#777;
}

/* ================= REPORT ================= */

.report-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

/* ================= MOBILE ================= */

@media(max-width:1100px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .sale-grid{
    grid-template-columns:1fr;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:750px){
  .sidebar{
    width:205px;
  }

  .main{
    margin-left:205px;
    width:calc(100% - 205px);
  }

  .content{
    padding:18px;
  }

  .topbar{
    padding:0 18px;
  }

  .top-right{
    display:none;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .report-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:580px){
  .sidebar{
    position:static;
    width:100%;
    min-height:auto;
  }

  .app{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .brand-area{
    padding-bottom:15px;
  }

  .menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }

  .sidebar-bottom{
    display:none;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .content{
    padding:12px;
  }
}

/* ================= PRINT ================= */

#printArea{
  display:none;
}

@media print{
  body>*{
    display:none!important;
  }

  #printArea{
    display:block!important;
    width:80mm;
    margin:0 auto;
    font-family:monospace;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="brand-area">
    <div id="logoContainer">
      <div class="logo-fallback">N</div>
    </div>

    <div class="brand-name">Nat.Nation</div>
    <div class="brand-sub">SNEAKERS</div>
  </div>

  <nav class="menu">

    <button id="navInicio" onclick="ir('inicio')">
      🏠 &nbsp; Inicio
    </button>

    <button id="navVenta" onclick="ir('venta')">
      🛒 &nbsp; Nueva venta
    </button>

    <button id="navProductos" onclick="ir('productos')">
      👟 &nbsp; Productos
    </button>

    <button id="navClientes" onclick="ir('clientes')">
      👤 &nbsp; Clientes
    </button>

    <button id="navPuntos" onclick="ir('puntos')">
      ⭐ &nbsp; Puntos
    </button>

    <button id="navReportes" onclick="ir('reportes')">
      📊 &nbsp; Reportes
    </button>

    <button id="navConfig" onclick="ir('config')">
      ⚙️ &nbsp; Configuración
    </button>

  </nav>

  <div class="sidebar-bottom">
    <button onclick="location.reload()">↻ Actualizar sistema</button>
  </div>

</aside>


<main class="main">

  <header class="topbar">

    <div class="page-title" id="pageTitle">
      Inicio
    </div>

    <div class="top-right">

      <div class="status" id="connectionStatus">
        🟡 Conectando...
      </div>

      <button class="btn btn-pink" onclick="ir('venta')">
        ＋ Nueva venta
      </button>

    </div>

  </header>

  <section class="content" id="appContent"></section>

</main>

</div>


<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="cerrarModal()">×</button>

    <div id="modalContent"></div>

  </div>

</div>


<div id="printArea"></div>


<script>

/* ==========================================================
   SUPABASE
   ========================================================== */

const SUPABASE_URL =
"https://nasvzzdzkljozyhhjize.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e98PP2bpEDEfYPFFlQ1wDQ_gSSlHXS7";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================================
   DATOS
   ========================================================== */

let productos = [];
let clientes = [];
let ventas = [];

let carrito = [];

let paginaActual = "inicio";

let pagoSeleccionado = "Efectivo";

let logoURL = "";

let fotoProductoSeleccionada = null;

let productoEditando = null;


/* ==========================================================
   FUNCIONES GENERALES
   ========================================================== */

function dinero(valor){

  return Number(valor || 0).toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function esc(texto){

  return String(texto ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function cerrarModal(){

  document.getElementById("modal")
    .classList.remove("show");

}


function abrirModal(html){

  document.getElementById("modalContent")
    .innerHTML = html;

  document.getElementById("modal")
    .classList.add("show");

}


document.getElementById("modal")
.addEventListener("click",function(e){

  if(e.target.id === "modal"){
    cerrarModal();
  }

});


function mostrarError(error){

  console.error(error);

  alert(
    error?.message ||
    "Ocurrió un error. Revisa la consola."
  );

}


/* ==========================================================
   LOGO
   ========================================================== */

async function cargarLogo(){

  try{

    const resultado =
      supabase.storage
      .from("pos")
      .getPublicUrl("branding/logo");

    const url =
      resultado.data?.publicUrl;

    if(!url) return;

    logoURL = url;

    const contenedor =
      document.getElementById("logoContainer");

    contenedor.innerHTML =
      `<img
        class="logo-img"
        src="${url}?t=${Date.now()}"
        onerror="this.style.display='none'"
      >`;

  }catch(e){

    console.log("Logo no encontrado todavía.");

  }

}


async function subirLogo(){

  const input =
    document.getElementById("logoFile");

  if(!input || !input.files.length){

    alert("Selecciona primero una imagen.");

    return;

  }

  const archivo = input.files[0];

  if(!archivo.type.startsWith("image/")){

    alert("Selecciona una imagen.");

    return;

  }

  try{

    const {error} =
      await supabase.storage
      .from("pos")
      .upload(
        "branding/logo",
        archivo,
        {
          upsert:true,
          contentType:archivo.type,
          cacheControl:"0"
        }
      );

    if(error) throw error;

    await cargarLogo();

    alert("✅ Logo guardado correctamente.");

  }catch(e){

    mostrarError(e);

  }

}


/* ==========================================================
   FOTO DE PRODUCTO
   ========================================================== */

function seleccionarFotoProducto(){

  const input =
    document.getElementById("productoFoto");

  if(!input) return;

  input.onchange = function(){

    if(!this.files.length) return;

    fotoProductoSeleccionada =
      this.files[0];

    const archivo =
      this.files[0];

    const url =
      URL.createObjectURL(archivo);

    const preview =
      document.getElementById("previewProducto");

    if(preview){

      preview.src = url;
      preview.style.display = "block";

    }

  };

}


async function subirFotoProducto(id){

  if(!fotoProductoSeleccionada)
    return null;

  const archivo =
    fotoProductoSeleccionada;

  const extension =
    archivo.name.split(".").pop();

  const nombreSeguro =
    String(archivo.name)
    .replace(/[^a-zA-Z0-9._-]/g,"_");

  const ruta =
    "productos/" +
    id +
    "-" +
    Date.now() +
    "-" +
    nombreSeguro;

  const {error} =
    await supabase.storage
    .from("pos")
    .upload(
      ruta,
      archivo,
      {
        upsert:false,
        contentType:archivo.type
      }
    );

  if(error) throw error;

  const resultado =
    supabase.storage
    .from("pos")
    .getPublicUrl(ruta);

  return resultado.data.publicUrl;

}


/* ==========================================================
   CONEXIÓN
   ========================================================== */

async function comprobarConexion(){

  const estado =
    document.getElementById("connectionStatus");

  try{

    const {error} =
      await supabase
      .from("productos")
      .select("id")
      .limit(1);

    if(error) throw error;

    estado.textContent =
      "🟢 Conectado";

    estado.style.background =
      "#e9f8ef";

    estado.style.color =
      "#15803d";

  }catch(e){

    console.error(e);

    estado.textContent =
      "🔴 Error de conexión";

    estado.style.background =
      "#fff0f1";

    estado.style.color =
      "#b4232d";

  }

}


/* ==========================================================
   CARGAR PRODUCTOS
   ========================================================== */

async function cargarProductos(){

  const {data,error} =
    await supabase
    .from("productos")
    .select("*")
    .eq("activo",true)
    .order("created_at",{ascending:false});

  if(error) throw error;

  productos = data || [];

}


/* ==========================================================
   CARGAR CLIENTES
   ========================================================== */

async function cargarClientes(){

  const {data,error} =
    await supabase
    .from("clientes")
    .select("*")
    .order("nombre",{ascending:true});

  if(error) throw error;

  clientes = data || [];

}


/* ==========================================================
   CARGAR VENTAS
   ========================================================== */

async function cargarVentas(){

  const {data,error} =
    await supabase
    .from("ventas")
    .select(`
      id,
      folio,
      fecha,
      cliente_id,
      total,
      pago,
      efectivo_recibido,
      cambio,
      puntos,
      clientes(nombre)
    `)
    .order("fecha",{ascending:false})
    .limit(500);

  if(error) throw error;

  ventas = data || [];

}


/* ==========================================================
   CARGAR TODO
   ========================================================== */

async function cargarTodo(){

  try{

    await Promise.all([
      cargarProductos(),
      cargarClientes(),
      cargarVentas()
    ]);

    comprobarConexion();

    cargarLogo();

    render();

  }catch(e){

    mostrarError(e);

  }

}


/* ==========================================================
   NAVEGACIÓN
   ========================================================== */

function ir(pagina){

  paginaActual = pagina;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================================
   RENDER PRINCIPAL
   ========================================================== */

function render(){

  const nombres = {

    inicio:"Inicio",
    venta:"Nueva venta",
    productos:"Productos",
    clientes:"Clientes",
    puntos:"Puntos",
    reportes:"Reportes",
    config:"Configuración"

  };

  document.getElementById("pageTitle")
    .textContent =
      nombres[paginaActual] || "Nat.Nation";


  document
    .querySelectorAll(".menu button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const nav =
    document.getElementById(
      "nav" +
      paginaActual.charAt(0).toUpperCase() +
      paginaActual.slice(1)
    );

  if(nav) nav.classList.add("active");


  if(paginaActual === "inicio")
    renderInicio();

  else if(paginaActual === "venta")
    renderVenta();

  else if(paginaActual === "productos")
    renderProductos();

  else if(paginaActual === "clientes")
    renderClientes();

  else if(paginaActual === "puntos")
    renderPuntos();

  else if(paginaActual === "reportes")
    renderReportes();

  else if(paginaActual === "config")
    renderConfig();

}


/* ==========================================================
   INICIO
   ========================================================== */

function filtrarProductosVenta(){

  const q =
    document.getElementById("buscarVenta")
    ?.value
    .toLowerCase()
    .trim() || "";

  const filtrados =
    productos.filter(p=>

      String(p.modelo||"")
      .toLowerCase()
      .includes(q)

      ||

      String(p.sku||"")
      .toLowerCase()
      .includes(q)

      ||

      String(p.talla||"")
      .toLowerCase()
      .includes(q)

      ||

      String(p.color||"")
      .toLowerCase()
      .includes(q)

    );


  document.getElementById("productosVenta")
    .innerHTML =
      productosVentaHTML(filtrados);

}


function agregarAlCarrito(id){

  const producto =
    productos.find(p=>p.id===id);

  if(!producto) return;


  const stock =
    Number(producto.stock || 0);

  if(stock<=0){

    alert("Este producto no tiene stock.");

    return;

  }


  const existente =
    carrito.find(i=>i.producto_id===id);


  if(existente){

    if(
      existente.cantidad >= stock
    ){

      alert("No hay más unidades disponibles.");

      return;

    }

    existente.cantidad++;

  }else{

    carrito.push({

      producto_id:producto.id,

      modelo:producto.modelo,

      talla:producto.talla,

      color:producto.color,

      precio:Number(producto.precio || 0),

      cantidad:1

    });

  }


  renderVenta();

}


function carritoHTML(){

  if(!carrito.length){

    return `
      <div class="empty">
        Tu carrito está vacío.
        <br>
        Selecciona un producto para comenzar.
      </div>
    `;

  }


  return carrito.map((i,index)=>`

    <div class="cart-row">

      <div>

        <div class="cart-name">
          ${esc(i.modelo)}
        </div>

        <div class="cart-meta">
          Talla ${esc(i.talla)}
          ${i.color ? " · "+esc(i.color) : ""}
        </div>

        <div class="cart-meta">
          ${dinero(i.precio)} c/u
        </div>

      </div>


      <div style="text-align:right">

        <div class="qty">

          <button
            onclick="cambiarCantidad(${index},-1)">
            −
          </button>

          <strong>
            ${i.cantidad}
          </strong>

          <button

            +
          </button>

          <button
            style="background:#ffe5ea;color:#b4232d"
            onclick="eliminarCarrito(${index})">
            ×
          </button>

        </div>

          ${dinero(i.precio*i.cantidad)}
        </div>

      </div>

    </div>

  `).join("");

}


function cambiarCantidad(index,cambio){

  const item =
    carrito[index];

  const producto =
    productos.find(
      p=>p.id===item.producto_id
    );

  if(!producto) return;


  const nueva =
    item.cantidad + cambio;


  if(nueva<=0){

    carrito.splice(index,1);

  }else if(
    nueva > Number(producto.stock)
  ){

    alert("No hay suficiente stock.");

    return;

  }else{

    item.cantidad=nueva;

  }


  renderVenta();

}


function eliminarCarrito(index){

  carrito.splice(index,1);

  renderVenta();

}


function vaciarCarrito(){

  carrito=[];

  renderVenta();

}


function seleccionarPago(pago){

  pagoSeleccionado=pago;

  renderVenta();

}


function actualizarCambio(){

  const total =
    carrito.reduce(
      (s,i)=>s + Number(i.precio)*Number(i.cantidad),
      0
    );

  const recibido =
    Number(
      document.getElementById(
        "efectivoRecibido"
      )?.value || 0
    );

  const cambio =
    Math.max(0,recibido-total);


  const elemento =
    document.getElementById("cambioTexto");

  if(elemento){

    elemento.textContent =
      "Cambio: " + dinero(cambio);

  }

}

async function finalizarVenta(){

  if(!carrito.length){

    alert("Agrega al menos un producto.");

    return;

  }


  const cliente =
    document.getElementById(
      "clienteVenta"
    )?.value || null;


  const total =
    carrito.reduce(
      (s,i)=>
        s +
        Number(i.precio) *
        Number(i.cantidad),
      0
    );


  let efectivo = 0;


  if(pagoSeleccionado==="Efectivo"){

    efectivo =
      Number(
        document.getElementById(
          "efectivoRecibido"
        )?.value || 0
      );


    if(efectivo < total){

      alert(
        "El efectivo recibido es menor al total."
      );

      return;

    }

  }


  if(!confirm(
    "¿Registrar esta venta por " +
    dinero(total) +
    "?"
  )) return;


  try{

    const items =
      carrito.map(i=>({

        producto_id:i.producto_id,

        cantidad:i.cantidad

      }));


    const {data,error} =
      await supabase.rpc(
        "registrar_venta",
        {
          p_cliente_id:cliente,
          p_pago:pagoSeleccionado,
          p_efectivo:efectivo,
          p_items:items
        }
      );


    if(error) throw error;


    let ventaId=null;
    let folio=null;


    if(Array.isArray(data)){

      ventaId=data[0]?.venta_id;
      folio=data[0]?.folio;

    }else{

      ventaId=data?.venta_id;
      folio=data?.folio;

    }


    await cargarTodo();


    imprimirTicket(
      folio,
      ventaId,
      cliente,
      efectivo
    );


    carrito=[];

    pagoSeleccionado="Efectivo";

    ir("venta");


    setTimeout(()=>{

      alert(
        "✅ Venta registrada correctamente."
        +
        (folio ? "\nFolio: "+folio : "")
      );

    },200);


  }catch(e){

    mostrarError(e);

  }

}

    talla:
      document.getElementById("pTalla")
      .value.trim(),

    color:
      document.getElementById("pColor")
      .value.trim(),

    precio:
      Number(
        document.getElementById("pPrecio")
        .value || 0
      ),

    costo:
      Number(
        document.getElementById("pCosto")
        .value || 0
      ),

    stock:
      Number(
        document.getElementById("pStock")
        .value || 0
      ),

    activo:true

  };


  if(!datos.modelo){

    alert("Escribe el modelo.");

    return;

  }


  if(datos.precio<0){

    alert("El precio no puede ser negativo.");

    return;

  }


  try{

    let productoId;


    if(productoEditando){

      const {error} =
        await supabase
        .from("productos")
        .update(datos)
        .eq("id",productoEditando.id);

      if(error) throw error;

      productoId=productoEditando.id;

    }else{

      const {data,error} =
        await supabase
        .from("productos")
        .insert(datos)
        .select("id")
        .single();

      if(error) throw error;

      productoId=data.id;

    }


    if(fotoProductoSeleccionada){

      const url =
        await subirFotoProducto(productoId);


      if(url){

        const {error} =
          await supabase
          .from("productos")
          .update({
            photo_url:url
          })
          .eq("id",productoId);

        if(error) throw error;

      }

    }


    cerrarModal();

    await cargarTodo();

    ir("productos");

  }catch(e){

    mostrarError(e);

  }

}


async function eliminarProducto(id){

  const producto =
    productos.find(p=>p.id===id);

  if(!producto) return;


  if(!confirm(
    "¿Eliminar " +
    producto.modelo +
    "?"
  )) return;


  try{

    const {error} =
      await supabase
      .from("productos")
      .update({
        activo:false
      })
      .eq("id",id);

    if(error) throw error;

    await cargarTodo();

    ir("productos");

  }catch(e){

    mostrarError(e);

  }

}

function filtrarClientes(){

  const q =
    document.getElementById(
      "buscarCliente"
    )?.value
    .toLowerCase()
    .trim() || "";


  const lista =
    clientes.filter(c=>

      String(c.nombre||"")
      .toLowerCase()
      .includes(q)

      ||

      String(c.telefono||"")
      .toLowerCase()
      .includes(q)

      ||

      String(c.tarjeta||"")
      .toLowerCase()
      .includes(q)

    );


  document.getElementById(
    "clientesTabla"
  ).innerHTML =
    clientesTablaHTML(lista);

}


function abrirCliente(id=null){

  const cliente =
    id
    ?
    clientes.find(c=>c.id===id)
    :
    null;


  abrirModal(`

    <div class="modal-title">

      ${cliente
        ?"Editar cliente"
        :"Nuevo cliente"}

    </div>


    <div class="form">

      <div class="field form-full">

        <label>Nombre</label>

        <input
          id="cNombre"
          value="${esc(cliente?.nombre || "")}"
          placeholder="Nombre completo"
        >

      </div>


      <div class="field">

        <label>Teléfono</label>

        <input
          id="cTelefono"
          value="${esc(cliente?.telefono || "")}"
          placeholder="562..."
        >

      </div>


      <div class="field">

        <label>Tarjeta de puntos</label>

        <input
          id="cTarjeta"
          value="${esc(cliente?.tarjeta || "")}"
          placeholder="Número o código"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="cerrarModal()">
        Cancelar
      </button>

      <button
        class="btn btn-pink"
        onclick="guardarCliente('${id || ""}')">
        Guardar
      </button>

    </div>

  `);

}


async function guardarCliente(id){

  const datos={

    nombre:
      document.getElementById(
        "cNombre"
      ).value.trim(),

    telefono:
      document.getElementById(
        "cTelefono"
      ).value.trim(),

    tarjeta:
      document.getElementById(
        "cTarjeta"
      ).value.trim()

  };


  if(!datos.nombre){

    alert("Escribe el nombre.");

    return;

  }


  try{

    if(id){

      const {error} =
        await supabase
        .from("clientes")
        .update(datos)
        .eq("id",id);

      if(error) throw error;

    }else{

      const {error} =
        await supabase
        .from("clientes")
        .insert({
          ...datos,
          puntos:0
        });

      if(error) throw error;

    }


    cerrarModal();

    await cargarTodo();

    ir("clientes");

  }catch(e){

    mostrarError(e);

  }

}

function formatearFecha(fecha){

  if(!fecha) return "-";

  try{

    return new Date(fecha)
      .toLocaleString("es-MX");

  }catch(e){

    return fecha;

  }

}
